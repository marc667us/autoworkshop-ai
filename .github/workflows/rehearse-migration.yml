name: Rehearse Migration On Live

# ══════════════════════════════════════════════════════════════════════════
# WHY THIS EXISTS — three sessions and three migrations of evidence
# ══════════════════════════════════════════════════════════════════════════
#
# Adopted from Solar's `apply-migration-037-*.yml` at the owner's request,
# 2026-08-06. It is the one pipeline pattern this repository did NOT already
# have, and it maps exactly onto its most expensive recorded failure.
#
# `infrastructure/migrations/verify/*` runs against the LOCAL Postgres, where
# the connected role is a SUPERUSER. On Render it is not — it is merely the
# table owner, and `FORCE ROW LEVEL SECURITY` binds owners too. So a policy that
# is inert locally is enforced live, and a verify can pass 9/9 against a defect
# that exists only in production. That is not hypothetical:
#
#   036  verify passed 9/9         -> registration 500'd on live (RLS on INSERT)
#   037  fixed the WRITE path      -> the READ path was still broken
#   038  fixed the bootstrap door  -> the app still could not see the membership
#   039  SECURITY DEFINER IS NOT AN RLS EXEMPTION
#
# Three sessions during which the owner could not create a workshop at all.
# Every one of those would have been caught in minutes by running the migration
# AND its verify against the real database, as the real role, before applying.
#
# ══════════════════════════════════════════════════════════════════════════
# 🔴 WHAT MAKES THIS SAFE: BEGIN -> apply -> verify -> ROLLBACK
# ══════════════════════════════════════════════════════════════════════════
#
# Everything runs inside ONE transaction that is ALWAYS rolled back. Nothing
# persists — not the schema change, not the ledger row, not the test data. What
# it borrows from production is the one thing that cannot be borrowed any other
# way: the real ROLE, the real privileges, the real FORCE RLS.
#
# ⚠️ AND A GREEN DRY RUN THAT CHANGES NOTHING IS NOT A TEST. That is the trap
# this account has already fallen into — "a step gated on confirm == APPLY has
# never run". So this workflow does not preview SQL. It EXECUTES the migration
# and then EXECUTES its verify, for real, against live; only the COMMIT is
# withheld. A rehearsal that passes has genuinely run.
#
# ⚠️ IT IS NOT A SUBSTITUTE FOR THE LOCAL VERIFY — it is the second half. Run
# the local one for speed, this one for truth, in that order.
#
# ⚠️ TRANSACTIONAL DDL ONLY. Postgres can roll back CREATE TABLE, ALTER TABLE,
# CREATE POLICY and CREATE FUNCTION. It cannot roll back CREATE INDEX
# CONCURRENTLY or CREATE DATABASE. A migration containing those fails here
# loudly rather than half-persisting — the correct outcome, but it means such a
# migration needs its own rehearsal path.
#
# ⚠️ IT TOUCHES THE PRODUCTION DATABASE. It takes locks for the length of the
# transaction, so do not run it during a deploy or against a busy moment.

on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Migration basename, e.g. 041_reception (no .sql). Its verify/ script runs too, if one exists.'
        required: true
      tenant_id:
        # 🔴 REQUIRED FOR ANY VERIFY THAT WRITES TENANT-OWNED ROWS.
        #
        # `identity.tenants` is readable only by the tenant it belongs to
        # (`USING id = current_tenant_id()`), so a fixture cannot discover one.
        # Locally the superuser can, which is exactly why a verify passes there
        # while proving nothing. Supply the tenant to rehearse as.
        description: 'Tenant uuid to establish context as. Needed by verifies that write rows.'
        required: false
        default: ''
      database:
        # The Render SERVICE name, which is `autoworkshop-postgres` — not the
        # database name inside it. Getting this wrong is a clean failure ("no
        # database named autoworkshop", with the visible list printed), which is
        # how the first run of this workflow found it.
        description: 'Render Postgres service name'
        required: false
        default: 'autoworkshop-postgres'

permissions:
  contents: read

# 🔴 ONE REHEARSAL AT A TIME. Two concurrent runs BROKE EACH OTHER on
# 2026-08-07: each adds an ephemeral entry to the Render database firewall and
# each restore step writes back the list it captured at ITS start — so the
# second run to finish setting up had its entry removed by the first to finish,
# and the survivor died mid-post-check with
#
#     psql: error: SSL connection has been closed unexpectedly
#
# which reads like a database fault and is not one. The migration under test was
# fine; the harness was standing on its own foot.
#
# ⚠️ `cancel-in-progress: false` — a rehearsal in flight has ALTERED THE
# firewall and must be allowed to reach its `always()` restore step. Cancelling
# it would leave production reachable from a runner IP nobody is tracking.
concurrency:
  group: rehearse-migration-on-live
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      DB_NAME: ${{ inputs.database }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse without a key
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY is not set on this repository"
            exit 1
          fi

      # ⚠️ ABSOLUTE PATH, AND THE VERSION IS ASSERTED. Solar lost a run to a job
      # that installed postgresql-client-18 and then called bare `psql`, which
      # PATH resolved to Ubuntu's bundled 16.x. Echoing a version is not a check
      # — this fails if the binary is not the one that was installed.
      - name: Install a matching psql
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg >/dev/null
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          PSQL=/usr/lib/postgresql/17/bin/psql
          test -x "$PSQL" || { echo "::error::$PSQL is not executable"; exit 1; }
          "$PSQL" --version
          "$PSQL" --version | grep -q ' 17\.' || {
            echo "::error::psql at $PSQL is not the installed 17.x"; exit 1; }
          echo "PSQL_BIN=$PSQL" >> "$GITHUB_ENV"

      - name: Find the database and read its connection string
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/pg.json -w '%{http_code}' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' \
            "https://api.render.com/v1/postgres?limit=50")"
          echo "GET /v1/postgres -> $code"
          [ "$code" = "200" ] || { echo "::error::could not list databases"; exit 1; }

          python3 - <<'PY'
          import json, os, sys
          rows = json.load(open('/tmp/pg.json'))
          want = os.environ['DB_NAME']
          print('databases visible to this key:')
          found = ''
          for r in rows:
              d = r.get('postgres', r)
              print(f"  - {d.get('name')}  status={d.get('status')}")
              if d.get('name') == want:
                  found = d.get('id')
                  status = d.get('status')
          if not found:
              sys.exit(f"::error::no database named {want}")
          # A database that is still creating cannot be migrated, and the error
          # psql would give ("could not connect") names the symptom rather than
          # this cause.
          if status not in ('available', 'creating'):
              sys.exit(f"::error::{want} is '{status}', not available")
          if status == 'creating':
              print(f"::warning::{want} is still creating; the connection may not be ready")
          open('/tmp/db_id', 'w').write(found)
          PY
          ID="$(cat /tmp/db_id)"
          echo "database id: $ID"

          # The connection string is fetched PER RUN and never stored in the
          # repo — Solar's pattern. It is written to a file rather than an env
          # var so it cannot land in a command line or in the step log.
          code="$(curl -sS -o /tmp/conn.json -w '%{http_code}' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' \
            "https://api.render.com/v1/postgres/${ID}/connection-info")"
          [ "$code" = "200" ] || { echo "::error::could not read connection info ($code)"; exit 1; }

          python3 - <<'PY'
          import json
          info = json.load(open('/tmp/conn.json'))
          url = info.get('externalConnectionString') or info.get('internalConnectionString')
          if not url:
              raise SystemExit('::error::no connection string in the response')
          open('/tmp/dburl', 'w').write(url)
          # Never print the URL. Only its shape, so a failure is diagnosable.
          print('connection string acquired:', url.split('@')[-1].split('/')[0][:4] + '…')
          PY
          chmod 600 /tmp/dburl

      # 🔴 RENDER BLOCKS EXTERNAL CONNECTIONS BY IP, AND THE ERROR DOES NOT SAY
      # SO. The first run of this workflow reached the database and psql
      # reported "SSL connection has been closed unexpectedly" — which reads
      # like a TLS fault and is in fact Render dropping a connection from an
      # address that is not on the database's allow list.
      #
      # ⚠️ A SINGLE /32 FOR THIS RUNNER, NOT 0.0.0.0/0. A GitHub runner takes a
      # different public address every run, so the lazy fix is to open the
      # database to the whole internet and leave it that way. This adds only the
      # address in use and RESTORES THE ORIGINAL LIST in an `if: always()` step,
      # so a failed run cannot leave the database more exposed than it found it.
      - name: Allow this runner through the database firewall
        run: |
          set -euo pipefail
          ID="$(cat /tmp/db_id)"
          IP="$(curl -sS --max-time 20 https://api.ipify.org)"
          echo "$IP" | grep -Eq '^[0-9.]+$' || { echo "::error::could not read runner IP"; exit 1; }
          echo "runner address: $IP"

          curl -sS -o /tmp/pg_one.json \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' \
            "https://api.render.com/v1/postgres/${ID}"

          python3 - "$IP" <<'PY'
          import json, sys
          ip = sys.argv[1]
          d = json.load(open('/tmp/pg_one.json'))
          d = d.get('postgres', d)
          original = d.get('ipAllowList') or []
          json.dump(original, open('/tmp/ip_allow_original.json', 'w'))
          print('existing allow list entries:', len(original))
          merged = list(original) + [{'cidrBlock': f'{ip}/32',
                                      'description': 'ephemeral: apply-migrations run'}]
          json.dump({'ipAllowList': merged}, open('/tmp/ip_allow_patch.json', 'w'))
          PY

          code="$(curl -sS -o /tmp/patch_out.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data @/tmp/ip_allow_patch.json \
            "https://api.render.com/v1/postgres/${ID}")"
          echo "PATCH ipAllowList -> $code"
          [ "$code" = "200" ] || { echo "::error::could not update the allow list"; cat /tmp/patch_out.json; exit 1; }

          # Render applies the rule asynchronously; connecting immediately races it.
          sleep 20

      - name: Rehearse — apply, run the verify, assert, ROLLBACK
        env:
          MIGRATION: ${{ inputs.migration }}
          TENANT_ID: ${{ inputs.tenant_id }}
        run: |
          set -euo pipefail
          export DATABASE_URL="$(cat /tmp/dburl)"

          SQL="infrastructure/migrations/${MIGRATION}.sql"
          VERIFY="infrastructure/migrations/verify/${MIGRATION}.sql"
          [ -f "$SQL" ] || { echo "::error::no such migration: $SQL"; exit 1; }

          # Who are we, really? The whole point of rehearsing on live is that
          # this answer differs from the local one, so PRINT it — a rehearsal
          # that silently ran as a superuser would prove nothing and would look
          # identical to one that proved everything.
          echo "::group::the role this rehearsal runs as"
          "${PSQL_BIN}" -v ON_ERROR_STOP=1 "$DATABASE_URL" -tA -c "
            SELECT 'connected as ' || current_user
                || ' | superuser=' || (SELECT rolsuper::text FROM pg_roles WHERE rolname = current_user)
                || ' | bypassrls=' || (SELECT rolbypassrls::text FROM pg_roles WHERE rolname = current_user);"
          echo "::endgroup::"

          # ⚠️ REFUSE TO RUN AS A SUPERUSER. A superuser bypasses every RLS
          # policy, so the rehearsal would pass exactly as the local verify
          # already does — and report success about the one thing it exists to
          # check. verify/039 needed this same guard for the same reason.
          IS_SUPER="$("${PSQL_BIN}" -tA "$DATABASE_URL" -c \
            "SELECT (rolsuper OR rolbypassrls) FROM pg_roles WHERE rolname = current_user")"
          if [ "$IS_SUPER" = "t" ]; then
            echo "::error::this connection bypasses RLS, so a rehearsal here would prove nothing about production. Refusing."
            exit 1
          fi

          # 🔴 IS IT ALREADY APPLIED? Re-running a migration's DDL over itself is
          # not a rehearsal — it is a different operation with different failure
          # modes. 042 re-run against the live schema failed with
          #
          #   cannot drop constraint uq_invoice_id_tenant ... other objects depend on it
          #
          # because `DROP CONSTRAINT IF EXISTS` is fine on a fresh database and
          # not fine once the FK that needs it exists. That says nothing about
          # whether the migration was safe to apply, and reading it as a failure
          # of the migration would be wrong.
          #
          # So: when the migration is already applied, rehearse the VERIFY ALONE
          # against the live schema. That is the more useful thing anyway — it
          # re-proves the rules under production privileges without touching DDL.
          ALREADY="$("${PSQL_BIN}" -tA "$DATABASE_URL" -c             "SELECT count(*) FROM schema_migrations WHERE version = '${MIGRATION}'" 2>/dev/null || echo 0)"
          if [ "$ALREADY" != "0" ]; then
            echo "::notice::${MIGRATION} is ALREADY APPLIED on this database — rehearsing its verify alone, no DDL."
          fi

          {
            echo "BEGIN;"
            # Establish the tenant context BEFORE anything runs, so a verify sees
            # the same world the application does. Transaction-local, so the
            # ROLLBACK takes it with everything else.
            if [ -n "${TENANT_ID:-}" ]; then
              echo "SELECT set_config('app.tenant_id', '${TENANT_ID}', true);"
            fi
            if [ "$ALREADY" = "0" ]; then
              cat "$SQL"
            fi
            if [ -f "$VERIFY" ]; then
              cat "$VERIFY"
            else
              echo "SELECT 'no verify script for ${MIGRATION}; schema change rehearsed only' AS note;"
            fi
            echo "ROLLBACK;"
          } > /tmp/rehearse_raw.sql

          # 🔴 THE MIGRATION FILES CARRY THEIR OWN BEGIN/COMMIT, and an inner
          # COMMIT would END the outer transaction and PERSIST everything — the
          # exact opposite of what this workflow promises. Strip the migration's
          # own transaction control, keeping only the wrapper's.
          python3 - <<'PY'
          import re

          # 🔴 ONLY AT THE TOP LEVEL. A plpgsql function body is FULL of BEGIN
          # and END, and they are not transaction control — they are the
          # language's block syntax:
          #
          #     CREATE FUNCTION f() ... AS $$
          #     BEGIN                      <- NOT a transaction
          #         IF ... THEN ... END IF;
          #     END;                       <- NOT a commit
          #     $$;
          #
          # The first version of this stripper commented those out and produced
          # `syntax error at or near "IF"` on migration 041's append-only
          # trigger. Found by running this workflow for real against live, which
          # is the entire argument for the workflow existing: a rehearsal that
          # only previewed SQL would have reported success.
          #
          # So track dollar-quoted blocks ($$ ... $$ and $tag$ ... $tag$) and
          # leave everything inside them completely alone.
          # 🔴 THE FULL GRAMMAR, NOT THE COMMON SPELLING. The first version
          # matched only the exact strings BEGIN / COMMIT / END / START
          # TRANSACTION. Postgres also accepts:
          #
          #     COMMIT WORK;   COMMIT TRANSACTION;   COMMIT AND CHAIN;
          #     END WORK;      END TRANSACTION;      commit  ;
          #
          # Every one of those escaped BOTH the stripper and the backstop below,
          # which means a migration written in any of them would have COMMITTED
          # TO PRODUCTION from a workflow whose entire promise is that nothing
          # persists. Found by injecting the variants rather than by reading the
          # code — the same method that caught planned-workshop.spec.ts passing
          # 4/4 with its real defect re-injected.
          OPEN_RE  = re.compile(r'(?i)^\s*(begin|start\s+transaction)\b[^;]*;\s*$')
          CLOSE_RE = re.compile(r'(?i)^\s*(commit|end)\b(\s+(work|transaction))?'
                                r'(\s+and(\s+no)?\s+chain)?\s*;\s*$')

          TAG_RE = re.compile(r'\$[A-Za-z_][A-Za-z0-9_]*\$|\$\$')

          # 🔴 A1 — WHY A `$$` TOGGLE IS NOT ENOUGH. Found by Codex, 2026-08-06.
          #
          # The first version counted every `$$` it saw ANYWHERE on a line. A
          # migration carrying
          #
          #     -- $$ mentions a dollar quote in a comment
          #     COMMIT;
          #     -- $$
          #
          # left BOTH the stripper and the survivor scan believing they were
          # inside a dollar-quoted body across that COMMIT. Two guards, one
          # blind spot, and the COMMIT would have reached production from the
          # workflow whose entire promise is that nothing persists.
          #
          # Postgres does not read it that way, so neither may we. At the top
          # level a `$$` inside a line comment, a block comment or a string
          # literal is not a dollar quote at all. INSIDE a dollar-quoted body it
          # is the opposite: the closing tag is scanned literally, and a `--`
          # does NOT hide it — so the body-side rule must stay dumb on purpose.
          #
          # Hence a real lexer rather than a toggle: line comments, NESTED block
          # comments (Postgres nests them), single-quoted strings with their ''
          # escape, and dollar quotes.
          def line_top_level(sql):
              """Whether the lexer is at top level as each line BEGINS."""
              states = [True]
              i, n = 0, len(sql)
              dq, in_str, in_line_comment, block_depth = None, False, False, 0
              while i < n:
                  ch = sql[i]
                  if ch == '\n':
                      in_line_comment = False
                      i += 1
                      states.append(dq is None and not in_str and block_depth == 0)
                      continue
                  if in_line_comment:
                      i += 1; continue
                  if block_depth:
                      if sql.startswith('/*', i): block_depth += 1; i += 2; continue
                      if sql.startswith('*/', i): block_depth -= 1; i += 2; continue
                      i += 1; continue
                  if in_str:
                      if ch == "'":
                          if sql.startswith("''", i): i += 2; continue
                          in_str = False
                      i += 1; continue
                  if dq is not None:
                      # Only the matching tag closes it. Comments do not apply
                      # here — this mirrors Postgres, it is not an oversight.
                      m = TAG_RE.match(sql, i)
                      if m and m.group(0) == dq:
                          dq = None; i += len(m.group(0)); continue
                      i += 1; continue
                  # ── top level ──
                  if sql.startswith('--', i): in_line_comment = True; i += 2; continue
                  if sql.startswith('/*', i): block_depth = 1; i += 2; continue
                  if ch == "'": in_str = True; i += 1; continue
                  m = TAG_RE.match(sql, i)
                  if m: dq = m.group(0); i += len(m.group(0)); continue
                  i += 1
              return states, dq, in_str, block_depth

          # Prove the LEXER before trusting it, on the exact shape Codex found.
          # A guard is only worth having if its failure is demonstrated.
          _probe = "-- $$\nCOMMIT;\n-- $$\n"
          if not line_top_level(_probe)[0][1]:
              raise SystemExit('::error::self-check failed: a `$$` inside a LINE COMMENT '
                               'still hides a top-level COMMIT from the stripper')
          _probe = "SELECT '$$';\nCOMMIT;\n"
          if not line_top_level(_probe)[0][1]:
              raise SystemExit('::error::self-check failed: a `$$` inside a STRING LITERAL '
                               'still hides a top-level COMMIT from the stripper')
          _probe = "/* $$ */\nCOMMIT;\n"
          if not line_top_level(_probe)[0][1]:
              raise SystemExit('::error::self-check failed: a `$$` inside a BLOCK COMMENT '
                               'still hides a top-level COMMIT from the stripper')
          # …and the must-NOT-catch direction: a real body must still be hidden,
          # or the stripper comments out plpgsql `END;` and breaks the migration.
          _probe = "CREATE FUNCTION f() RETURNS void AS $$\nBEGIN\nEND;\n$$ LANGUAGE plpgsql;\n"
          if line_top_level(_probe)[0][2]:
              raise SystemExit('::error::self-check failed: a plpgsql body is being read as '
                               'top level — its END; would be wrongly stripped')

          raw = open('/tmp/rehearse_raw.sql', encoding='utf-8').read()
          lines = raw.split('\n')
          states, dq_left, str_left, blk_left = line_top_level(raw)
          if dq_left is not None:
              raise SystemExit('::error::unbalanced dollar-quote (%s) — refusing to run a rehearsal built from SQL this did not parse' % dq_left)
          if str_left:
              raise SystemExit('::error::unterminated string literal — refusing to run a rehearsal built from SQL this did not parse')
          if blk_left:
              raise SystemExit('::error::unterminated block comment — refusing to run a rehearsal built from SQL this did not parse')

          out, seen_open = [], False
          for idx, ln in enumerate(lines):
              top = states[idx] if idx < len(states) else False
              if top and (OPEN_RE.match(ln) or CLOSE_RE.match(ln)):
                  if OPEN_RE.match(ln) and not seen_open:
                      seen_open = True
                      out.append(ln)
                  else:
                      out.append('-- [rehearsal] stripped transaction control: ' + ln.strip())
                  continue
              out.append(ln)

          text = '\n'.join(out)

          # Belt and braces. If a top-level COMMIT survived in a form the loop
          # did not match, refuse rather than run something that could persist.
          # Re-lexed, not carried over — the stripping changed the text.
          survivor_states = line_top_level(text)[0]
          survivors = [ln.strip() for i2, ln in enumerate(text.split('\n'))
                       if (survivor_states[i2] if i2 < len(survivor_states) else False)
                       and CLOSE_RE.match(ln)]
          if survivors:
              raise SystemExit('::error::a top-level COMMIT/END survived stripping (%s) — refusing to run a rehearsal that could persist' % survivors[:3])

          # Prove the matcher itself, here, every run. A guard is only worth
          # having if its FAILURE is demonstrated, not asserted — and this one
          # shipped once already matching four fewer forms than Postgres accepts.
          for spelling in ('COMMIT;', 'commit ;', 'COMMIT WORK;', 'COMMIT TRANSACTION;',
                           'END;', 'END TRANSACTION;', 'END WORK;', '  COMMIT  ;',
                           'COMMIT AND CHAIN;'):
              if not CLOSE_RE.match(spelling):
                  raise SystemExit('::error::self-check failed: %r is a transaction '
                                   'terminator this stripper would not catch' % spelling)
          # NB an indented `END;` IS a terminator at the top level — what keeps a
          # plpgsql body's END safe is the dollar-quote tracker above, not its
          # indentation. Getting that backwards is how the first fix was written.
          for not_a_terminator in ('END IF;', 'END LOOP;', 'commit_note := 1;', 'END CASE;'):
              if CLOSE_RE.match(not_a_terminator):
                  raise SystemExit('::error::self-check failed: %r is NOT transaction '
                                   'control and would be wrongly stripped' % not_a_terminator)

          open('/tmp/rehearse.sql', 'w', encoding='utf-8').write(text)
          print('transaction control normalised (dollar-quoted bodies left untouched)')
          PY

          # 🔴 A2 — FINGERPRINT THE SCHEMA ITSELF BEFORE TOUCHING IT.
          #
          # The old "left no trace" proof read `schema_migrations` and nothing
          # else. But the ledger row is written at the END of a migration, so a
          # COMMIT that escapes anywhere BEFORE it persists every schema change
          # and leaves the ledger empty — and the check passes, reporting "left
          # no trace" about a database that has just been altered. The proof was
          # weaker than it read.
          #
          # This digest covers what a migration can actually change: columns,
          # constraints, indexes, policies, functions, and the RLS
          # enabled/forced flags that every slice in this repo depends on.
          cat > /tmp/fingerprint.sql <<'FP'
          SELECT md5(coalesce(string_agg(x, E'\n' ORDER BY x), '')) FROM (
            SELECT format('COL %s.%s.%s %s %s', table_schema, table_name, column_name,
                          data_type, is_nullable) AS x
              FROM information_schema.columns
             WHERE table_schema NOT IN ('pg_catalog','information_schema')
            UNION ALL
            SELECT format('POL %s.%s.%s %s', schemaname, tablename, policyname, cmd)
              FROM pg_policies
             WHERE schemaname NOT IN ('pg_catalog','information_schema')
            UNION ALL
            SELECT format('RLS %s.%s enabled=%s forced=%s', n.nspname, c.relname,
                          c.relrowsecurity, c.relforcerowsecurity)
              FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE c.relkind = 'r' AND n.nspname NOT IN ('pg_catalog','information_schema')
            UNION ALL
            SELECT format('CON %s.%s %s', n.nspname, con.conname, con.contype)
              FROM pg_constraint con JOIN pg_namespace n ON n.oid = con.connamespace
             WHERE n.nspname NOT IN ('pg_catalog','information_schema')
            UNION ALL
            SELECT format('IDX %s.%s', schemaname, indexname)
              FROM pg_indexes
             WHERE schemaname NOT IN ('pg_catalog','information_schema')
            UNION ALL
            SELECT format('FUN %s.%s(%s)', n.nspname, p.proname, p.pronargs)
              FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
             WHERE n.nspname NOT IN ('pg_catalog','information_schema')
          ) s;
          FP
          "${PSQL_BIN}" -tA "$DATABASE_URL" -f /tmp/fingerprint.sql | tr -d '[:space:]' > /tmp/fp_before

          # 🔴 A3 — SEQUENCES DO NOT ROLL BACK. `nextval()` is deliberately
          # non-transactional in Postgres: it advances even when the transaction
          # that called it aborts, because two sessions must never be handed the
          # same id. So a rehearsal CANNOT promise a sequence is untouched, and
          # claiming otherwise would be the same class of lie this workflow was
          # built to stop. No migration in this repo uses one today; snapshot
          # them so the claim stays true the day one does.
          "${PSQL_BIN}" -tA "$DATABASE_URL" -c \
            "SELECT coalesce(string_agg(format('%s.%s=%s', schemaname, sequencename,
                                               coalesce(last_value, 0)), E'\n'
                                        ORDER BY schemaname, sequencename), '')
               FROM pg_sequences
              WHERE schemaname NOT IN ('pg_catalog','information_schema')" > /tmp/seq_before

          echo "::group::rehearsal — this really applies the migration, then rolls it back"
          "${PSQL_BIN}" -v ON_ERROR_STOP=1 "$DATABASE_URL" -f /tmp/rehearse.sql
          echo "::endgroup::"
          echo "rehearsal passed under production privileges"
          echo "ALREADY=$ALREADY" >> "$GITHUB_ENV"

      # ⚠️ NOTHING SHOULD HAVE PERSISTED — PROVE IT rather than trusting
      # ROLLBACK. A migration that opened its own transaction, or a COMMIT the
      # stripper failed to match, would leave the schema changed, and this step
      # is the only thing that would notice.
      - name: Prove the rehearsal left no trace
        env:
          MIGRATION: ${{ inputs.migration }}
        run: |
          set -euo pipefail
          export DATABASE_URL="$(cat /tmp/dburl)"
          LEFT="$("${PSQL_BIN}" -tA "$DATABASE_URL" -c \
            "SELECT count(*) FROM schema_migrations WHERE version = '${MIGRATION}'" 2>/dev/null || echo 0)"
          if [ "$LEFT" != "0" ] && [ "${ALREADY:-0}" = "0" ]; then
            echo "::error::${MIGRATION} is recorded as APPLIED on live — the rehearsal PERSISTED. Investigate before applying anything else."
            exit 1
          fi
          # ── A2: the ledger is the WEAKEST of the three proofs, so it is no
          # longer the only one. Re-fingerprint and compare.
          "${PSQL_BIN}" -tA "$DATABASE_URL" -f /tmp/fingerprint.sql | tr -d '[:space:]' > /tmp/fp_after
          if ! diff -q /tmp/fp_before /tmp/fp_after >/dev/null; then
            echo "::error::THE LIVE SCHEMA CHANGED across this rehearsal ($(cat /tmp/fp_before) -> $(cat /tmp/fp_after)). A COMMIT escaped the stripper and the change PERSISTED. Do not apply anything else until this is understood."
            exit 1
          fi
          echo "schema fingerprint unchanged: $(cat /tmp/fp_before)"

          # ── A3: sequences are reported, never claimed clean. They cannot roll
          # back, so silence here would be a false promise rather than a pass.
          "${PSQL_BIN}" -tA "$DATABASE_URL" -c \
            "SELECT coalesce(string_agg(format('%s.%s=%s', schemaname, sequencename,
                                               coalesce(last_value, 0)), E'\n'
                                        ORDER BY schemaname, sequencename), '')
               FROM pg_sequences
              WHERE schemaname NOT IN ('pg_catalog','information_schema')" > /tmp/seq_after
          if diff -q /tmp/seq_before /tmp/seq_after >/dev/null; then
            echo "sequences unchanged (none advanced during the rehearsal)"
          else
            echo "::warning::SEQUENCES ADVANCED and a ROLLBACK cannot undo that — nextval() is non-transactional by design. This is not a failure, but 'left no trace' is NOT true of these:"
            diff /tmp/seq_before /tmp/seq_after || true
          fi

          if [ "${ALREADY:-0}" != "0" ]; then
            echo "confirmed: ${MIGRATION} was already applied before this run; only its verify was rehearsed"
          else
            echo "confirmed: ${MIGRATION} is not applied on live; the rehearsal left no trace"
          fi

      # ⚠️ `always()`, BECAUSE THE FAILURE PATH IS THE ONE THAT MATTERS. If the
      # migration fails, the allow-list entry must still go — otherwise a broken
      # run is also a run that quietly left the database reachable from an
      # address nobody is tracking.
      - name: Always restore the database firewall
        if: always()
        run: |
          set -euo pipefail
          [ -f /tmp/db_id ] || { echo "no database id — nothing to restore"; exit 0; }
          [ -f /tmp/ip_allow_original.json ] || { echo "allow list was never changed"; exit 0; }
          ID="$(cat /tmp/db_id)"
          python3 -c "
          import json
          json.dump({'ipAllowList': json.load(open('/tmp/ip_allow_original.json'))},
                    open('/tmp/ip_allow_restore.json','w'))"
          code="$(curl -sS -o /tmp/restore_out.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data @/tmp/ip_allow_restore.json \
            "https://api.render.com/v1/postgres/${ID}")"
          echo "restore ipAllowList -> $code"
          [ "$code" = "200" ] || { echo "::error::FAILED TO RESTORE the allow list — do it by hand"; exit 1; }

          # Read it back. A 200 is the API accepting the request, not proof the
          # ephemeral entry is gone.
          curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' \
            "https://api.render.com/v1/postgres/${ID}" -o /tmp/pg_after.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/pg_after.json'))
          d = d.get('postgres', d)
          entries = d.get('ipAllowList') or []
          left = [e for e in entries if 'rehearse-migration' in (e.get('description') or '')]
          print('allow list now:', len(entries), 'entries')
          if left:
              sys.exit('::error::the ephemeral entry is STILL present: %s' % left)
          print('ephemeral entry removed — verified by reading it back')
          PY

      - name: Always remove the credential
        if: always()
        run: rm -f /tmp/dburl /tmp/conn.json /tmp/ip_allow_*.json
