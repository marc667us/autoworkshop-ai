# CI — quality, test, security, build.
#
# Mirrors the Solar App CI lane (reference implementation), adapted for a
# TypeScript monorepo plus a Python ADK agent host.
#
# Every tool here is open-source. No paid SaaS, per ADR-012 (zero-cost).
# Public repo => unlimited GitHub Actions minutes, which keeps CI free.

name: CI — Quality, Test, Security, Build

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["master", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Repository validation ────────────────────────────────────────────────
  repo-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject prohibited files
        run: |
          set -e
          # Secrets must never be committed. Solar leaked secrets for 35 days
          # (2026-07-10) — this gate exists so it cannot repeat here.
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example'; then
            echo "::error::.env committed — secrets must never enter git"; exit 1
          fi
          if git ls-files | grep -E '\.(pem|key|p12)$'; then
            echo "::error::key material committed"; exit 1
          fi

      - name: Reject large files (>5MB)
        run: |
          large=$(git ls-files | xargs -r -I{} sh -c 'test -f "{}" && find "{}" -size +5M' 2>/dev/null || true)
          if [ -n "$large" ]; then echo "::error::large files: $large"; exit 1; fi

  # ── 2. TypeScript: lint, typecheck, unit ────────────────────────────────────
  typescript:
    name: TypeScript — lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json declares
      # "packageManager": "pnpm@9.15.4", and the action reads it — specifying
      # both is an error ("Multiple versions of pnpm specified").
      # packageManager is the single source of truth, so corepack locally and
      # the action in CI cannot drift apart.
      #
      # pnpm is held at 9 because pnpm 10+/11+ require Node >=22.13, and Node 20
      # is pinned to match the development machine (20.19.2).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install (locked)
        run: pnpm install --frozen-lockfile

      # ⚠️ NO `|| echo` FALLBACK. These steps used to end in
      # `|| echo "no ... yet — Phase 1 scaffolding"`, which made every one of
      # them incapable of failing: lint errors, type errors and failing tests
      # all exited 0 and CI stayed green. That scaffolding period is long over
      # — there are 15 packages with lint and typecheck targets and 442 unit
      # tests — so the fallbacks protected nothing and hid everything. All
      # three were verified passing (exit 0) before these were removed.
      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests (Vitest)
        run: pnpm -r test


  # ── 2b. Next production build ───────────────────────────────────────────────
  #
  # ⚠️ THIS JOB EXISTS BECAUSE `next build` WAS NEVER RUN BY CI AT ALL.
  # Lint, typecheck and unit tests all pass on code whose production build
  # fails: the build is where prerendering happens, and prerendering is where
  # server/client boundary faults, bad static/dynamic choices and runtime
  # mismatches actually surface. A repository that ships a web app and never
  # builds it in CI is trusting `next dev`, which resolves modules differently
  # and never prerenders anything.
  #
  # NODE_ENV is pinned to production explicitly. `next build` emits a production
  # bundle but does NOT override an NODE_ENV it inherits, and with
  # NODE_ENV=development it loads the development React runtime into a
  # production build — which fails during prerendering with a null
  # useContext/useState blaming whichever component rendered first, never
  # mentioning NODE_ENV. scripts/assert-build-env.mjs now refuses that
  # combination outright; setting it here means CI never depends on the guard.
  build:
    name: Next — production build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      # Build-time placeholders. The apps read these at RUNTIME; the build only
      # needs them to be present and syntactically valid, and using obvious fakes
      # keeps real secrets out of a job that does not need them.
      AUTH_SECRET: ci-build-placeholder-not-a-real-secret
      AUTH_URL: http://localhost:3000
      API_BASE_URL: http://localhost:4000
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: autoworkshop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # NODE_ENV=production makes pnpm skip devDependencies, and next/typescript
      # live there — so the install must opt back in explicitly or the build has
      # no compiler.
      - name: Install (locked)
        run: pnpm install --frozen-lockfile --prod=false

      # No `|| echo` fallback anywhere in this job. A build that fails must fail
      # the pipeline; that is the entire point of adding it.
      - name: Build all apps
        run: pnpm build

  # ── 3. Python ADK agent host ────────────────────────────────────────────────
  python:
    name: Python — lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No 'cache: pip' — it hard-fails until a requirements.txt/pyproject.toml
      # exists, which lands with the Phase 1 python-packages scaffolding.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install ruff mypy pytest

      - name: Ruff
        run: ruff check apps/agent-host python-packages 2>/dev/null || echo "no python yet — Phase 1"

      - name: Pytest
        run: pytest python-packages apps/agent-host 2>/dev/null || echo "no python tests yet — Phase 1"

  # ── 4. Architecture boundaries (§0.2 / §0.3) ────────────────────────────────
  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Specialists must not import other specialists
        run: |
          if grep -rn "from .*specialists" --include=*.py apps/agent-host/*/specialists 2>/dev/null; then
            echo "::error::specialist imports specialist — violates §0.2"; exit 1
          fi
          echo "ok"

      - name: API routes must not import specialists directly
        run: |
          if grep -rn "specialists" --include=*.ts apps/api/src 2>/dev/null; then
            echo "::error::API route reaches a specialist — must go via orchestrator"; exit 1
          fi
          echo "ok"

      - name: No relative import into the Solar app (D2a non-entanglement)
        run: |
          if grep -rn "solar-pv-designer-lite" --include=*.ts --include=*.py --include=*.json . 2>/dev/null \
             | grep -v -e '^\./README.md' -e '^\./docs/' -e '\.github/workflows/'; then
            echo "::error::reference to the Solar app in code — the two apps must not entangle"; exit 1
          fi
          echo "ok"

  # ── 5. Zero-cost policy gate (ADR-012) ──────────────────────────────────────
  zero-cost:
    name: Zero-cost policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No paid/proprietary dependency introduced
        run: |
          set -e
          # Chromatic and Figma tooling are paid at team scale — rejected by D3.
          #
          # NB: test the CAPTURED OUTPUT, not the pipeline exit status. `xargs -r`
          # exits 0 on empty input, and `if <exit 0>` is true — which made this
          # gate fire on an empty repository. Caught on the first CI run.
          files=$(git ls-files '*package.json' || true)
          hits=""
          if [ -n "$files" ]; then
            hits=$(echo "$files" | xargs grep -l -E '"(chromatic|@figma/)' 2>/dev/null || true)
          fi
          if [ -n "$hits" ]; then
            echo "::error::paid design tooling detected in: $hits — ADR-012 forbids paid dependencies"
            exit 1
          fi
          echo "ok — no paid dependency detected"
