# Apply the migration set to the Render Postgres.
#
# WHY THIS EXISTS. `provision-database.yml` created `autoworkshop-postgres` and
# its own closing output names this as step 2 of six before the live site can be
# signed into. There was no workflow for it: migrations 001-034 had only ever
# been applied to the LOCAL container, which is why every session close has
# carried the line "migrations are LOCAL ONLY".
#
# 🔴 IT USES `infrastructure/migrations/run.sh`, NOT A COPY OF IT. The ledger,
# the ordering and the checksum drift-guard are the whole value of that script.
# A second implementation here would be a second set of those rules, and the
# first time the two disagreed the live schema would diverge from the migration
# history — the precise failure this repo bans CREATE-IF-NOT-EXISTS to avoid.
# The runner grew a `DATABASE_URL` mode for exactly this caller.
#
# ⚠️ DRY RUN BY DEFAULT, AND THE DRY RUN INSPECTS. It connects to the real
# database, creates only the bookkeeping ledger, and reports which migrations
# are genuinely PENDING there. A preview that merely prints SQL would not have
# told you whether the database was already migrated.
#
# ⚠️ REHEARSED BEFORE IT WAS WRITTEN. All 34 migrations were applied to a
# freshly created empty database on 2026-08-02 through the same `DATABASE_URL`
# path this workflow uses: 34 applied, 45 tables across 6 schemas, and a re-run
# was a clean no-op. An empty database is the production case, so that rehearsal
# is the real one rather than an approximation.

name: Apply migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to actually run the migrations. Anything else = inspect only.'
        required: false
        default: ''
      database:
        description: 'Render Postgres service name'
        required: false
        default: 'autoworkshop-postgres'
  # ══════════════════════════════════════════════════════════════════════════
  # 🔴 IT ALSO RUNS ITSELF AFTER EVERY RELEASE, AS AN INSPECTION.
  #
  # Owner, 2026-08-09: *"production must match up with local in deployment."*
  #
  # The inspection already existed and was purely manual, so nobody looked —
  # and "migrations are LOCAL ONLY" has appeared in this repository's session
  # notes for weeks, which is what invisible drift looks like written down. A
  # dry run after each Release turns that from something somebody has to
  # remember into a number on every deploy.
  #
  # ⚠️ `inputs` IS NULL ON A `workflow_run`, so both env values below fall back.
  # `CONFIRM` therefore resolves to '' and this path CANNOT APPLY ANYTHING —
  # the automatic trigger inspects and reports, and applying stays a deliberate
  # human act with `confirm=APPLY`.
  # ══════════════════════════════════════════════════════════════════════════
  workflow_run:
    workflows: ['Release']
    types: [completed]

permissions:
  contents: read

concurrency:
  # A6 — ALL of these open the production database firewall by PATCHing the
  # WHOLE ipAllowList, so they must never overlap. Render has no atomic
  # per-entry operation, so every capture/add/restore is a read-modify-write on
  # one shared resource. It races at least THREE ways:
  #   1. FILTERED CAPTURE (apply-migrations, backup-production-db,
  #      rehearse-migration) drops every entry containing 'ephemeral:' when
  #      building its snapshot. It cannot tell a dead run's entry from a LIVE
  #      one's, so it deletes a running job's entry the moment it starts.
  #   2. UNFILTERED RESTORE (the other twelve) restores a snapshot taken before
  #      another run added its entry, deleting it on the way out.
  #   3. CONCURRENT ADD (any two unfiltered runs) — both GET the same original
  #      list, then both PATCH 'original + mine'. The second add deletes the
  #      first run's entry before either restore happens.
  #   (and mixed order can RESURRECT a stale entry: an unfiltered run snapshots
  #    a foreign ephemeral entry and restores it after its owner removed it.)
  # The victim fails with 'SSL connection has been closed unexpectedly', which
  # is a LIE about the cause and reads as a database outage. At least six failed
  # runs on 2026-08-14 were this.
  #
  # ⚠️ A RETRY IS NOT A FIX — five retries failed identically, because the entry
  # stays deleted. And "remove only MY entry" is still racy: the API takes the
  # whole list.
  #
  # 🔴 THE COST OF THIS MUTEX, STATED PLAINLY — GITHUB'S WAITING ROOM HOLDS ONE.
  # A concurrency group is NOT a fifteen-deep FIFO queue. GitHub keeps at most
  # ONE pending run per group and REPLACES it when a newer one arrives, with no
  # ordering guarantee. So a pending deploy-api, migration APPLY, seed or backup
  # can be silently discarded by a newer arrival — and apply-migrations runs
  # automatically after EVERY Release, so automatic inspections compete with
  # deliberate operator requests. A cancelled PENDING run is firewall-safe (it
  # never opened anything) but the REQUEST IS LOST, not merely delayed.
  # ▶ THEREFORE: after dispatching any of these, capture the run id and confirm
  #   it actually STARTED. `gh run list --workflow=<wf> -L 3 --json databaseId,status`
  #   A 'cancelled' run you did not cancel is an evicted request — re-dispatch it.
  #
  # ⚠️ cancel-in-progress MUST stay false: cancelling a run mid-window would
  # leave its ephemeral entry live on the production firewall. But it does NOT
  # close every such path — a job timeout, a manual/API cancellation or runner
  # loss can still kill a run between its add PATCH and its restore step, and an
  # `if: always()` restore is not a reliable finally block against those. The
  # filtered-capture workflows clean up a stale entry on their next run; until
  # then the exposure is real.
  group: production-db-firewall
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # A6 — bounded because this job HOLDS THE SHARED FIREWALL QUEUE. Measured
    # duration is 1-2 minutes across the last five successful runs; 30 is ~15x
    # headroom, so it cannot cut real work short. Without a bound, GitHub's
    # 360-minute default applies and one hung run blocks every backup, seed,
    # diagnostic and deploy behind it. That is not hypothetical: run
    # 31126439386 of rehearse-migration ran for 205 MINUTES.
    timeout-minutes: 30
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      DB_NAME: ${{ inputs.database || 'autoworkshop-postgres' }}
      CONFIRM: ${{ inputs.confirm || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse without a key
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY is not set on this repository"
            exit 1
          fi

      # ⚠️ ABSOLUTE PATH, AND THE VERSION IS ASSERTED. Solar lost a run to a job
      # that installed postgresql-client-18 and then called bare `psql`, which
      # PATH resolved to Ubuntu's bundled 16.x. Echoing a version is not a check
      # — this fails if the binary is not the one that was installed.
      - name: Install a matching psql
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg >/dev/null
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          PSQL=/usr/lib/postgresql/17/bin/psql
          test -x "$PSQL" || { echo "::error::$PSQL is not executable"; exit 1; }
          "$PSQL" --version
          "$PSQL" --version | grep -q ' 17\.' || {
            echo "::error::psql at $PSQL is not the installed 17.x"; exit 1; }
          echo "PSQL_BIN=$PSQL" >> "$GITHUB_ENV"

      - name: Find the database and read its connection string
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/pg.json -w '%{http_code}' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' \
            "https://api.render.com/v1/postgres?limit=50")"
          echo "GET /v1/postgres -> $code"
          [ "$code" = "200" ] || { echo "::error::could not list databases"; exit 1; }

          python3 - <<'PY'
          import json, os, sys
          rows = json.load(open('/tmp/pg.json'))
          want = os.environ['DB_NAME']
          print('databases visible to this key:')
          found = ''
          for r in rows:
              d = r.get('postgres', r)
              print(f"  - {d.get('name')}  status={d.get('status')}")
              if d.get('name') == want:
                  found = d.get('id')
                  status = d.get('status')
          if not found:
              sys.exit(f"::error::no database named {want}")
          # A database that is still creating cannot be migrated, and the error
          # psql would give ("could not connect") names the symptom rather than
          # this cause.
          if status not in ('available', 'creating'):
              sys.exit(f"::error::{want} is '{status}', not available")
          if status == 'creating':
              print(f"::warning::{want} is still creating; the connection may not be ready")
          open('/tmp/db_id', 'w').write(found)
          PY
          ID="$(cat /tmp/db_id)"
          echo "database id: $ID"

          # The connection string is fetched PER RUN and never stored in the
          # repo — Solar's pattern. It is written to a file rather than an env
          # var so it cannot land in a command line or in the step log.
          code="$(curl -sS -o /tmp/conn.json -w '%{http_code}' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' \
            "https://api.render.com/v1/postgres/${ID}/connection-info")"
          [ "$code" = "200" ] || { echo "::error::could not read connection info ($code)"; exit 1; }

          python3 - <<'PY'
          import json
          info = json.load(open('/tmp/conn.json'))
          url = info.get('externalConnectionString') or info.get('internalConnectionString')
          if not url:
              raise SystemExit('::error::no connection string in the response')
          open('/tmp/dburl', 'w').write(url)
          # Never print the URL. Only its shape, so a failure is diagnosable.
          print('connection string acquired:', url.split('@')[-1].split('/')[0][:4] + '…')
          PY
          chmod 600 /tmp/dburl

      # 🔴 RENDER BLOCKS EXTERNAL CONNECTIONS BY IP, AND THE ERROR DOES NOT SAY
      # SO. The first run of this workflow reached the database and psql
      # reported "SSL connection has been closed unexpectedly" — which reads
      # like a TLS fault and is in fact Render dropping a connection from an
      # address that is not on the database's allow list.
      #
      # ⚠️ A SINGLE /32 FOR THIS RUNNER, NOT 0.0.0.0/0. A GitHub runner takes a
      # different public address every run, so the lazy fix is to open the
      # database to the whole internet and leave it that way. This adds only the
      # address in use and RESTORES THE ORIGINAL LIST in an `if: always()` step,
      # so a failed run cannot leave the database more exposed than it found it.
      - name: Allow this runner through the database firewall
        run: |
          set -euo pipefail
          ID="$(cat /tmp/db_id)"
          IP="$(curl -sS --max-time 20 https://api.ipify.org)"
          echo "$IP" | grep -Eq '^[0-9.]+$' || { echo "::error::could not read runner IP"; exit 1; }
          echo "runner address: $IP"

          curl -sS -o /tmp/pg_one.json \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' \
            "https://api.render.com/v1/postgres/${ID}"

          python3 - "$IP" <<'PY'
          import json, sys
          ip = sys.argv[1]
          d = json.load(open('/tmp/pg_one.json'))
          d = d.get('postgres', d)
          # 🔴 A LEFTOVER EPHEMERAL ENTRY MUST NEVER BECOME PERMANENT.
          #
          # On 2026-08-07 a run's restore PATCH returned 200 and the read-back
          # still saw the entry, so the job failed with the entry live on the
          # production database. The next run would then have captured THAT list
          # as "original" and written it back faithfully — baking a GitHub
          # runner's IP into the firewall for ever, with every subsequent run
          # re-blessing it.
          #
          # So the snapshot is FILTERED: anything this pipeline previously added
          # is dropped on capture. That makes a crashed or half-failed run
          # self-healing — the next run cleans up after it — instead of
          # compounding.
          raw = d.get('ipAllowList') or []
          original = [e for e in raw
                      if 'ephemeral:' not in (e.get('description') or '')]
          stale = len(raw) - len(original)
          if stale:
              print(f'dropping {stale} leftover ephemeral entr'
                    f'{"y" if stale == 1 else "ies"} from a previous run')
          json.dump(original, open('/tmp/ip_allow_original.json', 'w'))
          print('existing allow list entries:', len(original))
          merged = list(original) + [{'cidrBlock': f'{ip}/32',
                                      'description': 'ephemeral: apply-migrations run'}]
          json.dump({'ipAllowList': merged}, open('/tmp/ip_allow_patch.json', 'w'))
          PY

          code="$(curl -sS -o /tmp/patch_out.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data @/tmp/ip_allow_patch.json \
            "https://api.render.com/v1/postgres/${ID}")"
          echo "PATCH ipAllowList -> $code"
          [ "$code" = "200" ] || { echo "::error::could not update the allow list"; cat /tmp/patch_out.json; exit 1; }

          # Render applies the rule asynchronously; connecting immediately races it.
          sleep 20

      - name: Inspect (always) and apply (only on APPLY)
        run: |
          set -euo pipefail
          export DATABASE_URL="$(cat /tmp/dburl)"
          export PSQL_BIN="${PSQL_BIN}"

          echo "::group::pending migrations"
          # Captured as well as shown: the counts below are parsed from THIS
          # output, so the report cannot disagree with what the runner did.
          DRY_RUN=1 bash infrastructure/migrations/run.sh 2>&1 | tee /tmp/dryrun.txt
          echo "::endgroup::"

          # ── PRODUCTION vs THIS COMMIT, AS THREE NUMBERS ────────────────────
          #
          # 🔴 NOT AN EXIT CODE. `run.sh` exits 0 whether or not anything is
          # pending, so "the workflow was green" has never meant "production
          # matches the repository". This repository lost two days to a suite
          # that exited 0 having run zero tests; the same rule applies here.
          # 🔴 PARSED FROM THE RUNNER'S OWN SUMMARY LINE, NOT FROM ITS PER-FILE
          # PREFIXES — AND THE FIRST VERSION OF THIS GOT IT WRONG IN THE WORST
          # POSSIBLE WAY.
          #
          # It counted lines matching `^  *apply `. A DRY RUN does not print
          # `apply`; it prints `PENDING <name> (dry run - not applied)`. So the
          # count was ALWAYS ZERO and this block always concluded "Production
          # matches this commit" — on run 31282826280 it printed PENDING 0 four
          # lines below the runner's own `==> dry run: 6 pending`.
          #
          # 🔴 AND IT WAS "VERIFIED AGAINST REAL OUTPUT". Locally, where nothing
          # was pending, 0 was the correct answer for the wrong reason. A check
          # that cannot fail, confirmed by a test that could not distinguish it
          # from one that works. Exactly the class this whole file exists to
          # catch, walked into while building the catcher.
          #
          # The summary line is authoritative in BOTH modes:
          #   dry:  ==> dry run: 6 pending, 65 already applied. Nothing was written.
          #   real: ==> done: 1 applied, 65 skipped
          IN_REPO="$(ls infrastructure/migrations/*.sql | wc -l | tr -d ' ')"
          SUMMARY="$(grep -E '^==> (dry run|done):' /tmp/dryrun.txt | tail -1)"

          # ⚠️ NO SILENT DEFAULT. If the summary is missing or its wording
          # changes, this FAILS rather than reporting zero — a parser that
          # falls back to 0 reports "all clear" for every future format change.
          if [ -z "${SUMMARY}" ]; then
            echo "::error::could not find run.sh's summary line in its output."                 "The drift numbers cannot be trusted, so this run fails rather"                 "than reporting a clean bill of health it did not measure."
            exit 1
          fi
          echo "runner summary: ${SUMMARY}"

          PENDING="$(printf '%s' "$SUMMARY" | grep -oE '[0-9]+ pending'      | grep -oE '[0-9]+' || echo 0)"
          APPLIED="$(printf '%s' "$SUMMARY" | grep -oE '[0-9]+ already'      | grep -oE '[0-9]+' || echo 0)"
          # A real (non-dry) run words it differently.
          [ -n "${PENDING}" ] || PENDING=0
          if printf '%s' "$SUMMARY" | grep -q '^==> done:'; then
            PENDING=0
            APPLIED="$(printf '%s' "$SUMMARY" | grep -oE '[0-9]+ skipped' | grep -oE '[0-9]+' || echo 0)"
          fi
          echo
          echo "=============================================================="
          echo "  MIGRATIONS   IN REPO ${IN_REPO}   APPLIED ${APPLIED}   PENDING ${PENDING}"
          echo "=============================================================="

          if [ "${CONFIRM}" != "APPLY" ]; then
            echo
            echo "INSPECT ONLY — nothing was written."
            if [ "${PENDING}" -gt 0 ]; then
              # ⚠️ RED, DELIBERATELY, AND THIS IS NOT AN ENVIRONMENTAL FAILURE.
              # Pending migrations mean the deployed schema is genuinely behind
              # the code that was just released — a real defect with a known
              # remedy that a human can perform in one click. A warning here
              # would be indistinguishable from the silence that let this drift
              # accumulate in the first place.
              echo "::error::${PENDING} migration(s) are in this commit and NOT on production."                   "The deployed schema does not match the code that was just released."                   "Run this workflow again with confirm=APPLY, then run the Live suite."
              exit 1
            fi
            echo "Production matches this commit — nothing to apply."
            exit 0
          fi

          echo "::group::applying"
          bash infrastructure/migrations/run.sh
          echo "::endgroup::"

      - name: Prove the schema is really there
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          export DATABASE_URL="$(cat /tmp/dburl)"
          # Reading the ledger back is not enough: it is a table this workflow
          # writes. The check that matters is that the SCHEMA exists, so it
          # counts real tables per schema and fails if the core ones are absent.
          "${PSQL_BIN}" -v ON_ERROR_STOP=1 "$DATABASE_URL" -tA -c "
            SELECT table_schema || '=' || count(*)
            FROM information_schema.tables
            WHERE table_schema IN ('identity','core','repair','catalogue','audit')
            GROUP BY table_schema ORDER BY table_schema;" | tee /tmp/counts
          for s in identity core repair catalogue audit; do
            grep -q "^${s}=" /tmp/counts || {
              echo "::error::schema '${s}' has no tables after applying migrations"; exit 1; }
          done
          echo "schema verified"

      # ⚠️ `always()`, BECAUSE THE FAILURE PATH IS THE ONE THAT MATTERS. If the
      # migration fails, the allow-list entry must still go — otherwise a broken
      # run is also a run that quietly left the database reachable from an
      # address nobody is tracking.
      - name: Always restore the database firewall
        if: always()
        run: |
          set -euo pipefail
          [ -f /tmp/db_id ] || { echo "no database id — nothing to restore"; exit 0; }
          [ -f /tmp/ip_allow_original.json ] || { echo "allow list was never changed"; exit 0; }
          ID="$(cat /tmp/db_id)"
          python3 -c "
          import json
          json.dump({'ipAllowList': json.load(open('/tmp/ip_allow_original.json'))},
                    open('/tmp/ip_allow_restore.json','w'))"
          code="$(curl -sS -o /tmp/restore_out.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data @/tmp/ip_allow_restore.json \
            "https://api.render.com/v1/postgres/${ID}")"
          echo "restore ipAllowList -> $code"
          [ "$code" = "200" ] || { echo "::error::FAILED TO RESTORE the allow list — do it by hand"; exit 1; }

          # Read it back. A 200 is the API accepting the request, not proof the
          # ephemeral entry is gone.
          #
          # ⚠️ POLLED, NOT READ ONCE. Render applies an ipAllowList change
          # ASYNCHRONOUSLY, so an immediate read can still show the old list —
          # which is exactly how a run whose restore had genuinely worked failed
          # on 2026-08-07 and left the job red with the entry apparently live.
          # Six attempts over ~30s, and it only fails if the entry is still
          # there at the end.
          for attempt in 1 2 3 4 5 6; do
            curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' \
              "https://api.render.com/v1/postgres/${ID}" -o /tmp/pg_after.json
            if python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/pg_after.json'))
          d = d.get('postgres', d)
          entries = d.get('ipAllowList') or []
          left = [e for e in entries if 'ephemeral:' in (e.get('description') or '')]
          print('allow list now:', len(entries), 'entries')
          sys.exit(1 if left else 0)
          PY
            then
              echo "ephemeral entry removed — verified by reading it back (attempt $attempt)"
              break
            fi
            if [ "$attempt" = "6" ]; then
              echo "::error::the ephemeral entry is STILL present after 6 reads over ~30s. REMOVE IT BY HAND in the Render dashboard: the production database is reachable from a GitHub runner IP."
              exit 1
            fi
            sleep 5
          done

      - name: Always remove the credential
        if: always()
        run: rm -f /tmp/dburl /tmp/conn.json /tmp/ip_allow_*.json
