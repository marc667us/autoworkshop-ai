# Deploy a published image to one Render service and PROVE IT SERVES.
#
# Reusable because staging and production do exactly the same thing to two
# different services, and the one difference that matters -- which host gets
# verified -- is an input. Copy-pasting it would guarantee the two drift, and
# the half that drifts is usually the one nobody watches.
#
# The caller passes a DIGEST-SPECIFIC tag, never `:latest`, so the artifact that
# passed the smoke test is provably the artifact that runs here.
name: Deploy to Render

on:
  workflow_call:
    inputs:
      service_id:
        description: Render service id to deploy
        required: true
        type: string
      image:
        description: Fully qualified image reference including tag
        required: true
        type: string
      base_url:
        description: Public URL to verify after the deploy reports live
        required: true
        type: string
      environment:
        description: GitHub environment name for this deploy
        required: false
        default: ''
        type: string
    secrets:
      RENDER_API_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ⚠️ RAISED FROM 30. This job's budget is SHARED between the deploy poll,
    # which bounds itself at 20 minutes, and the verification below, whose
    # worst case grew when it went from probing one path to probing `/`, two
    # auth routes and seven pack roots. At 30 the runner could kill the job
    # mid-verification and produce a failure with NO error annotation at all —
    # the least diagnosable outcome available. Per-request `--max-time` was
    # also cut from 120s to 45-60s, since a cold instance is already handled by
    # the wake loop that runs before any of these.
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    steps:
      - name: Refuse to deploy without a configured service
        run: |
          if [ -z "${{ inputs.service_id }}" ]; then
            echo "::error::No service id was supplied. The repository variable that"
            echo "feeds this input is unset, so there is nothing to deploy to."
            echo "NOTE: repository variables are snapshotted when a run is QUEUED --"
            echo "setting one does not reach a run that is already in flight."
            exit 1
          fi
          echo "deploying ${{ inputs.image }}"
          echo "        -> ${{ inputs.service_id }}"

      - name: Deploy and wait for a terminal state
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          RESP="$(curl -fsS -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"imageUrl":"${{ inputs.image }}"}' \
            "https://api.render.com/v1/services/${{ inputs.service_id }}/deploys")"
          DID="$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")"
          echo "deploy $DID"

          for i in $(seq 1 60); do
            S="$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/${{ inputs.service_id }}/deploys/${DID}" \
              | python3 -c "import sys,json;print(json.load(sys.stdin)['status'])")"
            echo "[$i] $S"
            case "$S" in
              live) echo "DEPLOY LIVE"; exit 0 ;;
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "::error::deploy ended in $S"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::deploy did not reach a terminal state in 20 minutes"; exit 1

      - name: Verify the deployed service actually serves
        run: |
          set -euo pipefail
          # A `live` status means Render's own health check passed. It does not
          # mean the public hostname routes here, and it says nothing about the
          # auth routes -- which is the gap that let UntrustedHost and a missing
          # Keycloak issuer reach a "green" build twice. Check the real host.
          BASE="${{ inputs.base_url }}"

          # A free service sleeps after ~15 minutes idle and takes roughly 50
          # seconds to wake. The first request after a quiet period is therefore
          # slow BY DESIGN, and failing on it would make the pipeline flaky for a
          # property of the tier rather than a fault in the build.
          # 🔴 ADR-021 MOVED THIS PATH AND THIS STEP FAILED EVERY RELEASE FOR
          # TWO DAYS. `/home/dashboard` was workshop-web's dashboard when
          # workshop-web WAS the artifact. Since the consolidation the packs are
          # mounted under a prefix — `/workshop/home/dashboard`,
          # `/customer/home/dashboard` — and the bare path 307s to `/`. So this
          # step reported `returned 307` and went red on six consecutive
          # perfectly good deploys (2026-08-14 20:57Z → 2026-08-15 13:31Z), all
          # of which had ALREADY DEPLOYED SUCCESSFULLY: the failure is in the
          # verification, after `promote`.
          #
          # ⚠️ `release.yml`'s own container smoke test had already been
          # corrected for exactly this, with exactly this reasoning, and THIS
          # FILE WAS MISSED. Two literals in two files cannot be type-checked
          # into agreement — the recorded bug class in this repository. When a
          # URL contract changes, grep every workflow, not the one that failed.
          #
          # `/` is what `render.yaml` health-checks, it is the only route that
          # renders with neither the API nor Keycloak reachable, and it is
          # prefix-independent, so it cannot rot the same way again.
          #
          # 🔴 BUT `/` ALONE IS A WEAKER GATE THAN WHAT IT REPLACED, so it is not
          # alone. `middleware.ts` exempts `/` from authentication, and `/` is
          # the public landing — so a deploy in which EVERY `/workshop/*` and
          # `/customer/*` route 404s would sail through a `/`-only check. The
          # old path at least exercised an app route. Coverage is restored below
          # by probing all seven pack roots, which is the assertion that
          # actually matters for a single artifact carrying seven packs: a pack
          # that failed to mount returns 404 and nothing else would notice.
          for i in $(seq 1 5); do
            code=""
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "${BASE}/")" || code=""
            [ "$code" = "200" ] && break
            echo "wake attempt ${i}: ${code:-transport-failure}"
            sleep 15
          done

          fail=0

          # ⚠️ `code="$(curl ... || echo 000)"` YIELDS `000000`, NOT `000`.
          # curl PRINTS 000 and THEN exits non-zero, so both sides of the `||`
          # run and their output concatenates. It is a recorded defect in this
          # repository and this file had two live instances of it. The correct
          # idiom — already used by `deploy-web.yml` — assigns on failure
          # instead: `code="$(curl ...)" || code=""`.
          check() { # path, label
            local code=""
            # ⚠️ THE BODY FILE IS TRUNCATED FIRST, AND `head` IS GUARDED.
            # On a transport failure curl does not rewrite `/tmp/body`, so the
            # diagnostic printed under this error would be the PREVIOUS check's
            # body — a 200 landing page shown beneath "returned
            # transport-failure", which is worse than printing nothing. And on
            # the first call the file may not exist at all, where under
            # `set -euo pipefail` a failing `head` aborts the step and silently
            # skips the pack probes and the token-leak assertion below it.
            : > /tmp/body
            code="$(curl -s -o /tmp/body -w '%{http_code}' --max-time 60 "${BASE}$1")" || code=""
            case "$code" in
              200) echo "ok   $1 → $code" ;;
              *)   echo "::error::${BASE}$1 returned ${code:-transport-failure} ($2)"
                   head -c 300 /tmp/body 2>/dev/null || true; echo; fail=1 ;;
            esac
          }

          # Must be exactly 200: the landing renders for anyone, and these two
          # 500 while ordinary pages return 200 when AUTH_TRUST_HOST or the
          # provider issuer is wrong — the asymmetry that twice reached a green
          # build.
          check /                    "public landing / Render health path"
          check /api/auth/providers  "auth providers — 500 here means no issuer"
          check /api/auth/session    "auth session — 500 here means UntrustedHost"

          # 🔴 EVERY PACK, because the whole point of ADR-021 is that ONE image
          # carries all seven. A pack that failed to mount returns 404 here and
          # nothing else in the pipeline would notice: the image builds, the
          # server starts, `/` renders, and six of seven work.
          #
          # 🔴 `-L`, AND THAT IS THE WHOLE POINT OF THIS CHECK. Every pack root
          # is a THREE-LINE `redirect()` stub (`app/<pack>/page.tsx` →
          # `/<pack>/home/dashboard`). Accepting a bare 307 would prove only
          # that the stub file shipped and would never request the target — so
          # THE EXACT DEFECT THIS PROJECT SHIPPED ON 08-13 (a pack root
          # dispatching to a dashboard that pack does not serve, which 404'd the
          # owner on their own admin screen) would sail straight through.
          # Following the redirect asserts the destination actually renders.
          # 401/403 still pass: refusing an anonymous viewer is CORRECT for a
          # gated pack. 404 and 5xx are the failures.
          #
          # 🔴 RETRIES, BECAUSE RENDER'S EDGE 404s WHEN IT HAS NO INSTANCE.
          # A free-pool service with no instance answers a fast 404 carrying
          # `x-render-routing: no-server` — indistinguishable here from a pack
          # that failed to mount, and these are eight sequential requests, which
          # is long enough for the instance to be recycled mid-loop. An earlier
          # version of this comment claimed it used `deploy-web.yml`'s logic "so
          # the two cannot drift apart" while copying only the accepted-status
          # half and not the retry half. Both halves now.
          for pack in customer workshop supplier fleet insurance towing admin; do
            code=""
            for attempt in 1 2 3; do
              code="$(curl -sL -o /dev/null -w '%{http_code}' --max-time 45 "${BASE}/${pack}")" || code=""
              case "$code" in 200|401|403) break ;; esac
              echo "  /${pack}: ${code:-transport-failure} — retrying (${attempt})"
              sleep 10
            done
            case "$code" in
              200|401|403) printf '  ok   /%-10s -> %s (followed)\n' "$pack" "$code" ;;
              *) echo "::error::/${pack} resolved to ${code:-transport-failure} — that pack did not mount, or its root redirects somewhere that does not serve"
                 fail=1 ;;
            esac
          done

          # The session document is served to the browser as JSON. Re-asserted
          # here and not only in the container smoke test, because the runtime
          # env differs between the two and this is the one users can reach.
          if curl -fsS --max-time 120 "${BASE}/api/auth/session" \
               | grep -qiE '"(accessToken|refreshToken|idToken|id_token)"'; then
            echo "::error::${BASE}/api/auth/session exposes a token to the browser"
            fail=1
          fi

          [ "$fail" = "0" ] && echo "VERIFIED ${BASE}"
          exit $fail
