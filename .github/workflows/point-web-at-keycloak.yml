# Point the live web service at the deployed Keycloak — step 4 of six.
#
# WHY A WORKFLOW AND NOT A CONSOLE CLICK. `RENDER_API_KEY` is a repository
# secret and cannot be read from a developer machine, which is the same reason
# `render-status.yml` exists. Doing this by hand in the dashboard is also how
# earlier "facts" in this project turned out to be wrong — nothing records what
# was actually set.
#
# 🔴 RENDER'S ENV-VAR ENDPOINT IS A WHOLE-SET PUT, NOT A PATCH. Sending only the
# keys being changed DELETES every other variable on the service — including
# `AUTH_SECRET`, whose loss would invalidate every session and cannot be
# recovered from anywhere else. So this GETs the current set, merges, and PUTs
# the union. It never sends a set smaller than the one it read, and it refuses
# if the read came back empty.
#
# ⚠️ DRY RUN BY DEFAULT. It reports which keys would change and prints only KEY
# NAMES — never values.
name: Point web at Keycloak and API

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to write the variables and redeploy.'
        required: false
        default: ''
      keycloak_url:
        description: 'Public base URL of the deployed Keycloak'
        required: false
        default: 'https://autoworkshop-keycloak.onrender.com'
      auth_url:
        description: 'Public base URL the web app is served on'
        required: false
        default: 'https://autoworkshop.aiappinvent.com'
      realm:
        description: 'Keycloak realm'
        required: false
        default: 'autoworkshop'
      api_base_url:
        description: 'Public base URL of the deployed API (server-side calls from Next)'
        required: false
        default: 'https://autoworkshop-api.onrender.com'
      # 🔴 ADR-021 DELETED THE PER-PACK SERVICES. These defaulted to
      # https://autoworkshop-{customer,supplier}.onrender.com, which no longer
      # exist — so this workflow probed dead hosts and, on 2026-08-15, was
      # recorded as "probing a service the consolidation deleted". The packs are
      # PATH PREFIXES on the one deployed application now.
      #
      # ⚠️ The cross-host hazard these variables were guarded against is GONE
      # for the same reason: a callback that once signed a visitor in on the
      # wrong origin cannot happen when every pack shares one origin. That is
      # why the apex landing was able to link both funnels on 2026-08-15.
      customer_web_url:
        description: 'Public base URL of the customer pack (the Request for Service form lives there)'
        required: false
        default: 'https://autoworkshop.aiappinvent.com/customer'
      supplier_web_url:
        description: 'Public base URL of the supplier pack (the Register as parts supplier funnel lands there)'
        required: false
        default: 'https://autoworkshop.aiappinvent.com/supplier'

permissions:
  contents: read

jobs:
  point:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      # The production web service, by id. Never a name lookup that could match
      # a neighbouring service — this Render account also hosts Solar, which is
      # explicitly off-limits (ADR-011 / D2a).
      SERVICE_ID: srv-d9ju49id0e5s7389fjlg
      KEYCLOAK_URL: ${{ inputs.keycloak_url }}
      AUTH_URL: ${{ inputs.auth_url }}
      REALM: ${{ inputs.realm }}
      API_BASE_URL: ${{ inputs.api_base_url }}
      CUSTOMER_WEB_URL: ${{ inputs.customer_web_url }}
      SUPPLIER_WEB_URL: ${{ inputs.supplier_web_url }}
      CONFIRM: ${{ inputs.confirm }}

    steps:
      - name: Refuse without a key
        run: |
          set -euo pipefail
          [ -n "${RENDER_API_KEY:-}" ] || { echo "::error::RENDER_API_KEY is not set"; exit 1; }

      - name: Prove the Keycloak realm is actually serving first
        run: |
          set -euo pipefail
          # Pointing the app at an issuer that does not answer would replace one
          # broken sign-in with another, and the symptom would look identical.
          URL="${KEYCLOAK_URL}/realms/${REALM}/.well-known/openid-configuration"
          code="$(curl -s -o /tmp/disc.json -w '%{http_code}' --max-time 120 "$URL")"
          echo "discovery -> $code"
          [ "$code" = "200" ] || { echo "::error::$URL did not answer 200"; exit 1; }
          ISS="$(python3 -c "import json;print(json.load(open('/tmp/disc.json'))['issuer'])")"
          echo "issuer    -> $ISS"
          # The API validates `iss` byte for byte against its own KEYCLOAK_URL.
          [ "$ISS" = "${KEYCLOAK_URL}/realms/${REALM}" ] || {
            echo "::error::issuer '$ISS' is not '${KEYCLOAK_URL}/realms/${REALM}'"; exit 1; }

      # THE SAME RULE, FOR THE API. Pointing the web app at an API that does not
      # answer replaces "no data" with "no data", and the screen says the same
      # thing either way — so the mistake would be invisible until somebody
      # opened the Render dashboard. Deployed 2026-08-03; before that this
      # variable had nowhere to point, which is why every live screen read zero.
      - name: Prove the API is actually serving too
        run: |
          set -euo pipefail
          # Free tier spins down; a cold start took 24.6s for Keycloak on the
          # same account, so this waits rather than declaring a sleeping service dead.
          for i in $(seq 1 6); do
            code="$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 120               "${API_BASE_URL}/api/v1/health" || echo 000)"
            [ "$code" = "200" ] && break
            echo "  health: $code (cold start? attempt $i)"
          done
          echo "health -> $code"
          [ "$code" = "200" ] || { echo "::error::${API_BASE_URL}/api/v1/health did not answer 200"; exit 1; }
          cat /tmp/health.json; echo
          # An anonymous /me MUST be refused. A 200 here would mean the web app
          # was about to be pointed at an API answering identity questions to
          # anyone, which is worse than being pointed at nothing.
          me="$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "${API_BASE_URL}/api/v1/me" || echo 000)"
          echo "anonymous /me -> $me"
          case "$me" in
            401|403) ;;
            *) echo "::error::/api/v1/me returned $me to an anonymous caller"; exit 1 ;;
          esac

      # THE SAME RULE AGAIN, FOR THE CUSTOMER APP. The landing's primary call to
      # action — "Request repair service", the owner's request of 2026-08-07 —
      # renders ONLY when this variable resolves to an absolute url, and the
      # form it opens lives on that other host. On 2026-08-07 the button shipped
      # green and could not appear at all, because the variable was set on
      # neither the service nor the build. Pointing it at a host that does not
      # answer would replace an invisible button with a broken one, and both
      # look like "nothing happened" to whoever presses it.
      #
      # The exact FORM path is checked, not just the origin: a customer app that
      # is up but does not serve this route is the failure this button cannot
      # survive, and the origin answering 200 would hide it.
      - name: Prove the customer app serves the Request for Service form
        run: |
          set -euo pipefail

          # 🔴 VALIDATE BEFORE PROBING, with the SAME rules the app applies
          # (`requestServiceHrefFrom` in packages/marketplace-ui). Codex raised
          # this on 2026-08-07: a workflow that only checks the URL RESPONDS can
          # happily persist a value the app then refuses — and the symptom is an
          # invisible button with a green deploy behind it, which is the exact
          # failure this whole change exists to end.
          # The CANONICAL value is emitted here and used for BOTH the probe and
          # the write. The shell and this validator otherwise disagree about the
          # same string — `${VAR%/}` strips exactly ONE trailing slash and no
          # whitespace, while the app strips `/+$` — so `https://host//` could be
          # PROVEN in a shape the app never builds (Supervisor, 2026-08-07).
          python3 - > /tmp/customer_url <<'PY'
          import os, sys
          from urllib.parse import urlsplit
          raw = (os.environ.get('CUSTOMER_WEB_URL') or '').strip()
          if not raw:
              sys.exit('::error::customer_web_url is blank')
          u = urlsplit(raw)
          if u.scheme not in ('http', 'https'):
              sys.exit(f'::error::customer_web_url scheme {u.scheme!r} is not http/https')
          if not u.hostname:
              sys.exit('::error::customer_web_url has no host')
          if u.username or u.password:
              sys.exit('::error::customer_web_url carries credentials')
          if u.query or u.fragment:
              sys.exit('::error::customer_web_url has a query or fragment; a path cannot be appended to it')
          # Exactly what `requestServiceHrefFrom` builds: origin + path, every
          # trailing slash removed.
          print(f'{u.scheme}://{u.netloc}{u.path}'.rstrip('/'))
          PY
          CANON="$(cat /tmp/customer_url)"
          echo "customer_web_url accepted, canonical: ${CANON}"

          URL="${CANON}/service-and-repairs/request-service"
          # 🔴 A SLEEP, AND 5xx IS RETRYABLE. Without a pause the six attempts
          # returned within MILLISECONDS of each other, so a free service that
          # was merely waking was declared dead — the loop said "cold start?"
          # while allowing no time for one (Supervisor, 2026-08-07).
          ok=0
          for i in $(seq 1 6); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$URL" || echo 000)"
            # 401/403/302 are FINE: the form is behind sign-in, and a redirect to
            # the identity provider proves the route exists and is wired.
            case "$code" in
              200|301|302|303|307|401|403) ok=1; break ;;
            esac
            echo "  ${code} (attempt ${i}; waking or down)"
            [ "$i" -lt 6 ] && sleep 20
          done
          echo "customer form -> ${code}"

          # 🔴 A DOWN CUSTOMER APP MUST NOT BLOCK A KEYCLOAK REPAIR. This step
          # used to hard-fail before the merge, so an unrelated third-party
          # outage also blocked the one workflow that can fix AUTH_URL,
          # KEYCLOAK_URL and the AUTH_SECRET-preserving merge — turning one
          # broken funnel into a broken sign-in. Failing here now SKIPS only this
          # key: the merge keeps whatever value the service already carries, and
          # a 404 is still called out as the dead link it is.
          if [ "$ok" = "1" ]; then
            echo "$CANON" > /tmp/customer_url_ok
          else
            echo "::warning::${URL} returned ${code} — NOT writing CUSTOMER_WEB_URL. Any value already on the service is left untouched. If this is a 404 the form is genuinely missing: deploy customer-web (Release does NOT), then re-run."
          fi

      # ── THE SUPPLIER FUNNEL'S DESTINATION ────────────────────────────────
      #
      # Same shape as the customer probe above, and for the same reason: the
      # apex's "Register as parts supplier" button renders ONLY when
      # SUPPLIER_WEB_URL is set, and `supplierRegisterHrefFrom` sends people to
      # that origin's OWN sign-in. Writing an unproven URL here would replace a
      # correctly hidden button with one that lands a stranger, signed out, on a
      # host that may not exist — the `c586e38` failure the owner reported four
      # times.
      - name: Prove the supplier app answers before naming it
        run: |
          set -euo pipefail
          python3 - > /tmp/supplier_url <<'PY'
          import os, sys
          from urllib.parse import urlsplit
          raw = (os.environ.get('SUPPLIER_WEB_URL') or '').strip()
          if not raw:
              sys.exit('::error::supplier_web_url is blank')
          u = urlsplit(raw)
          if u.scheme not in ('http', 'https'):
              sys.exit(f'::error::supplier_web_url scheme {u.scheme!r} is not http/https')
          if not u.hostname:
              sys.exit('::error::supplier_web_url has no host')
          if u.username or u.password:
              sys.exit('::error::supplier_web_url carries credentials')
          if u.query or u.fragment:
              sys.exit('::error::supplier_web_url has a query or fragment; a path cannot be appended to it')
          # Exactly what `siblingAppBaseFrom` builds: origin + path, every
          # trailing slash removed. The shell and this validator must agree on
          # the same string or a value can be PROVEN in a shape the app never
          # constructs.
          print(f'{u.scheme}://{u.netloc}{u.path}'.rstrip('/'))
          PY
          CANON="$(cat /tmp/supplier_url)"
          echo "supplier_web_url accepted, canonical: ${CANON}"

          # `/home/dashboard` is where the button actually sends people, so that
          # is what is probed — not `/`, which merely redirects to it.
          URL="${CANON}/home/dashboard"
          ok=0
          for i in $(seq 1 6); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$URL" || echo 000)"
            # 200 for the signed-out shell, 3xx for a redirect to sign-in, 401/403
            # for a hard refusal — all prove the route exists and is wired.
            case "$code" in
              200|301|302|303|307|401|403) ok=1; break ;;
            esac
            echo "  ${code} (attempt ${i}; waking or down)"
            [ "$i" -lt 6 ] && sleep 20
          done
          echo "supplier dashboard -> ${code}"

          # A down supplier app must not block a Keycloak repair, exactly as for
          # the customer key: this SKIPS the one variable rather than failing the
          # workflow that fixes AUTH_URL and preserves AUTH_SECRET.
          if [ "$ok" = "1" ]; then
            echo "$CANON" > /tmp/supplier_url_ok
          else
            echo "::warning::${URL} returned ${code} — NOT writing SUPPLIER_WEB_URL. The landing's supplier button stays hidden, which is the correct degraded state. If this is a 404, deploy supplier-web (deploy-supplier-web.yml -f confirm=APPLY) then re-run."
          fi

      - name: Read the current variables and merge
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' \
            "https://api.render.com/v1/services/${SERVICE_ID}/env-vars?limit=100" > /tmp/cur.json

          python3 - <<'PY'
          import json, os

          rows = json.load(open('/tmp/cur.json'))
          cur = {}
          for r in rows:
              e = r.get('envVar', r)
              if 'key' in e:
                  cur[e['key']] = e.get('value', '')

          # A service with variables that reads back as none means the request
          # shape changed or the id is wrong. Writing the merge would then be a
          # DELETE of everything. Refuse instead.
          if not cur:
              raise SystemExit('::error::read back zero env vars — refusing to PUT a smaller set')

          want = {
              'KEYCLOAK_URL': os.environ['KEYCLOAK_URL'],
              'KEYCLOAK_REALM': os.environ['REALM'],
              'AUTH_URL': os.environ['AUTH_URL'],
              # Auth.js v5 rejects an unrecognised Host and only auto-detects
              # Vercel — without this every /api/auth/* route 500s while
              # ordinary pages keep returning 200.
              'AUTH_TRUST_HOST': 'true',
              'NEXT_PUBLIC_APP_URL': os.environ['AUTH_URL'],
              # Where the Next SERVER calls the API. `apiBaseUrl()` in
              # packages/auth reads it; the browser never sees it, and there is
              # deliberately no NEXT_PUBLIC_ twin — the access token is used
              # server-side only and must not cross to the client.
              'API_BASE_URL': os.environ['API_BASE_URL'],
          }

          # Where the customer app is, so the apex can link INTO it. Read at
          # RUNTIME by a server component, which is why it carries no
          # `NEXT_PUBLIC_` prefix: that prefix means Next inlines the value into
          # the browser bundle at BUILD time, so changing this URL would have
          # required a rebuild. `API_BASE_URL` above is named on the same
          # reasoning.
          #
          # Only written when the probe above PROVED the form answers, and in the
          # CANONICAL spelling the app itself would build. When the probe failed
          # the key is absent from `want`, so the merge preserves whatever the
          # service already has rather than overwriting it with an unproven value.
          if os.path.exists('/tmp/customer_url_ok'):
              want['CUSTOMER_WEB_URL'] = open('/tmp/customer_url_ok').read().strip()
          else:
              print('CUSTOMER_WEB_URL   : SKIPPED (probe did not pass); existing value preserved')

          # The supplier funnel's destination. Same rule, same reason: written
          # only when proven, otherwise the existing value is preserved and the
          # button stays hidden rather than pointing somewhere dead.
          if os.path.exists('/tmp/supplier_url_ok'):
              want['SUPPLIER_WEB_URL'] = open('/tmp/supplier_url_ok').read().strip()
          else:
              print('SUPPLIER_WEB_URL   : SKIPPED (probe did not pass); existing value preserved')

          changed = [k for k, v in want.items() if cur.get(k) != v]
          print('variables on the service :', len(cur))
          print('keys that would change   :', changed or '(none)')
          print('keys preserved untouched :', sorted(k for k in cur if k not in want))

          merged = dict(cur)
          merged.update(want)
          json.dump([{'key': k, 'value': v} for k, v in sorted(merged.items())],
                    open('/tmp/merged.json', 'w'))
          print('merged set size          :', len(merged))
          if len(merged) < len(cur):
              raise SystemExit('::error::merged set is smaller than the current set')
          PY

      - name: What this would do
        if: ${{ inputs.confirm != 'APPLY' }}
        run: |
          echo "DRY RUN — nothing written."
          echo "With confirm=APPLY this would PUT the merged set and trigger a redeploy."

      - name: Write the variables and redeploy
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          # ONE PUT of the whole set. Solar learned that repeated partial env
          # changes trigger a redeploy each time, and a boot that misses the
          # health-check window leaves the service stuck at
          # `update_in_progress`, blocking every later deploy.
          curl -fsS -X PUT -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' --data @/tmp/merged.json \
            "https://api.render.com/v1/services/${SERVICE_ID}/env-vars" >/dev/null
          echo "variables written"
          curl -fsS -X POST -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' --data '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys" >/dev/null
          echo "redeploy triggered"

      - name: Read the variables back
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          # A write that succeeded is not proof the value is there. Key names
          # only — values are never printed.
          curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' \
            "https://api.render.com/v1/services/${SERVICE_ID}/env-vars?limit=100" > /tmp/after.json
          python3 - <<'PY'
          import json, sys
          rows = json.load(open('/tmp/after.json'))
          cur = {}
          for r in rows:
              e = r.get('envVar', r)
              if 'key' in e:
                  cur[e['key']] = e.get('value', '')

          # 🔴 READ BACK WHAT WAS ACTUALLY SENT, not a hand-written tuple of four
          # keys. The old list checked KEYCLOAK_URL, KEYCLOAK_REALM, AUTH_URL and
          # AUTH_TRUST_HOST — so API_BASE_URL and CUSTOMER_WEB_URL, the two this
          # workflow now exists to write, were never verified at all. A PUT that
          # stored one of them mangled, truncated or not at all would still have
          # printed "variables written" and exited 0: the exact green-pipeline,
          # invisible-button failure this change was made to end (Supervisor,
          # 2026-08-07). Comparing against the merged set makes any future key
          # verified automatically rather than when somebody remembers.
          sent = {e['key']: e['value'] for e in json.load(open('/tmp/merged.json'))}

          bad = []
          for k, v in sorted(sent.items()):
              present, matches = k in cur, cur.get(k) == v
              # Values are never printed — a run log is not a vault.
              print(f'{k:20} present={present} matches={matches}')
              if not (present and matches):
                  bad.append(k)
          print('total variables :', len(cur))
          if 'AUTH_SECRET' not in cur:
              sys.exit('::error::AUTH_SECRET disappeared — the merge dropped a key')
          print('AUTH_SECRET still present: yes')
          if bad:
              sys.exit(f'::error::these keys did not read back as written: {bad}')
          PY
        env:
          KEYCLOAK_URL: ${{ inputs.keycloak_url }}
          REALM: ${{ inputs.realm }}
          AUTH_URL: ${{ inputs.auth_url }}
