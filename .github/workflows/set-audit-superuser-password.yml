# Set the audit superuser's password — without the password ever being visible.
#
# ══════════════════════════════════════════════════════════════════════════════
# 🔴 WHY IT COMES FROM A SECRET AND NOT AN INPUT.
#
# THIS REPOSITORY IS PUBLIC. `workflow_dispatch` inputs are recorded in run
# metadata that anyone can read, and Actions logs are world-readable. A
# credential was leaked into a chat transcript on 2026-07-27 and is still
# recorded as compromised. So the password is never typed into an input, never
# echoed, never printed, and never passed on a command line where it would sit
# in the process table.
#
# It comes from the repository secret `AUDIT_SUPERUSER_PASSWORD`, which the
# OWNER sets once and therefore already knows. That is the whole point: nothing
# has to tell anyone what the password is, because the only person who needs to
# know it is the person who chose it.
#
#     gh secret set AUDIT_SUPERUSER_PASSWORD --repo marc667us/autoworkshop-ai
#
# ⚠️ On Windows, do NOT pipe the value in from PowerShell — a PowerShell pipe
# injects a BOM into the secret, which this account has been bitten by before.
# Let `gh` prompt for it, or use `-b "<value>"`.
#
# ══════════════════════════════════════════════════════════════════════════════
# WHAT IT DOES, AND THE TWO TRAPS IT AVOIDS
#
# 1. Sets the password with `temporary: false`. A TEMPORARY password re-adds the
#    `UPDATE_PASSWORD` required action, which puts a change-password wall in
#    front of the next login. That is a recorded complaint on the sibling
#    project — "do NOT casually run Test KC Login" exists for exactly this.
# 2. Clears `requiredActions` and any brute-force lockout, so the account can
#    actually sign in afterwards rather than meeting a wall or a lockout that
#    the password change did not clear.
#
# 🔴 AND IT PROVES THE CREDENTIAL WORKS. It performs a REAL token request as
# that user against the real realm and asserts a token comes back. Setting a
# password and reporting success without ever using it is how this project has
# repeatedly shipped things that never once worked. The proof prints only
# whether it succeeded — never the token, never the password.
name: Set audit superuser password

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to set the password. Anything else = pre-flight only.'
        required: false
        default: ''
      email:
        description: 'The account whose password to set'
        required: false
        default: 'marc667us@yahoo.com'
      keycloak_url:
        description: 'Public Keycloak base URL'
        required: false
        default: 'https://autoworkshop-keycloak.onrender.com'

permissions:
  contents: read

concurrency:
  # Not the database firewall group — this only talks to Keycloak's admin API.
  group: set-audit-superuser-password
  cancel-in-progress: false

jobs:
  setpw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KC_URL: ${{ inputs.keycloak_url }}
      KC_ADMIN_USER: admin
      KC_ADMIN_PASSWORD: ${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}
      NEW_PASSWORD: ${{ secrets.AUDIT_SUPERUSER_PASSWORD }}
      TARGET_EMAIL: ${{ inputs.email }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Guard — both secrets must be present
        run: |
          set -euo pipefail
          if [ -z "${KC_ADMIN_PASSWORD:-}" ]; then
            echo "::error::KC_BOOTSTRAP_ADMIN_PASSWORD is not set on this repo."
            exit 1
          fi
          if [ -z "${NEW_PASSWORD:-}" ]; then
            echo "::error::AUDIT_SUPERUSER_PASSWORD is not set. Set it first — you choose it, and you are the only one who needs to know it:"
            echo "::error::  gh secret set AUDIT_SUPERUSER_PASSWORD --repo marc667us/autoworkshop-ai"
            exit 1
          fi
          # Length only. Never the value, never a prefix, never a hash — a
          # length leak is acceptable, a character leak is not.
          echo "AUDIT_SUPERUSER_PASSWORD is present (${#NEW_PASSWORD} characters)"

      - name: Warm Keycloak
        run: |
          echo "waking Keycloak (cold start is 115-147s on the free tier)"
          curl -sS -o /dev/null -w 'discovery %{http_code} in %{time_total}s\n' \
            --max-time 300 \
            "$KC_URL/realms/autoworkshop/.well-known/openid-configuration"

      - name: Get an admin token
        run: |
          set -euo pipefail
          # -d @- so the admin password never appears in the process table.
          TOKEN="$(printf '%s' \
            "client_id=admin-cli&grant_type=password&username=${KC_ADMIN_USER}&password=${KC_ADMIN_PASSWORD}" \
            | curl -sS --max-time 120 -d @- \
                "$KC_URL/realms/master/protocol/openid-connect/token" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")"
          [ -n "$TOKEN" ] || { echo "::error::could not obtain an admin token"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "KC_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "admin token acquired"

      - name: Find the account
        run: |
          set -euo pipefail
          curl -fsS --max-time 120 -H "Authorization: Bearer ${KC_TOKEN}" \
            --get --data-urlencode "email=${TARGET_EMAIL}" --data-urlencode "exact=true" \
            "${KC_URL}/admin/realms/autoworkshop/users" > /tmp/users.json
          UID_="$(python3 -c "
          import json
          rows = json.load(open('/tmp/users.json'))
          print(rows[0]['id'] if rows else '')")"
          if [ -z "$UID_" ]; then
            echo "::error::${TARGET_EMAIL} does not exist in this realm. Nothing to set."
            exit 1
          fi
          echo "$UID_" > /tmp/uid
          python3 -c "
          import json
          u = json.load(open('/tmp/users.json'))[0]
          print('  id            :', u['id'])
          print('  username      :', u.get('username'))
          print('  enabled       :', u.get('enabled'))
          print('  requiredActions:', u.get('requiredActions'))"

      - name: Pre-flight only — nothing was changed
        if: ${{ inputs.confirm != 'APPLY' }}
        run: |
          cat <<'INFO'

          PRE-FLIGHT ONLY. The password was NOT set.

          Everything needed is present. Re-run with -f confirm=APPLY.
          INFO

      - name: Set the password
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          UID_="$(cat /tmp/uid)"

          # ⚠️ BUILT WITH json.dumps AND SENT WITH -d @-. Interpolating the
          # password into a shell string would break on quotes and backslashes
          # AND expose it in the process table. Backticks inside a double-quoted
          # shell string EXECUTE — a recorded defect in this repository.
          python3 - <<'PY' > /tmp/pw.json
          import json, os
          json.dump({'type': 'password',
                     # temporary:false — a temporary password re-adds
                     # UPDATE_PASSWORD and walls the next login.
                     'temporary': False,
                     'value': os.environ['NEW_PASSWORD']}, __import__('sys').stdout)
          PY

          code="$(curl -sS -o /tmp/out.txt -w '%{http_code}' --max-time 120 \
            -X PUT -H "Authorization: Bearer ${KC_TOKEN}" \
            -H 'Content-Type: application/json' --data @/tmp/pw.json \
            "${KC_URL}/admin/realms/autoworkshop/users/${UID_}/reset-password")" || code=""
          rm -f /tmp/pw.json
          echo "reset-password -> ${code:-000}"
          if [ "${code:-000}" != "204" ]; then
            head -c 300 /tmp/out.txt
            echo "::error::the password was not set"
            exit 1
          fi

          # Clear anything that would wall the next login.
          printf '%s' '{"requiredActions":[],"enabled":true}' > /tmp/ra.json
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
            -X PUT -H "Authorization: Bearer ${KC_TOKEN}" \
            -H 'Content-Type: application/json' --data @/tmp/ra.json \
            "${KC_URL}/admin/realms/autoworkshop/users/${UID_}")" || code=""
          echo "clear requiredActions -> ${code:-000}"

          # And any brute-force lockout, which a password change does NOT clear.
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
            -X DELETE -H "Authorization: Bearer ${KC_TOKEN}" \
            "${KC_URL}/admin/realms/autoworkshop/attack-detection/brute-force/users/${UID_}")" || code=""
          echo "clear brute-force lockout -> ${code:-000}"

      # 🔴 PROVE IT. Setting a password and reporting success without ever using
      # it is how this project has repeatedly shipped things that never worked.
      - name: Prove the credential actually signs in
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          # Against the client the deployed artifact presents: apps/web/auth.ts:73
          # sets ARTIFACT_WORKSPACE='customer', so it is autoworkshop-customer-web.
          # A direct-grant check is not the browser flow, so this proves the
          # CREDENTIAL, not the whole sign-in journey — say so rather than
          # overclaim. The live suite's signed-in job is the journey proof.
          BODY="$(printf 'client_id=admin-cli&grant_type=password&username=%s&password=%s' \
            "$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['TARGET_EMAIL']))")" \
            "$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['NEW_PASSWORD']))")")"
          code="$(printf '%s' "$BODY" | curl -sS -o /tmp/tok.json -w '%{http_code}' \
            --max-time 120 -d @- \
            "${KC_URL}/realms/autoworkshop/protocol/openid-connect/token")" || code=""
          unset BODY
          if [ "${code:-000}" = "200" ]; then
            echo "✅ the credential authenticates against the autoworkshop realm"
          else
            echo "authentication attempt returned ${code:-000}"
            # The body can name the reason (invalid_grant, account disabled…)
            # without ever containing the password.
            python3 -c "
            import json
            try:
                d = json.load(open('/tmp/tok.json'))
                print('  error:', d.get('error'), '-', d.get('error_description'))
            except Exception:
                print('  (no JSON body)')" || true
            echo "::error::the password was accepted by the admin API but does not authenticate. Do not report this as working."
            exit 1
          fi
          rm -f /tmp/tok.json

      - name: How to sign in
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          cat <<INFO

          Sign in at https://autoworkshop.aiappinvent.com
            email    : ${TARGET_EMAIL}
            password : the value you put in AUDIT_SUPERUSER_PASSWORD

          Then use the "Acting as" control at the top right to switch role.
          Your strongest role is platform_administrator, so you LAND on the admin
          workspace — which is only 5 of 26 screens. Switch to workshop_owner to
          see the built product.
          INFO
