# Read-only status probe for the `autoworkshop` Render service.
#
# Exists because the Render API key is a repository secret and cannot be read
# from a developer machine, so there is otherwise no way to ask Render what
# state the service is actually in without clicking through the console and
# transcribing it — which is how several "facts" in earlier sessions turned out
# to be wrong.
#
# SCOPED TO A FIXED SET OF SERVICE IDS ON PURPOSE. The owner's Render account
# also hosts the Solar production application, which is explicitly off-limits.
# The id comes from a `choice` input, never free text, so no typo can address a
# neighbouring service and nothing is ever enumerated.
#
# ⚠️ IT USED TO HARDCODE `srv-d9jsliu7r5hc73b1kncg` — the NODE service that was
# retired when ADR-017 moved production to prebuilt images. So on 2026-07-28,
# with production and staging both answering 503, this workflow cheerfully
# reported a healthy service: the wrong one, and one that had never served
# traffic. A probe pointed at a decommissioned resource is worse than no probe.
#
# READ-ONLY. GET requests only; it creates, updates and deletes nothing.
name: Render status

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Which AutoWorkshop service to probe'
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
          - retired-node-service

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      # Resolved from the choice, so the id is never typed by hand.
      SERVICE_ID: >-
        ${{ inputs.service == 'production' && 'srv-d9ju49id0e5s7389fjlg'
         || inputs.service == 'staging'    && 'srv-d9jun8m417fc73dore50'
         || 'srv-d9jsliu7r5hc73b1kncg' }}
    steps:
      - name: Which service
        run: echo "probing ${{ inputs.service }} -> $SERVICE_ID"
      - name: Service definition
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/${SERVICE_ID}" > svc.json
          python3 - <<'PY'
          import json
          d = json.load(open('svc.json'))
          det = d.get('serviceDetails', {}) or {}
          esd = det.get('envSpecificDetails', {}) or {}
          print(f"name        : {d.get('name')}")
          print(f"id          : {d.get('id')}")
          print(f"type        : {d.get('type')}   runtime: {det.get('env') or det.get('runtime')}")
          print(f"suspended   : {d.get('suspended')}")
          # WHO suspended it is the whole diagnosis. Render reports `suspenders`
          # as a list: an empty list with suspended=suspended means the platform
          # did it (free instance-hour exhaustion is the usual cause on this
          # account), whereas ['user'] or ['admin'] means someone chose to. The
          # remedies are completely different and the 503 looks identical.
          print(f"suspenders  : {d.get('suspenders')}")
          print(f"root keys   : {sorted(d.keys())}")
          print(f"branch      : {d.get('branch')}   autoDeploy: {d.get('autoDeploy')}")
          print(f"repo        : {d.get('repo')}")
          print(f"rootDir     : {d.get('rootDir')!r}")
          print(f"plan/region : {det.get('plan')} / {det.get('region')}")
          print(f"healthCheck : {det.get('healthCheckPath')!r}")
          print(f"url         : {det.get('url')}")
          print()
          print(f"buildCommand: {esd.get('buildCommand')!r}")
          print(f"startCommand: {esd.get('startCommand')!r}")
          PY

      - name: Environment variable KEYS (values never printed)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          # Keys only. AUTH_SECRET lives here and a run log is not a vault.
          curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/${SERVICE_ID}/env-vars?limit=50" \
          | python3 -c "import sys,json;[print(' -',r['envVar']['key']) for r in json.load(sys.stdin)]"

      - name: Custom domains
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/${SERVICE_ID}/custom-domains?limit=20" \
          | python3 -c "
          import sys, json
          rows = json.load(sys.stdin)
          if not rows: print('NO CUSTOM DOMAIN ATTACHED')
          for r in rows:
              d = r['customDomain']
              print(f\" - {d.get('name')}  verified={d.get('verificationStatus')}\")"

      - name: Recent deploys
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys?limit=10" \
          | python3 -c "
          import sys, json
          rows = json.load(sys.stdin)
          if not rows: print('NO DEPLOYS HAVE EVER RUN ON THIS SERVICE')
          for r in rows:
              d = r['deploy']
              c = (d.get('commit') or {}).get('id','')[:7]
              print(f\" - {d.get('id')}  {d.get('status'):<12} commit={c or 'n/a'}  finished={d.get('finishedAt')}\")
              if d.get('status') not in ('live','build_in_progress','update_in_progress'):
                  print(f\"     trigger={d.get('trigger')}\")"

      # WHY is the service suspended? The service object says only
      # `suspenders: ['billing']`, which does not distinguish "the account's free
      # instance-hour allowance is spent" from "a payment failed". The remedies
      # differ completely and the 503 is identical, so the account object is
      # asked directly rather than inferred from arithmetic.
      #
      # READ-ONLY, and scoped to the OWNER of the AutoWorkshop service — it reads
      # no other service and cannot reach the Solar application (ADR-011).
      - name: Account state (read-only)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          OWNER="$(python3 -c "import json;print(json.load(open('svc.json'))['ownerId'])")"
          echo "ownerId: $OWNER"
          code="$(curl -s -o owner.json -w '%{http_code}'             -H "Authorization: Bearer $RENDER_API_KEY"             "https://api.render.com/v1/owners/${OWNER}")"
          echo "GET /owners/$OWNER -> $code"
          if [ "$code" = "200" ]; then
            python3 - <<'PY2'
          import json
          d = json.load(open('owner.json'))
          o = d.get('owner', d)
          for k in sorted(o.keys()):
              if k in ('email',):
                  continue  # not printed: it is the owner's address, not a fact about the outage
              print(f"{k:24}: {o[k]}")
          PY2
          else
            head -c 300 owner.json || true; echo ""
            echo "::warning::owner endpoint not readable with this key — the account reason cannot be fetched here"
          fi
