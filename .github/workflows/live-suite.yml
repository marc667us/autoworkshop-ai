# THE FULL SUITE, RUN AGAINST THE DEPLOYED SITE.
#
# ══════════════════════════════════════════════════════════════════════════
# 🔴 OWNER POLICY, 2026-08-07 — HARD, AND IT APPLIES TO EVERY PROJECT:
#
#   "everytime you deploy you must run full test suite on the live site"
#
# A deploy is NOT finished when the workflow turns green. It is finished when
# this has run against the DEPLOYED site and the counts have been reported.
# ══════════════════════════════════════════════════════════════════════════
#
# ── WHY THE OWNER IS RIGHT, IN THIS REPOSITORY SPECIFICALLY ────────────────
#
# Every one of these passed CI and was broken for real users:
#
#   · the owner's headline button was gated on an env var set on neither the
#     service nor the build — it could not render for anyone, and a green
#     deploy said nothing. Found by grepping the LIVE HTML for its own text.
#   · slice 11's proxy omitted the API's `/api/v1` prefix. Compiled fine.
#   · `Release` deploys workshop-web ONLY, so "deployed" was true of one app
#     and false of the next.
#   · verifyEmail was ON with no smtpServer, which BLOCKED SIGN-UP. Nothing in
#     a build can see a realm flag.
#   · local is superuser and Render is not, so a whole class of RLS defect is
#     invisible to a local suite by construction.
#
# The shape they share: THE THING THAT WAS WRONG WAS NOT OBSERVABLE FROM THE
# BUILD. This is the only gate that looks at what users actually reach.
#
# ── ⚠️ HOW THIS REPORTS, AND WHY IT MATTERS ───────────────────────────────
#
# PASSED / FAILED / SKIPPED as THREE NUMBERS, never an exit code. This
# repository lost two days to `pnpm e2e` exiting 0 while collecting zero tests,
# and has a standing rule that a skip is a third state which must be said out
# loud. A check that cannot run is SKIPPED and named — never folded into passed.
#
# ⚠️ COLD STARTS ARE NOT OUTAGES. These are free-tier services: Keycloak has
# been measured at ~127s from cold, and a 90s timeout produced a "the app is
# down" report on 2026-08-07 when nothing was wrong. Every check warms its
# target first and allows a cold-start-sized budget before calling it a failure.

name: Live suite

# 🔴 ADR-021 CHANGED WHAT THESE URLS MEAN, AND THIS FILE IS ONLY PARTLY ADAPTED.
#
# Each pack used to be its own Render service on its own hostname, so `customer`
# was `https://autoworkshop-customer.onrender.com` and the suite composed
# `f'{CUSTOMER}/some/path'`. Those five services were DELETED on 2026-08-13 and
# their hostnames now 404 at Render's edge — so left unchanged, every check
# against them would have failed for a reason that has nothing to do with the
# product.
#
# The base URLs below now point at the packs' mount points inside the one
# artifact, which is the correct structural change and is what makes the
# `f'{PACK}/path'` composition keep working unaltered.
#
# ⚠️ TWO KNOWN PATHS ARE NOT YET RIGHT, AND ARE WRITTEN DOWN RATHER THAN LEFT TO
# BE DISCOVERED AS MYSTERY FAILURES:
#
#   · `f'{CUSTOMER}/robots.txt'` — `robots.ts` was hoisted to the ARTIFACT root
#     with the rest of the public surface, so it is served at `/robots.txt`, not
#     at `/customer/robots.txt`.
#   · `APEX` used to serve the public marketplace at `/` because workshop-web
#     held the apex. The marketplace is still at `/`, but `/workshop` now
#     redirects into the workshop dashboard — so any APEX check that expects
#     storefront CONTENT at a workshop path is asserting the old topology.
#
# 🔴 THIS SUITE HAS NOT BEEN RUN SINCE THE CONSOLIDATION. Do not quote a number
# from it until it has. A partly-adapted gate that reports a count is worse than
# one that plainly has not run — "a green gate that runs nothing" is a recorded
# defect in this repository.
on:
  workflow_dispatch:
    inputs:
      apex:
        description: 'Apex — the ONE artifact (ADR-021). The packs are paths beneath it.'
        required: false
        default: 'https://autoworkshop.aiappinvent.com'
      customer:
        description: 'customer-web base URL'
        required: false
        default: 'https://autoworkshop.aiappinvent.com/customer'
      towing:
        description: 'towing-web base URL'
        required: false
        default: 'https://autoworkshop.aiappinvent.com/towing'
      admin:
        description: 'admin-web base URL'
        required: false
        default: 'https://autoworkshop.aiappinvent.com/admin'
      fleet:
        description: 'fleet-web base URL'
        required: false
        default: 'https://autoworkshop.aiappinvent.com/fleet'
      insurance:
        description: 'insurance-web base URL'
        required: false
        default: 'https://autoworkshop.aiappinvent.com/insurance'
      api:
        description: 'API base URL'
        required: false
        default: 'https://autoworkshop-api.onrender.com'
      keycloak:
        description: 'Keycloak base URL'
        required: false
        default: 'https://autoworkshop-keycloak.onrender.com'
  # Runs itself after a release, so complying with the policy is the default
  # rather than something a person has to remember at the end of a long day.
  workflow_run:
    workflows: ['Release']
    types: [completed]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APEX: ${{ inputs.apex || 'https://autoworkshop.aiappinvent.com' }}
      CUSTOMER: ${{ inputs.customer || 'https://autoworkshop.aiappinvent.com/customer' }}
      TOWING: ${{ inputs.towing || 'https://autoworkshop.aiappinvent.com/towing' }}
      ADMIN: ${{ inputs.admin || 'https://autoworkshop.aiappinvent.com/admin' }}
      FLEET: ${{ inputs.fleet || 'https://autoworkshop.aiappinvent.com/fleet' }}
      INSURANCE: ${{ inputs.insurance || 'https://autoworkshop.aiappinvent.com/insurance' }}
      API: ${{ inputs.api || 'https://autoworkshop-api.onrender.com' }}
      KEYCLOAK: ${{ inputs.keycloak || 'https://autoworkshop-keycloak.onrender.com' }}
      REALM: autoworkshop

    steps:
      - name: Wake every service before timing anything against it
        run: |
          set -uo pipefail
          # 🔴 NOT A TEST — a PRECONDITION. Free instances spin down, and the
          # first request pays the whole cold start. Measuring before warming is
          # how a healthy platform gets reported as an outage; that happened on
          # 2026-08-07 and cost an hour.
          for url in "$APEX" "$CUSTOMER" "$TOWING" "$ADMIN" "$FLEET" "$INSURANCE" "$API/api/v1/health" "$KEYCLOAK/realms/$REALM/.well-known/openid-configuration"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 240 "$url" || echo 000)"
            echo "warm  $url -> $code"
          done

      - name: The suite
        run: |
          set -uo pipefail
          python3 - <<'PY'
          # `time` is for the backoff in `reachable()` — without it the retry
          # path raises NameError and the whole suite dies at the first flap,
          # which is strictly worse than the false red it was added to fix.
          import json, os, re, sys, time, urllib.request, urllib.error

          APEX     = os.environ['APEX'].rstrip('/')
          CUSTOMER = os.environ['CUSTOMER'].rstrip('/')
          TOWING   = os.environ['TOWING'].rstrip('/')
          ADMIN    = os.environ['ADMIN'].rstrip('/')
          FLEET    = os.environ['FLEET'].rstrip('/')
          INSURANCE = os.environ['INSURANCE'].rstrip('/')
          API      = os.environ['API'].rstrip('/')
          KEYCLOAK = os.environ['KEYCLOAK'].rstrip('/')
          REALM    = os.environ['REALM']

          passed, failed, skipped = [], [], []

          def fetch(url, timeout=180):
              """(status, body). Never raises — a transport failure is a RESULT."""
              req = urllib.request.Request(url, headers={'User-Agent': 'aw-live-suite'})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  # 🔴 AN HTTP ERROR IS AN ANSWER, NOT AN OUTAGE. 401 and 404 are
                  # the two most informative results in this whole file — a route
                  # that 401s EXISTS, and one that 404s does not.
                  return e.code, e.read().decode('utf-8', 'replace')
              except Exception as e:
                  return 0, f'{type(e).__name__}: {e}'

          def post(url, body, timeout=180):
              """(status, body) for a POST. Never raises — same contract as fetch.

              ⚠️ A GET AGAINST A POST-ONLY ROUTE RETURNS 404, WHICH IS EXACTLY
              THE SIGNAL THIS SUITE USES TO MEAN "NOT DEPLOYED". Without this
              helper, checking `POST /registration/customer` with `fetch` would
              report a permanent, confident FAILURE against a perfectly healthy
              deployment — the cry-wolf defect the note below already records
              once, arriving by a different door.
              """
              data = json.dumps(body).encode()
              req = urllib.request.Request(
                  url, data=data, method='POST',
                  headers={'User-Agent': 'aw-live-suite', 'Content-Type': 'application/json'},
              )
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')
              except Exception as e:
                  return 0, f'{type(e).__name__}: {e}'

          def check(name, fn):
              try:
                  ok, detail = fn()
              except Exception as e:
                  failed.append((name, f'the check itself raised {type(e).__name__}: {e}'))
                  return
              if ok is None:
                  skipped.append((name, detail))
              elif ok:
                  passed.append((name, detail))
              else:
                  failed.append((name, detail))

          # ── REACHABILITY ────────────────────────────────────────────────────
          # 🔴 RETRIED SINCE 2026-08-10, BECAUSE THE FLAP REACHED AN OLD SERVICE.
          #
          # `reachable()` below was given retries for the three NEWEST services,
          # on the reasoning that "the six services that existed before this
          # batch answered 5 of 5 at the same moment". That is no longer true:
          # customer-web failed this single-shot check TWICE in a row on 08-10.
          #
          # It is not a cold start and not a defect in the app, and both were
          # checked rather than assumed:
          #   · the suite's OWN wake step recorded `customer-web -> 200` minutes
          #     before the suite then read 502 from the same URL, so the service
          #     was demonstrably awake;
          #   · on demand it answered 200 fifteen times running at ~1s, and ten
          #     more with the suite's exact `aw-live-suite` User-Agent, ruling
          #     out a bot/UA path.
          # That is Render's edge intermittently having no instance — the same
          # thing `reachable()` documents — and nine free services now share one
          # allowance sized for four.
          #
          # ⚠️ THIS DOES NOT HIDE IT. The attempt count is REPORTED, exactly as
          # `reachable()` does, so a rising count stays the early warning. What
          # it stops is a coin flip turning the whole gate red and teaching
          # people that red means nothing.
          def up(label, url, want=200):
              def run():
                  codes = []
                  for _ in range(4):
                      s, _ = fetch(url)
                      codes.append(s)
                      if s == want:
                          note = '' if len(codes) == 1 else                               f' — took {len(codes)} attempts ({codes}); Render router flap'
                          return True, f'HTTP {want}{note}'
                  return False, f'never answered {want} in 4 attempts: {codes}'
              check(f'{label} answers', run)

          up('apex', APEX)
          up('customer-web', CUSTOMER)
          up('towing-web', TOWING)
          up('api health', f'{API}/api/v1/health')
          up('keycloak realm', f'{KEYCLOAK}/realms/{REALM}/.well-known/openid-configuration')

          # ── TOWING: TEN SCREENS THAT WERE REACHABLE BY NOBODY ──────────────
          #
          # 🔴 WRITTEN BECAUSE THIS SUITE WENT 25/0/4 GREEN THE DAY towing
          # SHIPPED AND TOUCHED NONE OF IT. The app had ten finished screens,
          # seven tables and fourteen gated routes, and no deploy path at all —
          # no workflow, no Render service. The API answered 401, which every
          # gate read as success, while not one screen was reachable. The suite
          # could not have noticed, because it did not know the app existed.
          #
          # ⚠️ EIGHT ANSWER 200 AND TWO ANSWER 404, AND BOTH ARE CORRECT.
          # `requireNavRoute` calls `notFound()` for a route the viewer's nav
          # tree does not advertise, and `invoices` (finance.read) and
          # `settings` (organization.admin) carry permission keys — so an
          # anonymous visitor must NOT learn they exist. Asserting 404 on those
          # two is a SECURITY assertion, not a tolerance: a 200 here would mean
          # a permission-gated screen had started rendering for the public.
          for screen in ['/operations/dashboard', '/operations/new-requests',
                         '/operations/dispatch-board', '/operations/drivers',
                         '/operations/recovery-vehicles', '/operations/active-recoveries',
                         '/operations/completed-recoveries', '/operations/incidents']:
              def run(p=screen):
                  s, _ = fetch(f'{TOWING}{p}')
                  return s == 200, f'HTTP {s} (wanted 200)'
              check(f'towing {screen} renders', run)

          for screen in ['/operations/invoices', '/operations/settings']:
              def run(p=screen):
                  s, _ = fetch(f'{TOWING}{p}')
                  return s == 404, f'HTTP {s} (wanted 404 — permission-gated, must not exist for the public)'
              check(f'towing {screen} is hidden from anonymous', run)

          # ── THE THREE APPS DEPLOYED 2026-08-09, AND A MEASURED FLAP ───────
          #
          # 🔴 THESE ARE RETRY-AWARE ON PURPOSE, AND THE RETRY COUNT IS THE
          # FINDING. Within minutes of being created, all three answered the
          # SAME url back-to-back as 200, 200, 404, 200, 404, 404 — every 404
          # being a 10-byte `Not Found` from Render's edge carrying
          # `x-render-routing: no-server`, returned in ~0.6s. That is far too
          # fast to be a cold start (a free-tier wake was measured at 136s); it
          # is Render's router intermittently having no instance for a service
          # that is otherwise up.
          #
          # The six services that existed before this batch answered 5 of 5 at
          # the same moment, so this is NOT a platform outage — it is the three
          # newest services on a free allowance that has now been asked to hold
          # NINE. The codebase has warned about this since the fifth.
          #
          # A single sample would therefore report a coin flip, and this suite
          # must not cry wolf. So each check retries and REPORTS HOW MANY
          # ATTEMPTS IT TOOK. One attempt is healthy; several is the flap, still
          # visible, still recorded, without turning the gate into noise.
          # 🔴 THE RETRIES HAD NO DELAY, AND ON 2026-08-11 THAT PRODUCED A FALSE
          # RED THAT ALSO COST TWENTY MINUTES OF WALL CLOCK.
          #
          # `insurance-web is reachable` failed with `[0, 0, 0, 0]` — four
          # TRANSPORT failures, not four 404s — while, IN THE SAME RUN, the check
          # `insurance /home/dashboard — renders with the shell` passed against
          # the SAME URL with `[0, 200]`. Re-measured immediately afterwards with
          # this file's own `fetch` and its `aw-live-suite` User-Agent: 200 six
          # times out of six, in ~0.5s. The deployment was fine.
          #
          # Back-to-back retries all land inside the SAME transient window, so
          # four attempts asked one question four times rather than asking it
          # four times over. Worse, `fetch` has a 180s timeout and a transport
          # hang consumes all of it, so four failures can burn TWELVE MINUTES
          # before reporting — which is why that run took 24 minutes.
          #
          # ⚠️ THIS IS THE SAME DEFECT ALREADY RECORDED IN `deploy-supplier-web.yml`
          # ("the cold-start retries have no sleep — six instant 502s in under a
          # second, calling a spun-down service dead 30s before it wakes"). It
          # was fixed there and this copy was missed. Fixing the instrument, not
          # the product: on 2026-08-10 three of four reds were in the checking
          # machinery.
          #
          # The timeout is also cut for THIS check specifically. Reachability is
          # a question about the router, which answers in well under a second
          # when it has an instance; 180s buys nothing here and only lengthens
          # the failure path. The full 180s stays everywhere else, where a real
          # free-tier cold start (measured at 136s) must not be called an outage.
          def reachable(label, base, path):
              def run():
                  codes = []
                  for attempt in range(4):
                      s, body = fetch(f'{base}{path}', timeout=45)
                      codes.append(s)
                      if s == 200:
                          note = '' if len(codes) == 1 else \
                              f' — took {len(codes)} attempts ({codes}); Render router flap'
                          return True, f'HTTP 200{note}'
                      # Widening pause between attempts: 2s, 4s, 8s. Deliberately
                      # not before the FIRST retry-free success, and deliberately
                      # not after the LAST attempt — sleeping before reporting a
                      # failure delays the answer without improving it.
                      if attempt < 3:
                          time.sleep(2 * (2 ** attempt))
                  return False, (
                      f'never answered 200 in 4 attempts over ~14s: {codes} '
                      f'(0 = transport failure, not an HTTP answer)'
                  )
              check(f'{label} is reachable', run)

          reachable('admin-web', ADMIN, '/home/operations-dashboard')
          reachable('fleet-web', FLEET, '/home/dashboard')
          reachable('insurance-web', INSURANCE, '/home/dashboard')

          # ── THE NEW DEPLOYMENTS, SCREEN BY SCREEN ─────────────────────────
          #
          # One reachability probe per app is not a test of an app; towing has
          # twelve checks and these had one each. These are the rest.
          #
          # ⚠️ EVERY REQUEST HERE GOES THROUGH `stable`, because these three
          # services flap (see the note above): a raw sample would fail on
          # Render's router rather than on the product, and a suite that blames
          # the product for the platform is worse than no suite.
          def stable(base, path, attempts=4):
              """(status, body, codes) — retries past Render's `no-server` 404s."""
              codes = []
              body = ''
              for _ in range(attempts):
                  s, body = fetch(f'{base}{path}')
                  codes.append(s)
                  if s == 200:
                      break
              return codes[-1], body, codes

          def renders(label, base, path):
              """200, and the signed-out shell actually rendered.

              A 200 alone is satisfied by an error page. `Sign in` is the shell's
              own text (`AccountControl`), so its presence proves the layout,
              the navigation and the viewer resolution all ran — and that an
              anonymous visitor has a way in rather than a dead end.
              """
              def run():
                  s, body, codes = stable(base, path)
                  if s != 200:
                      return False, f'HTTP {s} after {len(codes)} attempts {codes}'
                  if not re.search(r'[Ss]ign in', body):
                      return False, f'200 but NO sign-in affordance — the shell did not render'
                  tries = '' if len(codes) == 1 else f' (took {len(codes)}: {codes})'
                  return True, f'renders with the shell{tries}'
              check(f'{label} {path}', run)

          # admin-web — the FIVE screens that are actually built.
          for path in ['/home/operations-dashboard', '/directory/organizations',
                       '/directory/registrations', '/catalogue-and-content/products',
                       '/security-and-operations/security']:
              renders('admin', ADMIN, path)

          # fleet-web and insurance-web — NOTHING is built, so what is being
          # asserted is that the shell and routing work and no route is a dead
          # end. A sample across groups rather than all 29/28: every one costs up
          # to four requests against a flapping service.
          for path in ['/home/dashboard', '/home/tasks', '/fleet-assets/vehicles',
                       '/fleet-assets/drivers', '/service-management/maintenance-plans',
                       '/service-management/service-requests']:
              renders('fleet', FLEET, path)

          for path in ['/home/dashboard', '/home/tasks', '/claims/new-claims',
                       '/claims/under-review', '/claims/closed-claims',
                       '/assessment/damage-evidence']:
              renders('insurance', INSURANCE, path)

          # 🔴 A TRIPWIRE ON THE COVERAGE CLAIM, NOT DECORATION.
          #
          # fleet-web is 0 of 29 built and insurance-web 0 of 28. These assert
          # that their landing screens are still the honest placeholder — the
          # placeholder names its own screen ("... has not been built yet") and
          # carries sibling links, which is what makes an unbuilt route a signpost
          # instead of a dead end.
          #
          # ⚠️ THESE ARE MEANT TO FAIL THE DAY SOMEBODY BUILDS THE DASHBOARD.
          # That failure is the reminder to update the coverage number in
          # COMPLETION_PLAN.md and the audit, which is exactly the bookkeeping
          # that drifted far enough for the audit to report 100% while measuring
          # two apps out of seven.
          def still_placeholder(label, base, path):
              def run():
                  s, body, codes = stable(base, path)
                  if s != 200:
                      return False, f'HTTP {s} after {len(codes)} attempts {codes}'
                  ph = 'has not been built yet' in body
                  sib = 'Elsewhere in' in body
                  if ph and sib:
                      return True, 'still the honest placeholder, with sibling links'
                  if ph:
                      return False, 'placeholder WITHOUT sibling links — an unbuilt route became a dead end'
                  return None, 'no longer a placeholder — a screen was built here; update the coverage count'
              check(f'{label} {path} is still unbuilt', run)

          still_placeholder('fleet', FLEET, '/home/dashboard')
          still_placeholder('insurance', INSURANCE, '/home/dashboard')

          def towing_offers_sign_in():
              s, body = fetch(f'{TOWING}/operations/dashboard')
              if s != 200:
                  return False, f'dashboard returned {s}'
              hit = re.search(r'[Ss]ign in', body)
              return bool(hit), 'the shell offers a way in' if hit \
                  else 'NO sign-in affordance — an operator has no way in'
          check('towing-web offers a way to sign in', towing_offers_sign_in)

          # ── THE OWNER'S FUNNEL, BY ITS OWN TEXT ────────────────────────────
          # 🔴 GREP THE LIVE HTML FOR THE FEATURE'S OWN WORDS. The button that
          # could not render passed typecheck, lint, unit tests, a container
          # smoke test and a Render deploy. Only its absence from the served
          # HTML would have caught it.
          def landing_has_request_button():
              s, body = fetch(APEX)
              if s != 200:
                  return False, f'apex returned {s}'
              hit = re.search(r'[Rr]equest (repair )?service', body)
              return bool(hit), 'found the request-service call to action' if hit \
                  else 'NO request-service text in the served HTML'
          check('apex offers "Request repair service"', landing_has_request_button)

          def request_form_route_exists():
              s, body = fetch(f'{CUSTOMER}/service-and-repairs/request-service')
              if s not in (200, 302, 307):
                  return False, f'the funnel destination returned {s}'
              return True, f'HTTP {s}'
          check('request-service route is reachable', request_form_route_exists)

          # 🔴 ANONYMOUS MUST NOT GET A FILLABLE FORM. A visitor arriving from the
          # apex has no session on this host (separate hosts, separate cookies),
          # and the form used to render for them anyway — they typed a fault,
          # pressed send, and lost everything. It must refuse BEFORE it is filled.
          def anonymous_sees_no_form():
              s, body = fetch(f'{CUSTOMER}/service-and-repairs/request-service')
              if s != 200:
                  return None, f'route returned {s}; nothing to inspect'
              forms = len(re.findall(r'<form', body, re.I))
              textareas = len(re.findall(r'<textarea', body, re.I))
              ok = forms == 0 and textareas == 0
              return ok, f'{forms} <form>, {textareas} <textarea> for an anonymous visitor'
          check('anonymous visitor gets no fillable request form', anonymous_sees_no_form)

          # ── THE SUBMIT BUTTON MUST EXIST WHERE A FORM DOES ─────────────────
          # The owner reported a form with no submit control on 2026-08-07; two
          # of 49 forms had none. A static test guards the source; this checks
          # the SERVED page, because those are different claims.
          def served_forms_have_submit():
              s, body = fetch(f'{CUSTOMER}/')
              if s != 200:
                  return None, f'customer landing returned {s}'
              forms = len(re.findall(r'<form', body, re.I))
              if forms == 0:
                  return None, 'no form on this page to check'
              submits = len(re.findall(r'type="submit"', body, re.I))
              return submits >= 1, f'{forms} form(s), {submits} submit control(s)'
          check('served forms carry a submit control', served_forms_have_submit)

          # ── ROUTES EXIST: 401 IS THE PROOF, 404 IS THE FAILURE ─────────────
          # ⚠️ THESE PATHS ARE REAL ROUTES, VERIFIED IN THE CONTROLLERS. The first
          # run of this suite asserted `/plan-work/board`, which has never
          # existed — `planning.controller.ts` serves find-parts, tools, bays and
          # bookings — and reported a FAILURE against a healthy product. A live
          # suite that cries wolf is worse than none, because the next real
          # failure is read as another bad assertion.
          for path in ['/service-requests', '/supplier-requests', '/notifications',
                       '/plan-work/bays', '/plan-work/tools', '/learning/materials',
                       # Towing, added 2026-08-09 with the app's first deploy.
                       # ⚠️ THE PREFIX IS `api/v1` AND THAT IS WHY THESE READ
                       # `/towing/...` HERE — a probe written without the prefix
                       # 404s on every route in the API and reads exactly like
                       # "the feature is not deployed". It cost a false alarm on
                       # these very routes the day they went live.
                       '/towing/dashboard', '/towing/requests', '/towing/recoveries',
                       '/towing/drivers', '/towing/vehicles', '/towing/incidents',
                       '/towing/invoices', '/towing/settings']:
              def run(p=path):
                  s, _ = fetch(f'{API}/api/v1{p}')
                  # 401/403 = the route is deployed and refuses anonymous callers.
                  # 404 = it is not deployed at all, which is the defect this
                  # family of checks exists to catch.
                  return s in (401, 403), f'HTTP {s} (401/403 = deployed and gated)'
              check(f'API {path} is deployed and refuses anonymous', run)

          # ── 2026-08-08's CHANGE, VERIFIED ON LIVE ──────────────────────────
          #
          # 🔴 WRITTEN BECAUSE THE SUITE PASSED 16/0/0 AGAINST A DEPLOY THAT
          # CONTAINED NONE OF IT. Customer enrolment, the agent layer and six
          # closed authorization leaks all shipped, and not one of the 16 checks
          # touched any of them. A green suite that does not exercise the change
          # is not evidence about the change — the same shape as the fixture
          # defect found the same day, where the whole customer funnel had been
          # "proven" against a membership no production code path could create.
          #
          # These are deliberately CHEAP and UNAUTHENTICATED. Every one asks the
          # only question an anonymous caller can answer honestly: is the route
          # THERE, and does it REFUSE me? 404 means the deploy did not carry the
          # change; 200 would mean it carries it without a gate.

          # POST-only routes. `fetch` would 404 on all of these for the method,
          # not the deployment — see `post`.
          for path, body in [
              ('/registration/customer', {'organizationId': '11111111-1111-1111-1111-111111111111'}),
              ('/agents/discover/suppliers', {'url': 'https://example.com', 'brief': 'live suite probe'}),
              ('/agents/discover/leads', {'url': 'https://example.com', 'brief': 'live suite probe'}),
          ]:
              def run(p=path, b=body):
                  s, _ = post(f'{API}/api/v1{p}', b)
                  # ⚠️ 400 IS ALSO A PASS, and saying so is the honest thing: it
                  # means the route is deployed and its VALIDATION ran, which is
                  # strictly more than 401 proves. What must never appear is 404
                  # (not deployed) or 2xx (deployed with no gate at all).
                  return s in (400, 401, 403), f'HTTP {s} (400/401/403 = deployed and gated)'
              check(f'API POST {path} is deployed and refuses anonymous', run)

          # ── 2026-08-09's CHANGE, VERIFIED ON LIVE ──────────────────────────
          #
          # 🔴 SAME RULE AS THE BLOCK ABOVE, WHICH EXISTS BECAUSE A GREEN 16/0/0
          # ONCE CERTIFIED A DEPLOY IT DID NOT TOUCH. Migrations 067-072 added
          # self-service supplier registration, the verification queue and the
          # lead read model; without these three the suite would pass without
          # exercising a line of it.
          for path, body in [
              ('/registration/supplier', {'supplierName': 'live suite probe'}),
          ]:
              def run(p=path, b=body):
                  s, _ = post(f'{API}/api/v1{p}', b)
                  return s in (400, 401, 403), f'HTTP {s} (400/401/403 = deployed and gated)'
              check(f'API POST {path} is deployed and refuses anonymous', run)

          # GET routes added the same day.
          for path in ['/agents/proposals', '/leads', '/registrations', '/registrations/mine']:
              def run(p=path):
                  s, _ = fetch(f'{API}/api/v1{p}')
                  return s in (401, 403), f'HTTP {s} (401/403 = deployed and gated)'
              check(f'API {path} is deployed and refuses anonymous', run)

          # 🔴 THE MIGRATION, NOT JUST THE CODE. `/agents/proposals` reads
          # `agents.proposals`; if migration 064 had not been applied the route
          # would still 401 an anonymous caller, because the guard runs BEFORE
          # any query. So a 401 there says nothing whatever about the schema.
          #
          # `/registration/status` is the one route that is reachable with only
          # a token and touches the identity tables the 061/063 migrations
          # altered. It still refuses anonymously, so this remains a deployment
          # check rather than a schema one — and that limit is stated rather
          # than glossed, because a check that quietly proves less than its name
          # claims is how this repository has been misled before.
          # ▶ A real schema assertion needs a token. That is the gap to close
          #   next, and it is named here so it is not forgotten.
          def registration_status_deployed():
              s, _ = fetch(f'{API}/api/v1/registration/status')
              return s in (401, 403), f'HTTP {s} (401/403 = deployed and gated)'
          check('API /registration/status is deployed and refuses anonymous',
                registration_status_deployed)

          # ── PUBLIC SURFACES ACTUALLY RETURN DATA ───────────────────────────
          def marketplace_has_parts():
              s, body = fetch(f'{API}/api/v1/public/parts?limit=1')
              if s != 200:
                  return False, f'HTTP {s}'
              try:
                  d = json.loads(body)
              except Exception:
                  return False, 'response was not JSON'
              total = d.get('total', len(d.get('parts', [])))
              # ⚠️ CONTENT, not structure. 24 live browser checks once passed
              # against a completely empty shop.
              return total > 0, f'{total} part(s) listed'
          check('public parts marketplace returns stock', marketplace_has_parts)

          # ── MY OWN CHANGE, VERIFIED ON LIVE ────────────────────────────────
          def robots_protects_private_areas():
              # 🔴 ADR-021: THE ARTIFACT ROOT, NOT THE CUSTOMER PACK. `robots.ts`
              # was hoisted to `app/` with the rest of the public surface, so it
              # is served at `/robots.txt`. Left as `{CUSTOMER}/robots.txt` this
              # SKIPPED with "not deployed yet" — which is how a real gap and a
              # moved file look identical, and a skip is not a pass.
              # Confirmed 200 at the apex before changing it.
              s, body = fetch(f'{APEX}/robots.txt')
              if s != 200:
                  return None, f'robots.txt returned {s} — not deployed yet'
              blocks_private = '/my-vehicles' in body and '/payments' in body
              allows_funnel = '/service-and-repairs/request-service' in body
              return blocks_private and allows_funnel, \
                  f'private blocked={blocks_private}, funnel allowed={allows_funnel}'
          check('customer robots.txt blocks private areas, allows the funnel',
                robots_protects_private_areas)

          # ── REPORT ─────────────────────────────────────────────────────────
          print()
          for name, detail in passed:
              print(f'PASS  {name} — {detail}')
          for name, detail in skipped:
              print(f'SKIP  {name} — {detail}')
          for name, detail in failed:
              print(f'FAIL  {name} — {detail}')

          print()
          print('=' * 62)
          print(f'  PASSED {len(passed)}   FAILED {len(failed)}   SKIPPED {len(skipped)}')
          print('=' * 62)

          # 🔴 A SUITE THAT RAN NOTHING IS A FAILURE, NOT A PASS. `pnpm e2e`
          # exited 0 for two days having collected zero tests. If the checks
          # ever stop being registered, this must go red rather than quietly
          # report a clean bill of health.
          #
          # ⚠️ THE FLOOR MUST TRACK THE SUITE, OR IT STOPS BEING A GUARD.
          # It was 10 when the suite had 16 checks, which caught "nothing ran"
          # and nothing else — a whole family of checks could stop registering
          # and still clear it comfortably. The 2026-08-08 change added five, so
          # this is raised to 24: still slack enough that removing one check
          # deliberately does not fail the run, tight enough that losing a block
          # does.
          #
          # 🔴 RAISE THIS WHEN YOU ADD CHECKS. A floor left behind decays into
          # the "green gate that runs nothing" this comment exists to prevent,
          # just more slowly.
          total = len(passed) + len(failed) + len(skipped)
          # 🔴 RAISED WITH THE SUITE, per the note above. 21 checks before
          # 2026-08-09 added four (supplier registration, leads, registrations,
          # registrations/mine) -> 25. A floor left behind decays into the
          # "green gate that runs nothing" it exists to prevent, just slowly.
          if total < 24:
              print(f'::error::the live suite registered only {total} checks — it is not running')
              sys.exit(1)

          if failed:
              print(f'::error::{len(failed)} live check(s) failed against the deployed site')
              sys.exit(1)
          if skipped:
              print(f'::warning::{len(skipped)} live check(s) could not run — read them, '
                    'a skip is not a pass')
          PY

  # ══════════════════════════════════════════════════════════════════════════
  # THE SIGNED-IN HALF.
  #
  # 🔴 EVERY CHECK IN THE JOB ABOVE IS ANONYMOUS, and that job's own comments
  # say what it therefore cannot prove: "a 401 says nothing whatever about the
  # schema. A real schema assertion needs a token. That is the gap to close
  # next." This is that job.
  #
  # ⚠️ A SEPARATE JOB, NOT MORE PYTHON CHECKS. Driving an authorization-code
  # login needs a browser; `urllib` cannot do it. Keycloak has NO client with
  # `directAccessGrantsEnabled` — all nine are false — and enabling a password
  # grant on the PRODUCTION realm to make a test cheaper is weakening the live
  # authentication surface for the tester's convenience. That is the owner's
  # decision, not a detail to slip into a workflow.
  #
  # ⚠️ `if: always()` — it runs even when the anonymous job failed, because
  # "the apex is slow" must not hide "the owner sees the wrong page". They are
  # independent questions and both counts are wanted.
  #
  # ⚠️ IT CANNOT TURN THE RUN RED FOR A MISSING SECRET. Without credentials
  # every test SKIPS and the summary says what went unproven. A gate that goes
  # red for an environmental reason is a gate people learn to ignore.
  # ══════════════════════════════════════════════════════════════════════════
  signed-in:
    runs-on: ubuntu-latest
    needs: live
    if: always()
    timeout-minutes: 25
    env:
      APEX_URL: ${{ inputs.apex || 'https://autoworkshop.aiappinvent.com' }}
      LIVE_OWNER_EMAIL: ${{ secrets.LIVE_OWNER_EMAIL }}
      LIVE_OWNER_PASSWORD: ${{ secrets.LIVE_OWNER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Say up front whether this job can prove anything
        run: |
          if [ -z "${LIVE_OWNER_EMAIL}" ] || [ -z "${LIVE_OWNER_PASSWORD}" ]; then
            echo "::warning::LIVE_OWNER_EMAIL / LIVE_OWNER_PASSWORD are not set. Every"\
                 "signed-in check will SKIP. What a real owner sees after signing in is"\
                 "NOT proven by this run. Set both repository secrets to close the gap."
          else
            echo "credentials present — the signed-in checks will run"
          fi

      # ⚠️ NO `version:` INPUT. `package.json` pins
      # `"packageManager": "pnpm@9.15.4"`, and supplying a version here as well
      # makes the action refuse outright — "Multiple versions of pnpm specified
      # ... ERR_PNPM_BAD_PM_VERSION" — which is how this job died on its first
      # real run. `ci.yml` passes no inputs for exactly this reason; copying the
      # shape from elsewhere instead of from the sibling workflow is what
      # introduced it.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoworkshop/e2e exec playwright install --with-deps chromium

      # 🔴 WARM KEYCLOAK BEFORE THE BROWSER TOUCHES IT. Cold start is ~127s
      # measured, and a login that times out on a cold realm reads as a broken
      # sign-in. This is a precondition, not a check.
      - name: Warm the realm and the apex
        run: |
          for url in "$APEX_URL" \
                     "https://autoworkshop-keycloak.onrender.com/realms/autoworkshop/.well-known/openid-configuration"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 240 "$url" || echo 000)"
            echo "warm  $url -> $code"
          done

      - name: Sign in as the owner and check what they actually see
        working-directory: apps/e2e
        # `|| true` so the report step below always runs and prints THREE
        # NUMBERS. The exit code is decided from the parsed counts, never from
        # Playwright's — this repository lost two days to a suite that exited 0
        # having collected zero tests.
        run: npx playwright test --config playwright.live.config.ts || true

      - name: PASSED / FAILED / SKIPPED
        working-directory: apps/e2e
        run: |
          python3 - <<'PY'
          import json, os, sys

          path = 'live-results.json'
          if not os.path.exists(path):
              print('::error::playwright wrote no report — the signed-in suite did not run at all')
              sys.exit(1)

          with open(path, encoding='utf-8') as fh:
              report = json.load(fh)

          passed = failed = skipped = 0
          lines = []

          def walk(suite):
              global passed, failed, skipped
              for spec in suite.get('specs', []):
                  for t in spec.get('tests', []):
                      # `status` is playwright's OUTCOME for the whole test:
                      # expected / unexpected / skipped / flaky.
                      status = t.get('status', 'unknown')
                      title = spec.get('title', '?')
                      if status == 'expected':
                          passed += 1
                          lines.append(f'PASS  {title}')
                      elif status == 'skipped':
                          skipped += 1
                          lines.append(f'SKIP  {title}')
                      else:
                          failed += 1
                          lines.append(f'FAIL  {title} ({status})')
              for child in suite.get('suites', []):
                  walk(child)

          for s in report.get('suites', []):
              walk(s)

          print()
          for line in lines:
              print(line)
          print()
          print('=' * 62)
          print(f'  SIGNED-IN   PASSED {passed}   FAILED {failed}   SKIPPED {skipped}')
          print('=' * 62)

          total = passed + failed + skipped
          # 🔴 A SUITE THAT REGISTERED NOTHING IS A FAILURE. Not a pass, and not
          # a skip — "zero tests" and "all tests skipped" look identical in every
          # summary that only counts failures.
          if total == 0:
              print('::error::the signed-in suite registered ZERO tests — it is not running')
              sys.exit(1)

          if failed:
              print(f'::error::{failed} signed-in check(s) failed against the deployed site')
              sys.exit(1)

          if skipped == total:
              print('::warning::every signed-in check SKIPPED — this run proves nothing '
                    'about what a signed-in owner sees. Set LIVE_OWNER_EMAIL and '
                    'LIVE_OWNER_PASSWORD.')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-signed-in-trace
          path: apps/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
