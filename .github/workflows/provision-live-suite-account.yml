# Provision the account the live suite signs in as — CLOSING GAP A1.
#
# ══════════════════════════════════════════════════════════════════════════
# 🔴 WHY THIS EXISTS, AND WHAT ITS ABSENCE COST.
#
# The live suite has two jobs. The anonymous one has been green all along; the
# SIGNED-IN one has reported `0 passed / 0 failed / 4 SKIPPED` every single run
# since it was written, because `LIVE_OWNER_EMAIL` / `LIVE_OWNER_PASSWORD` were
# never set. Four checks — does signing in land on the apex, does the dashboard
# render the workshop tree, does the lead pipeline render, does signing out end
# the session — have never once executed against production.
#
# On 2026-08-09 that gap hid a real defect for a day: both route guards asked
# "is this role foreign to the WORKSHOP" while rendering the supplier, customer,
# towing and fleet apps, so each refused the very role it exists for. Every
# anonymous check passed throughout, because an anonymous visitor has no role
# and `undefined` is foreign to nothing. The owner found it by clicking "Add
# Product" and getting a 404. A signed-in check would have found it first.
#
# ⚠️ THIS WRITES REAL PRODUCTION DATA: a Keycloak user, an `identity.users` row,
# a tenant, an organisation, a branch and a `workshop_owner` membership. That is
# not a side effect, it is the point — the suite must sign in as somebody who
# genuinely exists. It is a DEDICATED account, never the owner's own, so a test
# can never act as the real operator.
#
# ⚠️ THE PASSWORD IS NEVER AN INPUT AND IS NEVER PRINTED. Both values are read
# from the repository secrets the live suite already reads, so this workflow can
# only ever provision an account that matches what the suite will use — the two
# cannot drift. Set them first:
#
#     gh secret set LIVE_OWNER_EMAIL
#     gh secret set LIVE_OWNER_PASSWORD
#
# 🔴 `-f confirm=APPLY` OR THIS ONLY INSPECTS. Every writing step is gated.
#
# To undo: delete the Keycloak user, and the tenant it owns, by hand. There is
# deliberately no automatic teardown here — a workflow that can delete a live
# tenant is a workflow that can delete the wrong one.
# ══════════════════════════════════════════════════════════════════════════

name: Provision live-suite account

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to create the account. Anything else inspects only.'
        required: false
        default: ''
      kind:
        description: 'Which kind of account: workshop, supplier or fleet'
        required: false
        default: 'workshop'
        type: choice
        options: [workshop, supplier, fleet]
      display_name:
        description: 'Display name for the account'
        required: false
        default: 'Live Suite Owner'
      workshop_name:
        description: 'The workshop this account will own'
        required: false
        default: 'Live Suite Workshop'
      keycloak_url:
        description: 'Public Keycloak base URL'
        required: false
        default: 'https://autoworkshop-keycloak.onrender.com'

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KC_URL: ${{ inputs.keycloak_url }}
      KC_ADMIN_USER: admin
      KC_ADMIN_PASSWORD: ${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      DB_NAME: autoworkshop-postgres
      # 🔴 ALL THREE PAIRS ARE BOUND HERE AND ONE IS SELECTED BELOW. A secret
      # name cannot be built from an input at this level, and the alternative —
      # accepting the credentials as workflow INPUTS — would print the password
      # into the run log. Binding all three and choosing between them keeps the
      # values secret and the choice explicit.
      LIVE_OWNER_EMAIL: ${{ secrets.LIVE_OWNER_EMAIL }}
      LIVE_OWNER_PASSWORD: ${{ secrets.LIVE_OWNER_PASSWORD }}
      LIVE_SUPPLIER_EMAIL: ${{ secrets.LIVE_SUPPLIER_EMAIL }}
      LIVE_SUPPLIER_PASSWORD: ${{ secrets.LIVE_SUPPLIER_PASSWORD }}
      LIVE_FLEET_EMAIL: ${{ secrets.LIVE_FLEET_EMAIL }}
      LIVE_FLEET_PASSWORD: ${{ secrets.LIVE_FLEET_PASSWORD }}
      KIND: ${{ inputs.kind }}
      DISPLAY_NAME: ${{ inputs.display_name }}
      WORKSHOP_NAME: ${{ inputs.workshop_name }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse without the things this cannot run without
        run: |
          set -euo pipefail
          # 🔴 NAMED INDIVIDUALLY. "one of these is missing" sends somebody
          # hunting through four secrets; this says which.
          miss=""
          [ -n "${KC_ADMIN_PASSWORD:-}" ] || miss="${miss} KC_BOOTSTRAP_ADMIN_PASSWORD"
          [ -n "${RENDER_API_KEY:-}" ]    || miss="${miss} RENDER_API_KEY"

          # ⚠️ ONE ACCOUNT PER KIND, BECAUSE THE DATABASE ENFORCES ONE
          # ORGANISATION PER PERSON. `register_workshop`, `register_supplier` and
          # `register_fleet` each refuse an account that already belongs
          # somewhere, so a single test identity cannot walk through a supplier
          # AND a fleet. Three identities is not tidiness, it is the product's
          # own rule.
          case "$KIND" in
            workshop)
              ACCOUNT_EMAIL="${LIVE_OWNER_EMAIL:-}";    ACCOUNT_PASSWORD="${LIVE_OWNER_PASSWORD:-}"
              SECRET_PREFIX=LIVE_OWNER;  REGISTER_FN=identity.register_workshop
              ORG_NAME="${WORKSHOP_NAME}"; BRANCH_NAME='Main branch' ;;
            supplier)
              ACCOUNT_EMAIL="${LIVE_SUPPLIER_EMAIL:-}"; ACCOUNT_PASSWORD="${LIVE_SUPPLIER_PASSWORD:-}"
              SECRET_PREFIX=LIVE_SUPPLIER; REGISTER_FN=identity.register_supplier
              ORG_NAME='Live Suite Parts Supplier'; BRANCH_NAME='Main depot' ;;
            fleet)
              ACCOUNT_EMAIL="${LIVE_FLEET_EMAIL:-}";    ACCOUNT_PASSWORD="${LIVE_FLEET_PASSWORD:-}"
              SECRET_PREFIX=LIVE_FLEET; REGISTER_FN=identity.register_fleet
              ORG_NAME='Live Suite Fleet'; BRANCH_NAME='Main depot' ;;
            *) echo "::error::unknown kind '${KIND}' — expected workshop, supplier or fleet"; exit 1 ;;
          esac

          [ -n "$ACCOUNT_EMAIL" ]    || miss="${miss} ${SECRET_PREFIX}_EMAIL"
          [ -n "$ACCOUNT_PASSWORD" ] || miss="${miss} ${SECRET_PREFIX}_PASSWORD"
          [ -z "$miss" ] || {
            echo "::error::missing secret(s):${miss}. This workflow READS the credentials rather than inventing them, so the account it creates always matches what the suite signs in with. Set them with 'gh secret set'."
            exit 1; }

          # 🔴 MASKED BEFORE IT IS EXPORTED. It came from a secret and is masked
          # already, but it is about to be written to $GITHUB_ENV under a new
          # name — and a masked value only stays masked if the NEW name is
          # registered too.
          echo "::add-mask::$ACCOUNT_PASSWORD"
          {
            echo "ACCOUNT_EMAIL=$ACCOUNT_EMAIL"
            echo "ACCOUNT_PASSWORD=$ACCOUNT_PASSWORD"
            echo "REGISTER_FN=$REGISTER_FN"
            echo "ORG_NAME=$ORG_NAME"
            echo "BRANCH_NAME=$BRANCH_NAME"
          } >> "$GITHUB_ENV"

          echo "kind:      ${KIND}"
          echo "account:   ${ACCOUNT_EMAIL}"
          echo "will call: ${REGISTER_FN}('<subject>', '${ORG_NAME}', '${BRANCH_NAME}')"

      - name: Get a Keycloak admin token
        run: |
          set -euo pipefail
          # Split from the parse: piped together, a wrong password returns a
          # non-JSON body, `json.load` raises under pipefail, and the friendly
          # message below never prints.
          printf '%s' \
            "client_id=admin-cli&grant_type=password&username=${KC_ADMIN_USER}&password=${KC_ADMIN_PASSWORD}" \
            | curl -sS --max-time 150 -d @- \
                "${KC_URL}/realms/master/protocol/openid-connect/token" > /tmp/kc_token.json || true
          TOKEN="$(python3 -c "
          import json
          try:
              print(json.load(open('/tmp/kc_token.json')).get('access_token',''))
          except Exception:
              print('')
          ")"
          [ -n "$TOKEN" ] || {
            echo "::group::token response"; head -c 300 /tmp/kc_token.json; echo "::endgroup::"
            echo "::error::could not obtain a Keycloak admin token"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "KC_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "admin token acquired"

      - name: What exists already
        run: |
          set -euo pipefail
          curl -fsS --max-time 120 -H "Authorization: Bearer ${KC_TOKEN}" \
            --get --data-urlencode "email=${ACCOUNT_EMAIL}" --data-urlencode "exact=true" \
            "${KC_URL}/admin/realms/autoworkshop/users" > /tmp/existing.json
          python3 - <<'PY'
          import json
          rows = json.load(open('/tmp/existing.json'))
          if rows:
              u = rows[0]
              print('user already exists:', u['id'], 'enabled=', u.get('enabled'),
                    'emailVerified=', u.get('emailVerified'))
              print('this run will RESET its password and ensure the workshop, not create a second')
          else:
              print('no such user yet — this run would create one')
          PY

      - name: Inspect only
        if: ${{ inputs.confirm != 'APPLY' }}
        run: |
          cat <<INFO

          DRY RUN — nothing created.

          With confirm=APPLY this would:
            1. create (or update) the Keycloak user ${ACCOUNT_EMAIL},
               enabled, emailVerified, with the password from ${SECRET_PREFIX}_PASSWORD
               and NO required actions (a forced password change would break an
               automated sign-in on its first attempt)
            2. provision the matching identity.users row
            3. call ${REGISTER_FN} so the account owns a real organisation
            4. print what the live suite will now be able to prove

          It does NOT print the password and does NOT alter any other account.
          INFO

      - name: Create or update the Keycloak user
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          UID_EXISTING="$(python3 -c "
          import json
          rows = json.load(open('/tmp/existing.json'))
          print(rows[0]['id'] if rows else '')
          ")"

          if [ -z "$UID_EXISTING" ]; then
            # ⚠️ `emailVerified: true` AND NO REQUIRED ACTIONS, BOTH DELIBERATE.
            # This realm has had `verifyEmail` on with no SMTP server, which
            # BLOCKED sign-up entirely once. And a `UPDATE_PASSWORD` required
            # action would make the very first automated sign-in land on a
            # change-password form instead of the dashboard — the suite would
            # report a product failure for a realm setting.
            python3 - > /tmp/user.json <<PY
          import json, os
          print(json.dumps({
            "username": os.environ["ACCOUNT_EMAIL"],
            "email": os.environ["ACCOUNT_EMAIL"],
            "firstName": "Live", "lastName": "Suite",
            "enabled": True, "emailVerified": True,
            "requiredActions": [],
            "attributes": {"purpose": ["automated live-suite sign-in; not a real operator"]},
          }))
          PY
            curl -fsS -X POST -H "Authorization: Bearer ${KC_TOKEN}" \
              -H 'Content-Type: application/json' --data @/tmp/user.json \
              "${KC_URL}/admin/realms/autoworkshop/users" -D /tmp/h.txt -o /dev/null
            USER_ID="$(grep -i '^location:' /tmp/h.txt | tr -d '\r' | sed 's|.*/||')"
            echo "created user $USER_ID"
          else
            USER_ID="$UID_EXISTING"
            echo "reusing user $USER_ID"
          fi
          [ -n "$USER_ID" ] || { echo "::error::could not determine the user id"; exit 1; }

          # The password, set from the secret so it always matches the suite.
          # `temporary: false` — a temporary password forces a reset on first use.
          python3 - > /tmp/pw.json <<'PY'
          import json, os
          print(json.dumps({"type": "password",
                            "value": os.environ["ACCOUNT_PASSWORD"],
                            "temporary": False}))
          PY
          # 🔴 THE REALM HAS A PASSWORD POLICY AND IT REJECTS WITH A BARE 400.
          # Measured 2026-08-09: `length(12) and notUsername and notEmail and
          # upperCase(1) and lowerCase(1) and digits(1) and specialChars(1) and
          # passwordHistory(3)`. A 32-character ALPHANUMERIC password — strong by
          # any reasonable measure — was refused for want of one punctuation
          # mark, and `curl -f` reported only `error: 400` with no body. The
          # Keycloak user had already been created by then, so the run failed
          # halfway leaving an account nobody could sign into.
          #
          # Show the body and name the policy, or the next person reads a policy
          # rejection as a broken endpoint.
          # ⚠️ NO `-f`. `--fail` DISCARDS THE RESPONSE BODY on an HTTP error, so
          # `-o file` writes nothing and the diagnostic this block exists for is
          # empty — which is exactly what happened: "keycloak response" printed
          # `head: cannot open /tmp/pwerr.txt`. Read the status code instead and
          # keep the body.
          PW_CODE="$(curl -sS -X PUT -H "Authorization: Bearer ${KC_TOKEN}" \
                       -H 'Content-Type: application/json' --data @/tmp/pw.json \
                       -o /tmp/pwerr.txt -w '%{http_code}' \
                       "${KC_URL}/admin/realms/autoworkshop/users/${USER_ID}/reset-password" || echo 000)"
          case "$PW_CODE" in
            2*) echo "password set (HTTP ${PW_CODE})" ;;
            # 🔴 "MUST NOT BE EQUAL TO ANY OF LAST 3 PASSWORDS" IS THIS WORKFLOW
            # SUCCEEDING, NOT FAILING.
            #
            # The password comes from a fixed secret, so a re-run offers Keycloak
            # the value it already holds and `passwordHistory(3)` refuses it. That
            # is what happened here: a run set the password, failed later at the
            # database step, and every retry then died at this line — on an
            # account whose password was already correct.
            #
            # ⚠️ STRICTLY THIS SAYS "one of the last three", not "the current
            # one". The inference is safe because the secret has not changed
            # between runs, and it is not relied upon: the sign-in in the
            # walkthrough is what actually proves the credential works. Treating
            # it as fatal made a re-runnable workflow single-use.
            400)
              if grep -q 'invalidPasswordHistoryMessage' /tmp/pwerr.txt 2>/dev/null; then
                echo "password unchanged — Keycloak already holds this value (passwordHistory refused a no-op)"
              else
                echo "::group::keycloak response (HTTP ${PW_CODE})"
                head -c 600 /tmp/pwerr.txt || true; echo; echo "::endgroup::"
                echo "::error::Keycloak refused the password (HTTP ${PW_CODE}). The realm requires length>=12 with an upper case, a lower case, a digit and a SPECIAL character, and forbids the username or email inside it. The body above says which."
                rm -f /tmp/pw.json /tmp/pwerr.txt
                exit 1
              fi ;;
            *)
              echo "::group::keycloak response (HTTP ${PW_CODE})"
              head -c 600 /tmp/pwerr.txt || true; echo; echo "::endgroup::"
              echo "::error::Keycloak refused the password (HTTP ${PW_CODE}). The realm requires length>=12 with an upper case, a lower case, a digit and a SPECIAL character, forbids the username or email inside it, and forbids reusing the last 3. The body above says which."
              rm -f /tmp/pw.json /tmp/pwerr.txt
              exit 1 ;;
          esac
          rm -f /tmp/pw.json

          # 🔴 THE KEYCLOAK USER ID IS THE `sub` CLAIM, and therefore the
          # `keycloak_subject` every identity row is keyed on. Getting this wrong
          # produces an account that signs in perfectly and belongs to nothing.
          echo "USER_ID=${USER_ID}" >> "$GITHUB_ENV"
          echo "keycloak user ready"

      - name: Find the database and open the firewall for this runner
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          # 🔴 THE BODY IS KEPT, AND THE PARSE TOLERATES EVERY SHAPE RENDER
          # ACTUALLY RETURNS. Piped straight into python this died with
          # `TypeError: 'NoneType' object is not iterable` — a traceback that
          # names the language and not the problem. The API had answered 200 with
          # JSON `null`, which is neither an error curl would catch nor a list.
          # Keeping the body means the next failure shows what arrived.
          curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' \
            "https://api.render.com/v1/postgres?name=${DB_NAME}&limit=20" > /tmp/pg_list.json || true
          DB_ID="$(python3 -c "
          import json, os
          try:
              rows = json.load(open('/tmp/pg_list.json'))
          except Exception:
              rows = None
          # A list of {postgres:{...}}, a list of {...}, or a wrapper object —
          # all three have been seen from this API family.
          if isinstance(rows, dict):
              rows = rows.get('postgres') or rows.get('items') or []
          for r in (rows or []):
              d = r.get('postgres', r) if isinstance(r, dict) else {}
              if d.get('name') == os.environ['DB_NAME']:
                  print(d.get('id','')); break
          ")"
          [ -n "$DB_ID" ] || {
            echo "::group::what /v1/postgres returned"; head -c 500 /tmp/pg_list.json; echo "::endgroup::"
            echo "::error::could not find a Postgres named ${DB_NAME}. The body above is what the API actually answered."
            exit 1; }
          echo "database: ${DB_ID}"
          echo "$DB_ID" > /tmp/db_id

          curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' \
            "https://api.render.com/v1/postgres/${DB_ID}" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          # 🔴 \`or []\`, NOT \`get(..., [])\`. The default applies only when the KEY
          # IS ABSENT. Render returns the key present with a null value when the
          # allow-list is empty, so the default never fired and the next step
          # died with 'NoneType is not iterable' — a default that reads correct
          # and is inert, which is a failure this repository has recorded five
          # times in other forms.
          print(json.dumps(d.get('ipAllowList') or []))" \
            > /tmp/ip_allow_original.json

          RUNNER_IP="$(curl -fsS --max-time 30 https://api.ipify.org)"
          python3 - "$RUNNER_IP" > /tmp/allow.json <<'PY'
          import json, sys
          cur = json.load(open('/tmp/ip_allow_original.json')) or []
          cur = [e for e in cur if e.get('cidrBlock') != f'{sys.argv[1]}/32']
          cur.append({'cidrBlock': f'{sys.argv[1]}/32', 'description': 'live-suite account provisioning'})
          print(json.dumps({'ipAllowList': cur}))
          PY
          curl -fsS -X PATCH -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' --data @/tmp/allow.json \
            "https://api.render.com/v1/postgres/${DB_ID}" >/dev/null

          CONN="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' \
            "https://api.render.com/v1/postgres/${DB_ID}/connection-info" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['externalConnectionString'])")"
          echo "::add-mask::$CONN"
          printf '%s' "$CONN" > /tmp/dburl
          echo "firewall open, connection string captured"

      - name: Give the account an application user and a workshop
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          export DATABASE_URL="$(cat /tmp/dburl)"
          PSQL=/usr/lib/postgresql/*/bin/psql
          # shellcheck disable=SC2086
          set -- $PSQL
          PSQL="$1"

          # ⚠️ IDEMPOTENT ON PURPOSE. `provision_user_from_subject` returns the
          # existing row's id rather than inserting twice, and the membership
          # check below means a re-run of this workflow does not attempt a second
          # workshop for an account that already owns one — which the database
          # would refuse anyway, with a message about already belonging to an
          # organisation.
          # ⚠️ THE FUNCTION NAME IS INTERPOLATED BY THE SHELL, NOT BY psql. A
          # psql `:'var'` becomes a quoted STRING, which is right for the
          # arguments and impossible for the function being called. `REGISTER_FN`
          # comes from the fixed `case` above and can only ever be one of three
          # literals — it is never user input.
          "$PSQL" -v ON_ERROR_STOP=1 "$DATABASE_URL"             -v subject="${USER_ID}" -v email="${ACCOUNT_EMAIL}"             -v dname="${DISPLAY_NAME}" -v oname="${ORG_NAME}" -v bname="${BRANCH_NAME}" <<SQL
          \set QUIET on
          SELECT identity.provision_user_from_subject(:'subject', :'email', :'dname') AS app_user_id \gset
          \echo 'application user:' :app_user_id

          -- 🔴 SET IT, THEN READ IT. The verification block below asks for
          -- \`live.subject\`; without this line \`current_setting(..., true)\`
          -- returns NULL, the lookup matches nothing, and the check RAISES on a
          -- perfectly provisioned account — a guard that fails every time is as
          -- useless as one that passes every time, and harder to notice because
          -- it looks like diligence.
          SELECT set_config('live.subject', :'subject', false);

          -- 🔴 THROUGH `memberships_for_subject`, NEVER A DIRECT READ.
          -- `identity.memberships` is ENABLE + FORCE ROW LEVEL SECURITY, so this
          -- connection sees ZERO rows however many exist — and a count of 0 sent
          -- this straight into a registration the database then refused with
          -- "this account already belongs to an organisation". The guard was
          -- inert and the failure it caused looked like the guard working.
          --
          -- This repository has the same scar in migration form: "a migration's
          -- own orphan check was inert under FORCE RLS — 6 rows as owner, 0 as
          -- the Render role". `memberships_for_subject` is the SECURITY DEFINER
          -- function that exists precisely to answer this question without a
          -- tenant context; it is what the API itself calls.
          SELECT count(*) AS n
            FROM identity.memberships_for_subject(:'subject')
           WHERE status = 'active' \gset
          \echo 'existing active memberships:' :n

          \if :n
            \echo 'already belongs to an organisation — leaving it alone'
          \else
            -- 🔴 NO COLUMN NAMES, BECAUSE THE THREE FUNCTIONS DO NOT AGREE ON
            -- THEM. `register_supplier` (068) and `register_fleet` (075) return
            -- `o_tenant_id …`; `register_workshop` (036) predates that
            -- convention and returns `tenant_id …`. Naming either set makes this
            -- work for two kinds and fail on the third with `column
            -- "o_tenant_id" does not exist` — which is exactly what it did.
            --
            -- Counting rows calls the function without asserting its shape, and
            -- the DO block below proves the OUTCOME, which is the thing actually
            -- worth checking. A provisioning step should depend on what the
            -- function DOES, not on what it happens to call its columns.
            SELECT count(*) AS created FROM ${REGISTER_FN}(:'subject', :'oname', :'bname') \gset
            \echo 'registration rows returned:' :created
          \endif

          -- 🔴 PROVE IT, RATHER THAN TRUSTING THE CALLS ABOVE. A provisioning
          -- step that reports success without reading the result back is how
          -- this project has repeatedly shipped "applied" work that was not
          -- there. The walkthrough needs an ACTIVE membership; anything else and
          -- the signed-in checks fail for a reason that has nothing to do with
          -- the product.
          DO \$\$
          DECLARE v_role text; v_status text;
          BEGIN
            -- Same reason as the count above: a direct read of
            -- identity.memberships returns nothing under FORCE RLS, so this
            -- verification would have RAISED on a perfectly provisioned account.
            SELECT role_name, status INTO v_role, v_status
              FROM identity.memberships_for_subject(current_setting('live.subject', true))
             WHERE status = 'active'
             LIMIT 1;
            IF v_role IS NULL THEN
              RAISE EXCEPTION 'the account has no active membership — a walkthrough would sign in and see nothing';
            END IF;
            RAISE NOTICE 'verified: role=% status=%', v_role, v_status;
          END \$\$;
          SQL

      - name: Always restore the database firewall
        if: ${{ always() && inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          [ -f /tmp/db_id ] && [ -f /tmp/ip_allow_original.json ] || { echo "nothing to restore"; exit 0; }
          ID="$(cat /tmp/db_id)"
          python3 -c "
          import json
          json.dump({'ipAllowList': json.load(open('/tmp/ip_allow_original.json')) or []},
                    open('/tmp/restore.json','w'))"
          curl -fsS -X PATCH -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' --data @/tmp/restore.json \
            "https://api.render.com/v1/postgres/${ID}" >/dev/null
          echo "firewall restored"

      - name: Always remove the credentials from the runner
        if: always()
        run: rm -f /tmp/dburl /tmp/pw.json /tmp/kc_token.json || true

      - name: What the live suite can now prove
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          {
            echo "### Live-suite account provisioned"
            echo ""
            echo "- account: \`${ACCOUNT_EMAIL}\` (${KIND}; dedicated, not the owner's own)"
            echo "- owns: ${ORG_NAME}"
            echo ""
            echo "Run **Live suite**. The signed-in job has reported"
            echo "\`0 passed / 0 failed / 4 SKIPPED\` on every run since it was"
            echo "written; those four checks should now execute."
            echo ""
            echo "🔴 If they FAIL rather than skip, that is the point of them —"
            echo "the four guards that refused a role on its own app were"
            echo "invisible to every anonymous check for a day."
          } >> "$GITHUB_STEP_SUMMARY"
