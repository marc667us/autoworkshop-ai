# Build → TEST THE RUNNING CONTAINER → publish → promote to production.
#
# THIS WORKFLOW IS THE PRODUCTION GATE. `autoworkshop.aiappinvent.com` runs
# whatever image this publishes, and nothing else can put an image there, so
# every check below is load-bearing rather than decorative.
#
# The gate is deliberately NOT "did it compile". Twice now this repo has shipped
# changes that were green on typecheck, lint, 122 unit tests and a 10-target
# build and still broken the moment the app was started: `UntrustedHost` and a
# Keycloak provider with no `issuer` both made every `/api/auth/*` route return
# 500 while ordinary pages returned 200. A check that only loads a page cannot
# see that asymmetry. So this starts the real container and calls the real
# endpoints, including the auth ones, before anything is promoted.
#
# ZERO COST: GitHub Actions and GHCR are free for a public repository, and the
# Render service is on the free plan.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      promote:
        description: 'Deploy to production after the gate passes'
        required: false
        default: true
        type: boolean

concurrency:
  # A newer commit supersedes an in-flight release; two deploys racing to the
  # same service is how a service ends up serving neither commit.
  group: release-production
  cancel-in-progress: false

env:
  # Service ids are NOT here. `env` is not available to a reusable workflow's
  # `with:` block, so the deploy jobs read `vars.*` directly; a copy here would
  # be dead config that reads like the live wiring.
  IMAGE: ghcr.io/${{ github.repository_owner }}/autoworkshop-web

jobs:
  # ── Gate 1: the checks that do not need a running app ────────────────────────
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.2
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: unit tests
        run: pnpm test

  # ── Gate 2: build the image and PROVE IT SERVES ──────────────────────────────
  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.meta.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Before the build, not between build and push: the publish step below
      # reuses the buildx cache and would otherwise fail at the very end of a
      # long job for a reason that has nothing to do with the code.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          # Load into the local daemon so the smoke test runs the EXACT artifact
          # that would be published. Building once and testing a rebuild would
          # test something else.
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the running container
        run: |
          set -euo pipefail
          docker run -d --name aw \
            -p 3000:3000 \
            -e AUTH_SECRET=smoke-test-secret-not-used-in-production-000000 \
            -e AUTH_TRUST_HOST=true \
            -e KEYCLOAK_URL=http://localhost:8080 \
            -e KEYCLOAK_REALM=autoworkshop \
            -e API_BASE_URL=http://localhost:4000 \
            "${IMAGE}:${GITHUB_SHA}"

          # Wait for readiness rather than sleeping a guessed interval.
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://localhost:3000/; then
              echo "server up after ${i}s"; break
            fi
            if ! docker ps --filter name=aw --filter status=running -q | grep -q .; then
              echo "::error::container exited during startup"; docker logs aw; exit 1
            fi
            sleep 1
          done

          fail=0
          check() { # path, expected status, label
            code="$(curl -s -o /tmp/body -w '%{http_code}' "http://localhost:3000$1")"
            if [ "$code" != "$2" ]; then
              echo "::error::$3 — GET $1 returned $code, expected $2"
              head -c 400 /tmp/body; echo; fail=1
            else
              echo "ok   $1 → $code   ($3)"
            fi
          }

          # ADR-021 MOVED THE HEALTH CHECK, AND THIS STEP WOULD OTHERWISE HAVE
          # BLOCKED EVERY RELEASE. `/home/dashboard` was workshop-web's dashboard
          # when workshop-web WAS the artifact; it is `/workshop/home/dashboard`
          # now, so this check could no longer pass and Release would have failed
          # its own smoke test on a perfectly good image. `/` is what
          # `render.yaml` health-checks and is also the only route that renders
          # with neither the API nor Keycloak reachable — which is the situation
          # this container is in.
          check / 200 "the health check path Render will use"

          # 🔴 EVERY PACK IS CHECKED, because the whole point of the merge is
          # that one image carries all seven. A pack that failed to mount returns
          # 404 here, and nothing else in the pipeline would notice: the image
          # builds, the server starts, and six of seven work.
          for pack in customer workshop supplier fleet insurance towing admin; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000/${pack}")"
            case "$code" in
              200|307|308) echo "ok   /${pack} → ${code}" ;;
              *) echo "::error::/${pack} returned ${code} — that pack did not mount"; fail=1 ;;
            esac
          done
          # THE ASYMMETRY THAT TWICE ESCAPED EVERY OTHER GATE. These 500 while
          # pages return 200 when AUTH_TRUST_HOST or the provider issuer is
          # wrong, so they are checked explicitly and separately.
          check /api/auth/providers 200 "auth providers — 500 here means no issuer"
          check /api/auth/session    200 "auth session — 500 here means UntrustedHost"

          # The session document is served to the browser as JSON. A token in it
          # is a token in the page source.
          curl -fsS http://localhost:3000/api/auth/session > /tmp/session.json
          echo "session payload: $(cat /tmp/session.json)"
          if grep -qiE '"(accessToken|refreshToken|idToken|id_token)"' /tmp/session.json; then
            echo "::error::/api/auth/session exposes a token to the browser"; fail=1
          fi

          docker logs aw | tail -30
          exit $fail

      - name: Publish to GHCR
        id: meta
        # Only reached when the container demonstrably serves. Nothing untested
        # is ever published, which is what makes the promote step below safe.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
        env:
          DOCKER_BUILDKIT: '1'
        # Login must precede this; see the step ordering note below.

  # ── Gate 3: promote the tested image to production ───────────────────────────
  #
  # ⚠️ THE STAGING GATE WAS REMOVED ON 2026-07-28, AND THIS IS A REAL LOSS.
  #
  # Render suspended every AutoWorkshop web service with `suspenders: ['billing']`
  # — production and staging both 503, and the pipeline could not deploy to
  # either. Zero cost is a hard project rule, and several free web services on
  # one account consume the free instance-hour allowance between them, so the
  # owner chose to drop staging and let production carry it alone.
  #
  # WHAT THAT COSTS US, stated plainly rather than glossed: the `image` job
  # starts the real container and calls the real endpoints, but with test
  # environment variables, on the runner, with no proxy in front. Staging
  # exercised the same image on a real Render service, through Render's proxy,
  # with real per-service secrets. Those fail independently — which is precisely
  # why the gate existed. `AUTH_URL` pointing at the wrong host, a missing
  # per-service secret, or a proxy-header problem are all faults that staging
  # would have caught and this pipeline now cannot, until production is serving.
  #
  # WHAT STILL PROTECTS PRODUCTION:
  #   · nothing is published to GHCR unless the container demonstrably serves,
  #     including `/api/auth/providers` and `/api/auth/session` and a check that
  #     no token appears in the session document;
  #   · `_deploy-render.yml` verifies the deployed service actually serves after
  #     the deploy — which is after it is live, so it detects rather than
  #     prevents. That asymmetry is the gap.
  #
  # RESTORE THE GATE when the allowance permits: recreate a staging service with
  # `provision-web-service.yml`, set `vars.RENDER_STAGING_SERVICE_ID` to the NEW
  # id, and reinstate a `staging` job here with `promote` depending on it.
  promote:
    needs: image
    if: ${{ github.event_name == 'push' || inputs.promote }}
    uses: ./.github/workflows/_deploy-render.yml
    with:
      service_id: ${{ vars.RENDER_WEB_SERVICE_ID }}
      image: ghcr.io/${{ github.repository_owner }}/autoworkshop-web:${{ github.sha }}
      base_url: https://autoworkshop.aiappinvent.com
      environment: production
    secrets: inherit
