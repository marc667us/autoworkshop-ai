# Deploy Keycloak — step 3 of six toward a live sign-in.
#
# WHY AN IMAGE, NOT A REPO BUILD. Render's builder is deliberately out of the
# critical path here (ADR-017), exactly as it is for the web service: CI builds
# the image, pushes it to GHCR, and Render pulls a prebuilt one. That is not
# only consistency — the Keycloak image must contain `realm-prod.json`, which is
# GENERATED by `build-prod-realm.mjs` and git-ignored on purpose. A repo build
# would have nothing to copy, and committing the derived realm would create a
# second copy to keep in step, with the stale one being the one deployed.
#
# ⚠️ DRY RUN BY DEFAULT. It builds the realm, builds the image and reports
# exactly what it would create, without pushing, creating or altering anything.
#
# 🔴 WHAT THIS TOUCHES THAT IS NOT REVERSIBLE BY RE-RUNNING:
#   * `ALTER ROLE keycloak_app PASSWORD` — rotates the database credential.
#     Done in the same run as the Render env update so the two cannot disagree.
#   * FIRST BOOT imports the realm. Keycloak reads `data/import` only when the
#     realm is absent; later boots skip it. Realm changes after that are a
#     kcadm job, not a redeploy.
#   * `KC_BOOTSTRAP_ADMIN_PASSWORD` is honoured ONLY on that first boot. Once an
#     admin exists Keycloak ignores it, and the only readable copy of the value
#     is the file recorded in NEXT_SESSION_START_HERE.md.
#
# ⚠️ RENDER FREE IS 512 MiB AND KEYCLOAK IS A POOR FIT. SolarPro took seven OOM
# kills in five days on this plan, all at cold start. Every setting that made it
# survivable is baked into the Dockerfile from the first boot. If it OOMs here
# too the honest fix is more memory, which is a SPEND decision and the owner's.

name: Deploy Keycloak

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to actually push the image and create/update the service.'
        required: false
        default: ''
      service:
        description: 'Render service name'
        required: false
        default: 'autoworkshop-keycloak'
      database:
        description: 'Render Postgres service name'
        required: false
        default: 'autoworkshop-postgres'
      base_domain:
        description: 'Public base domain used to build production redirect URIs'
        required: false
        default: 'autoworkshop.aiappinvent.com'

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_NAME: ${{ inputs.service }}
      DB_NAME: ${{ inputs.database }}
      BASE_DOMAIN: ${{ inputs.base_domain }}
      CONFIRM: ${{ inputs.confirm }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/autoworkshop-keycloak
    steps:
      - uses: actions/checkout@v4

      - name: Refuse without the things this cannot run without
        run: |
          set -euo pipefail
          [ -n "${RENDER_API_KEY:-}" ] || { echo "::error::RENDER_API_KEY is not set"; exit 1; }
          if [ -z "${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}" ]; then
            echo "::error::KC_BOOTSTRAP_ADMIN_PASSWORD is not set on this repository."
            echo "::error::Keycloak reads it ONLY on a first boot; without it the admin"
            echo "::error::console would be unreachable and the instance would have to be recreated."
            exit 1
          fi

      # 🔴 THE REALM IS BUILT BEFORE THE IMAGE, AND THE BUILD CAN REFUSE.
      # It strips the nine localhost/exp:// redirect URIs the dev realm carries
      # and fails if one survives, if a client is left with none, if a redirect
      # is a wildcard, or if a user is baked in. A public client whose
      # allow-list still contains `localhost` accepts an authorization code at
      # the victim's own machine.
      - name: Build the production realm
        run: |
          set -euo pipefail
          node infrastructure/keycloak/render/build-prod-realm.mjs \
            infrastructure/keycloak/realm-autoworkshop.json \
            infrastructure/keycloak/render/realm-prod.json \
            "$BASE_DOMAIN"

          echo "::group::what production will import"
          python3 - <<'PY'
          import json
          r = json.load(open('infrastructure/keycloak/render/realm-prod.json'))
          print('realm:', r['realm'], '| clients:', len(r.get('clients') or []),
                '| users:', len(r.get('users') or []))
          for c in r.get('clients', []):
              if c.get('clientId', '').startswith('autoworkshop-'):
                  print(f"  {c['clientId']:32} {c.get('redirectUris')}")
          PY
          echo "::endgroup::"

      - name: Build the image
        run: |
          set -euo pipefail
          docker build \
            -f infrastructure/keycloak/render/Dockerfile \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            .
          echo "built ${IMAGE}:${GITHUB_SHA}"

      # A build that produced an image which cannot start is worth catching here
      # rather than after Render has replaced a working container. Keycloak
      # cannot fully boot without a database, so this asserts the distribution
      # is present and optimised — not a full start.
      - name: Prove the image is a real, optimised Keycloak
        run: |
          set -euo pipefail
          OUT="$(docker run --rm --entrypoint sh "${IMAGE}:${GITHUB_SHA}" -c \
            'ls /opt/keycloak/data/import/ && /opt/keycloak/bin/kc.sh --version')"
          echo "$OUT"
          echo "$OUT" | grep -q 'realm-prod.json' || {
            echo "::error::the realm was not baked into the image"; exit 1; }
          echo "$OUT" | grep -qi 'keycloak' || {
            echo "::error::kc.sh did not report a version"; exit 1; }

      - name: What this would do
        if: ${{ inputs.confirm != 'APPLY' }}
        run: |
          cat <<INFO

          DRY RUN — nothing pushed, created or altered.

          With confirm=APPLY this would:
            1. push ${IMAGE}:${GITHUB_SHA} to GHCR
            2. rotate keycloak_app's database password and set it on Render in
               the same run, so the two cannot disagree
            3. create (or update) the Render service '${SERVICE_NAME}' from that
               image, free plan, oregon, health check /realms/master
            4. poll until Render reports the deploy live
            5. read the realm's discovery document back over the public URL

          ⚠️ FIRST BOOT is the only boot that imports the realm, and the only one
             that honours KC_BOOTSTRAP_ADMIN_PASSWORD.
          INFO

      - name: Log in to GHCR
        if: ${{ inputs.confirm == 'APPLY' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Install a matching psql
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          PSQL=/usr/lib/postgresql/17/bin/psql
          test -x "$PSQL" || { echo "::error::$PSQL missing"; exit 1; }
          "$PSQL" --version | grep -q ' 17\.' || { echo "::error::wrong psql on PATH"; exit 1; }
          echo "PSQL_BIN=$PSQL" >> "$GITHUB_ENV"

      - name: Find the database and open the firewall for this runner
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          curl -sS -o /tmp/pg.json -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' "https://api.render.com/v1/postgres?limit=50"
          python3 - <<'PY'
          import json, os, sys
          rows = json.load(open('/tmp/pg.json'))
          want = os.environ['DB_NAME']
          for r in rows:
              d = r.get('postgres', r)
              if d.get('name') == want:
                  open('/tmp/db_id', 'w').write(d['id'])
                  break
          else:
              sys.exit(f"::error::no database named {want}")
          PY
          ID="$(cat /tmp/db_id)"

          curl -sS -o /tmp/conn.json -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' \
            "https://api.render.com/v1/postgres/${ID}/connection-info"
          python3 -c "
          import json
          i=json.load(open('/tmp/conn.json'))
          u=i.get('externalConnectionString') or i.get('internalConnectionString')
          if not u: raise SystemExit('::error::no connection string')
          open('/tmp/dburl','w').write(u)
          # The INTERNAL string is what Keycloak uses: it runs inside Render.
          open('/tmp/dburl_internal','w').write(i.get('internalConnectionString') or u)
          "
          chmod 600 /tmp/dburl /tmp/dburl_internal

          # 🔴 Render rejects an unlisted IP by DROPPING the connection, and psql
          # reports it as "SSL connection has been closed unexpectedly" — which
          # reads like TLS and is not. A single /32 for this runner, restored in
          # an `always()` step below so a failed run cannot leave it open.
          IP="$(curl -sS --max-time 20 https://api.ipify.org)"
          curl -sS -o /tmp/pg_one.json -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' "https://api.render.com/v1/postgres/${ID}"
          python3 - "$IP" <<'PY'
          import json, sys
          ip = sys.argv[1]
          d = json.load(open('/tmp/pg_one.json'))
          d = d.get('postgres', d)
          json.dump(d.get('ipAllowList') or [], open('/tmp/ip_allow_original.json', 'w'))
          json.dump({'ipAllowList': (d.get('ipAllowList') or []) +
                     [{'cidrBlock': f'{ip}/32', 'description': 'ephemeral: deploy-keycloak'}]},
                    open('/tmp/ip_allow_patch.json', 'w'))
          PY
          curl -fsS -X PATCH -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' --data @/tmp/ip_allow_patch.json \
            "https://api.render.com/v1/postgres/${ID}" >/dev/null
          sleep 20

      - name: Give keycloak_app a password
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          # Alphanumeric: this value crosses a JDBC URL, a Render env var and an
          # ALTER ROLE. Symbols would need correct quoting at every hop and one
          # of them would eventually be wrong.
          #
          # 🔴 NOT `tr -dc ... < /dev/urandom | head -c 40`. That is the obvious
          # spelling and it FAILED THIS STEP on the first real APPLY run:
          #
          #     tr: write error: Broken pipe
          #     ##[error]Process completed with exit code 1
          #
          # `head` closes the pipe after 40 bytes, `tr` takes SIGPIPE, and under
          # `set -euo pipefail` a non-zero anywhere in the pipeline fails the
          # step. The deploy died before the ALTER ROLE, so it was a clean no-op
          # rather than a half-configured service — but it could never have
          # succeeded, and no dry run could have caught it because the whole
          # step is `if: confirm == 'APPLY'`.
          #
          # `secrets.choice` has no pipe to break and is a CSPRNG. python3 is
          # already a dependency of this job.
          PW="$(python3 -c "
          import secrets, string
          print(''.join(secrets.choice(string.ascii_letters + string.digits) for _ in range(40)))
          ")"
          printf '%s' "$PW" > /tmp/kcpw
          chmod 600 /tmp/kcpw
          echo "::add-mask::$PW"

          # Migration 035 created the role NOLOGIN with no password. This is the
          # only place it gets one, and the Render env var is written in the same
          # run, so the database and the service cannot disagree.
          "${PSQL_BIN}" -v ON_ERROR_STOP=1 "$(cat /tmp/dburl)" \
            -c "ALTER ROLE keycloak_app LOGIN PASSWORD '${PW}'" >/dev/null
          echo "keycloak_app can now log in"

          # Read back as the role itself: an ALTER that succeeded is not proof
          # the credential works, and this is the one thing that would leave a
          # deployed Keycloak unable to reach its database.
          HOSTPART="$(python3 -c "
          import re,sys
          u=open('/tmp/dburl').read()
          m=re.match(r'postgres(?:ql)?://[^:]+:[^@]+@([^/]+)/(.+)', u)
          print(m.group(1), m.group(2))
          ")"
          HOST="$(echo "$HOSTPART" | cut -d' ' -f1)"
          DB="$(echo "$HOSTPART" | cut -d' ' -f2 | cut -d'?' -f1)"
          PGPASSWORD="$PW" "${PSQL_BIN}" -v ON_ERROR_STOP=1 \
            "postgresql://keycloak_app@${HOST}/${DB}?sslmode=require" \
            -tAc "select current_user, current_schema" \
            || { echo "::error::keycloak_app cannot log in with the password just set"; exit 1; }
          echo "verified by connecting AS keycloak_app"

      - name: Create or update the Render service
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          # 🔴 THE POSTGRES OBJECT DOES NOT RELIABLY CARRY `ownerId`. The first
          # real APPLY run died here with a bare `KeyError: 'ownerId'`, which
          # says nothing about which of the two API shapes was returned. Render
          # nests it as `owner.id` on some responses and omits it on others.
          #
          # So: try both shapes, then fall back to /v1/owners, and fail with a
          # message naming the keys actually present rather than a KeyError.
          # Only key NAMES are printed — never values, since this response
          # carries connection details.
          curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' \
            "https://api.render.com/v1/postgres/$(cat /tmp/db_id)" > /tmp/pg.json

          OWNER="$(python3 -c "
          import sys, json
          d = json.load(open('/tmp/pg.json'))
          d = d.get('postgres', d)
          print(d.get('ownerId') or (d.get('owner') or {}).get('id') or '')
          ")"

          if [ -z "$OWNER" ]; then
            echo "postgres object exposed no ownerId; keys were:"
            python3 -c "
          import json
          d = json.load(open('/tmp/pg.json'))
          d = d.get('postgres', d)
          print(' ', sorted(d.keys()))
          "
            echo "falling back to /v1/owners"
            OWNER="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Accept: application/json' \
              "https://api.render.com/v1/owners?limit=1" \
              | python3 -c "
          import sys, json
          rows = json.load(sys.stdin)
          o = rows[0].get('owner', rows[0]) if rows else {}
          print(o.get('id', ''))
          ")"
          fi

          [ -n "$OWNER" ] || { echo "::error::could not determine the Render ownerId"; exit 1; }
          echo "owner resolved: $OWNER"

          EXISTING="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' \
            "https://api.render.com/v1/services?name=${SERVICE_NAME}&limit=20" \
            | python3 -c "
          import sys, json, os
          rows = json.load(sys.stdin)
          for r in rows:
              s = r.get('service', r)
              if s.get('name') == os.environ['SERVICE_NAME']:
                  print(s['id']); break
          ")"

          PUBLIC_URL="https://${SERVICE_NAME}.onrender.com"
          # Keycloak needs the INTERNAL connection string: it runs inside Render.
          # `currentSchema=keycloak` keeps its tables inside the boundary
          # migration 035 drew.
          JDBC="$(python3 -c "
          import re
          u=open('/tmp/dburl_internal').read().strip()
          m=re.match(r'postgres(?:ql)?://[^:]+:[^@]+@([^/]+)/([^?]+)', u)
          print(f'jdbc:postgresql://{m.group(1)}/{m.group(2)}?currentSchema=keycloak')
          ")"
          echo "JDBC target: $(echo "$JDBC" | sed 's|//[^/]*/|//<host>/|')"

          python3 - > /tmp/envvars.json <<PY
          import json, os
          print(json.dumps([
            {"key": "KC_DB", "value": "postgres"},
            {"key": "KC_DB_URL", "value": "${JDBC}"},
            {"key": "KC_DB_USERNAME", "value": "keycloak_app"},
            {"key": "KC_DB_PASSWORD", "value": open('/tmp/kcpw').read()},
            {"key": "KC_BOOTSTRAP_ADMIN_USERNAME", "value": "admin"},
            {"key": "KC_BOOTSTRAP_ADMIN_PASSWORD",
             "value": "${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}"},
            # KC must advertise the address clients actually reach, because the
            # issuer in every token is built from it. A mismatch here is the
            # exact failure that made a local sign-in render "Sign out" and
            # "Not signed in" at the same time.
            {"key": "KC_HOSTNAME", "value": "${PUBLIC_URL}"},
            {"key": "KC_HOSTNAME_STRICT", "value": "false"},
            {"key": "KC_PROXY_HEADERS", "value": "xforwarded"},
            {"key": "KC_HTTP_ENABLED", "value": "true"},
            {"key": "KC_CACHE", "value": "local"},
            {"key": "KC_LOG_LEVEL", "value": "INFO"},
          ]))
          PY

          if [ -z "$EXISTING" ]; then
            echo "creating ${SERVICE_NAME}"
            python3 - > /tmp/service.json <<PY
          import json, os
          spec = {
            "type": "web_service",
            "name": os.environ['SERVICE_NAME'],
            "ownerId": "${OWNER}",
            "image": {"ownerId": "${OWNER}",
                      "imagePath": f"{os.environ['IMAGE']}:{os.environ['GITHUB_SHA']}"},
            "serviceDetails": {
              "env": "image", "runtime": "image",
              "plan": "free", "region": "oregon",
              # /realms/master exists the moment Keycloak is up, whereas the
              # autoworkshop realm only exists AFTER the first-boot import — a
              # health check on it would fail the very deploy that creates it.
              "healthCheckPath": "/realms/master",
            },
            "envVars": json.load(open('/tmp/envvars.json')),
          }
          print(json.dumps(spec))
          PY
            SVC="$(curl -fsS -X POST -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Content-Type: application/json' --data @/tmp/service.json \
              "https://api.render.com/v1/services" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('service',d)['id'])")"
          else
            echo "updating ${SERVICE_NAME} ($EXISTING)"
            SVC="$EXISTING"
            # ⚠️ A SINGLE PUT of the whole env-var set. Solar learned that a
            # partial or repeated env change triggers a redeploy each time, and
            # a boot that misses the health-check window leaves the service
            # stuck at `update_in_progress`, BLOCKING every later deploy.
            curl -fsS -X PUT -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Content-Type: application/json' --data @/tmp/envvars.json \
              "https://api.render.com/v1/services/${SVC}/env-vars" >/dev/null
            curl -fsS -X POST -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Content-Type: application/json' \
              --data "{\"imageUrl\":\"${IMAGE}:${GITHUB_SHA}\"}" \
              "https://api.render.com/v1/services/${SVC}/deploys" >/dev/null
          fi
          echo "$SVC" > /tmp/svc_id
          echo "service: $SVC"

      - name: Wait for the deploy, then read the realm back
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          SVC="$(cat /tmp/svc_id)"
          PUBLIC_URL="https://${SERVICE_NAME}.onrender.com"

          for i in $(seq 1 60); do
            STATUS="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Accept: application/json' \
              "https://api.render.com/v1/services/${SVC}/deploys?limit=1" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(d[0].get('deploy',d[0])['status'])")"
            echo "  deploy status: $STATUS"
            case "$STATUS" in
              live) break ;;
              build_failed|update_failed|canceled|deactivated)
                echo "::error::deploy ended as $STATUS"; exit 1 ;;
            esac
            sleep 20
          done

          # 🔴 THE CHECK THAT MATTERS. Render calls a deploy live when the health
          # path answers; that proves Keycloak started, NOT that the realm
          # imported. Reading the discovery document is what proves the realm
          # exists, and the issuer it returns is what every client validates
          # against — so a wrong KC_HOSTNAME shows up HERE rather than as a
          # mystery 401 later.
          for i in $(seq 1 20); do
            CODE="$(curl -s -o /tmp/disc.json -w '%{http_code}' --max-time 30 \
              "${PUBLIC_URL}/realms/autoworkshop/.well-known/openid-configuration")"
            [ "$CODE" = "200" ] && break
            echo "  realm discovery: $CODE (waiting)"
            sleep 15
          done
          [ "$CODE" = "200" ] || { echo "::error::the autoworkshop realm did not import"; exit 1; }

          python3 - <<PY
          import json
          d = json.load(open('/tmp/disc.json'))
          want = "${PUBLIC_URL}/realms/autoworkshop"
          print('issuer:', d['issuer'])
          if d['issuer'] != want:
              raise SystemExit(f"::error::issuer is {d['issuer']}, expected {want} — "
                               "every token would be rejected by the API")
          print('realm imported and advertising the right issuer')
          PY

          echo "KEYCLOAK_URL=${PUBLIC_URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Always restore the database firewall
        if: always()
        run: |
          set -euo pipefail
          [ -f /tmp/db_id ] && [ -f /tmp/ip_allow_original.json ] || { echo "nothing to restore"; exit 0; }
          ID="$(cat /tmp/db_id)"
          python3 -c "
          import json
          json.dump({'ipAllowList': json.load(open('/tmp/ip_allow_original.json'))},
                    open('/tmp/restore.json','w'))"
          curl -fsS -X PATCH -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' --data @/tmp/restore.json \
            "https://api.render.com/v1/postgres/${ID}" >/dev/null
          curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' \
            "https://api.render.com/v1/postgres/${ID}" -o /tmp/after.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/after.json'))
          d = d.get('postgres', d)
          left = [e for e in (d.get('ipAllowList') or [])
                  if 'deploy-keycloak' in (e.get('description') or '')]
          if left:
              sys.exit('::error::the ephemeral allow-list entry is STILL present')
          print('firewall restored — verified by reading it back')
          PY

      - name: Always remove the credentials
        if: always()
        run: rm -f /tmp/dburl /tmp/dburl_internal /tmp/conn.json /tmp/kcpw /tmp/ip_allow_*.json /tmp/envvars.json
