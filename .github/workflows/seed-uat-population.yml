# Seed the owner's UAT acceptance population, 2026-08-14.
#
# ══════════════════════════════════════════════════════════════════════════
# Owner: "10 users requesting for service, five technicians diagnoses and
# inspection reports, repair works and final testing reports, suppliers parts
# supply and inventory availability views to the technicians and user
# procurement records, payment made for repair work, 2 user firms register 20
# cars ... this uat use cases to be tested, maintain data for me to check"
#
# The SQL lives in `infrastructure/seed/uat_population.sql` so it can be run
# and proven against a local database first. It was, repeatedly: the database
# refused eleven separate mistakes before it passed, including a workshop
# trying to publish itself before verification, invoice lines added after the
# invoice was issued, and a stock quantity written as a column when stock is an
# append-only ledger. Every one of those refusals is the product working.
#
# 🔴 IT WRITES REAL PRODUCTION DATA AND IS MEANT TO STAY. Every organisation,
# customer, invoice, purchase order and vehicle carries `UAT-2026-08-14` in a
# name or reference, so the owner can tell UAT data from real at a glance.
#
# ⚠️ IDEMPOTENT BY MARKER, NOT BY UPSERT. The script checks for its own tenants
# and does nothing at all if they exist, and the whole thing is ONE
# transaction — so a failed run leaves nothing behind and a repeat run cannot
# double up. Measured both ways locally.
#
# ⚠️ `verify_only` RE-READS WITHOUT WRITING, for the reason recorded on
# `seed-sample-population.yml`: on 2026-08-10 a seeder's write and its read-back
# were gated on the same APPLY, so the only run that could print the result was
# the run that wrote it — and that run's query was broken.
# ══════════════════════════════════════════════════════════════════════════

name: Seed UAT population

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to write. Anything else reads and writes nothing.'
        required: false
        default: ''
      verify_only:
        description: 'true = read the counts back and write nothing at all'
        required: false
        default: 'false'

concurrency:
  group: seed-uat-population
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      DB_NAME: autoworkshop-postgres
      CONFIRM: ${{ inputs.confirm }}
      VERIFY_ONLY: ${{ inputs.verify_only }}
      TAG: 'UAT-2026-08-14'
    steps:
      - uses: actions/checkout@v4

      - name: Refuse without a key, and say what this run will do
        run: |
          set -euo pipefail
          [ -n "${RENDER_API_KEY:-}" ] || { echo "::error::RENDER_API_KEY is not set"; exit 1; }
          if [ "${VERIFY_ONLY}" = "true" ]; then
            echo "VERIFY ONLY — reads the counts back, writes nothing."
          elif [ "${CONFIRM}" = "APPLY" ]; then
            echo "APPLY — writes the UAT population tagged ${TAG}, if it is not already there."
          else
            echo "DRY RUN — reads the counts only. Nothing is written."
            echo "Re-run with confirm=APPLY to write."
          fi

      - name: Find the database and open the firewall for this runner
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' \
            "https://api.render.com/v1/postgres?name=${DB_NAME}&limit=20" > /tmp/pg_list.json || true
          DB_ID="$(python3 -c "
          import json, os
          try:
              rows = json.load(open('/tmp/pg_list.json'))
          except Exception:
              rows = None
          if isinstance(rows, dict):
              rows = rows.get('postgres') or rows.get('items') or []
          for r in (rows or []):
              d = r.get('postgres', r) if isinstance(r, dict) else {}
              if d.get('name') == os.environ['DB_NAME']:
                  print(d.get('id','')); break
          ")"
          [ -n "$DB_ID" ] || {
            echo "::group::what /v1/postgres returned"; head -c 500 /tmp/pg_list.json; echo "::endgroup::"
            echo "::error::could not find ${DB_NAME}"; exit 1; }
          echo "$DB_ID" > /tmp/db_id

          curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' \
            "https://api.render.com/v1/postgres/${DB_ID}" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          # `or []`: Render returns the key PRESENT and null when the list is
          # empty, so a dict default would never fire.
          print(json.dumps(d.get('ipAllowList') or []))" > /tmp/ip_allow_original.json

          RUNNER_IP="$(curl -fsS --max-time 30 https://api.ipify.org)"
          python3 - "$RUNNER_IP" > /tmp/allow.json <<'PY'
          import json, sys
          cur = json.load(open('/tmp/ip_allow_original.json')) or []
          cur = [e for e in cur if e.get('cidrBlock') != f'{sys.argv[1]}/32']
          cur.append({'cidrBlock': f'{sys.argv[1]}/32', 'description': 'uat seeding'})
          print(json.dumps({'ipAllowList': cur}))
          PY
          curl -fsS -X PATCH -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' --data @/tmp/allow.json \
            "https://api.render.com/v1/postgres/${DB_ID}" >/dev/null

          CONN="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' \
            "https://api.render.com/v1/postgres/${DB_ID}/connection-info" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['externalConnectionString'])")"
          echo "::add-mask::$CONN"
          printf '%s' "$CONN" > /tmp/dburl
          echo "firewall open"

      - name: Seed the UAT population
        if: ${{ inputs.verify_only != 'true' && inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          export DATABASE_URL="$(cat /tmp/dburl)"
          PSQL="$(ls /usr/lib/postgresql/*/bin/psql | head -1)"
          "$PSQL" -v ON_ERROR_STOP=1 "$DATABASE_URL" -f infrastructure/seed/uat_population.sql

      - name: Read the counts back — ALWAYS, whether or not this run wrote
        run: |
          set -euo pipefail
          export DATABASE_URL="$(cat /tmp/dburl)"
          PSQL="$(ls /usr/lib/postgresql/*/bin/psql | head -1)"
          # 🔴 UNGATED ON PURPOSE. A read-back gated on the same input as the
          # write can only ever run on the writing run, which is how a broken
          # verification query went unnoticed on 2026-08-10.
          "$PSQL" -v ON_ERROR_STOP=1 "$DATABASE_URL" -f infrastructure/seed/uat_verify.sql             | tee /tmp/uat_counts.txt

      - name: Put the counts in the run summary
        if: always()
        run: |
          {
            echo "## UAT population — ${TAG}"
            echo ""
            echo '```'
            cat /tmp/uat_counts.txt 2>/dev/null || echo "no counts were read"
            echo '```'
            echo ""
            echo "Sign in as the owner and look for \`${TAG}\` in:"
            echo "- Platform admin -> Organizations (workshop, supplier, 2 fleet firms)"
            echo "- The workshop -> Job cards, Invoices, Staff and roles"
            echo "- The marketplace -> the supplier's 8 published parts"
            echo ""
            echo "NOT covered, and it has no production path: the insurance sales"
            echo "pipeline and the marketing campaign. The crm module is leads only"
            echo "(GET + PATCH, no POST), there is no campaign entity, and the"
            echo "insurance pack has 0 of 28 screens."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Always restore the database firewall
        if: always()
        run: |
          set -euo pipefail
          [ -f /tmp/db_id ] && [ -f /tmp/ip_allow_original.json ] || { echo "nothing to restore"; exit 0; }
          ID="$(cat /tmp/db_id)"
          python3 -c "
          import json
          json.dump({'ipAllowList': json.load(open('/tmp/ip_allow_original.json')) or []},
                    open('/tmp/restore.json','w'))"
          curl -fsS -X PATCH -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' --data @/tmp/restore.json \
            "https://api.render.com/v1/postgres/${ID}" >/dev/null
          echo "firewall restored"

      - name: Always remove the credentials from the runner
        if: always()
        run: rm -f /tmp/dburl || true
