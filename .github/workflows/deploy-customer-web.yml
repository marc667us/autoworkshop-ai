# Deploy `customer-web` — THE PUBLIC LANDING PAGE.
#
# WHY THIS EXISTS. The free parts marketplace and the VIN search are the
# product's front door, and until today they were reachable by nobody: the apex
# serves `workshop-web`, and `customer-web` had never been containerised or
# deployed. `/marketplace` and `/parts` both answered 404 on the live site while
# the pages existed, complete, in the repository.
#
# ⚠️ THIS WORKFLOW DOES NOT MOVE THE CUSTOM DOMAIN, and that omission is
# deliberate. Moving `autoworkshop.aiappinvent.com` onto this service breaks the
# owner's current sign-in the instant DNS follows, because the Keycloak clients
# allow the apex for the WORKSHOP app. The move belongs in one operation that
# updates the realm's redirect URIs in the same run and reads them back —
# `provision-web-service.yml` already owns that dance for the workshop app.
# Getting the service live and verified first means the domain move is a small,
# reversible step rather than a leap.
#
# Modelled on `deploy-api.yml`, which is modelled on `deploy-keycloak.yml`.
# Everything it inherits was paid for by a real failure; see those files.

name: Deploy customer web

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to push the image and create/update the service.'
        required: false
        default: ''
      service:
        description: 'Render service name'
        required: false
        default: 'autoworkshop-customer'
      api_base_url:
        description: 'Where this app calls the API, server-side'
        required: false
        default: 'https://autoworkshop-api.onrender.com'
      keycloak_url:
        description: 'Public Keycloak base URL'
        required: false
        default: 'https://autoworkshop-keycloak.onrender.com'

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_NAME: ${{ inputs.service }}
      API_BASE_URL: ${{ inputs.api_base_url }}
      KC_URL: ${{ inputs.keycloak_url }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/autoworkshop-customer-web
    steps:
      - uses: actions/checkout@v4

      - name: Refuse without the things this cannot run without
        run: |
          set -euo pipefail
          [ -n "${RENDER_API_KEY:-}" ] || { echo "::error::RENDER_API_KEY is not set"; exit 1; }
          [ -f apps/customer-web/Dockerfile ] || { echo "::error::apps/customer-web/Dockerfile is missing"; exit 1; }
          # `output: 'standalone'` is what the Dockerfile copies. Without it the
          # image builds cleanly and the container dies at start with no build
          # error — the failure shape the API's start-up check exists to catch.
          grep -q "output: 'standalone'" apps/customer-web/next.config.mjs || {
            echo "::error::customer-web is not configured for standalone output"; exit 1; }

      # The landing page is mostly public, but its sign-in and its VIN detail
      # both depend on these two. Pointing a new front door at a dead API would
      # ship a marketplace whose every section reads "not reachable".
      - name: Prove the API and Keycloak are actually serving
        run: |
          set -euo pipefail
          # Long timeouts: Render's free tier spins down, and a cold start took
          # 24.6s for Keycloak on this account.
          for i in $(seq 1 6); do
            API_CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "${API_BASE_URL}/api/v1/health" || echo 000)"
            [ "$API_CODE" = "200" ] && break
            echo "  api health: $API_CODE (cold start? attempt $i)"
          done
          echo "api health -> $API_CODE"
          [ "$API_CODE" = "200" ] || { echo "::error::${API_BASE_URL} did not answer"; exit 1; }

          # The endpoint this landing page's headline feature depends on. A
          # deploy that works except for the one thing it was built for is worse
          # than one that fails loudly.
          VIN_CODE="$(curl -s -o /tmp/vin.json -w '%{http_code}' --max-time 60 \
            "${API_BASE_URL}/api/v1/public/vin/1HGCM82633A004352" || echo 000)"
          echo "public VIN lookup -> $VIN_CODE"
          [ "$VIN_CODE" = "200" ] || { echo "::error::the public VIN endpoint is not live on the API yet"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('/tmp/vin.json'))
          assert d.get('valid') is True, 'the API did not decode a known-good VIN'
          assert 'Honda' in (d.get('manufacturer') or ''), d
          # 🔴 THE GATE, ASSERTED AT DEPLOY TIME. If the public endpoint ever
          # starts returning the engine, the landing page leaks it the moment it
          # ships — and nobody would notice, because the page would simply look
          # more useful.
          for forbidden in ('detail', 'plantCode', 'serial'):
              assert forbidden not in d, f'the PUBLIC endpoint is leaking {forbidden}'
          print('public VIN answer is correct and correctly limited')
          "

          for i in $(seq 1 6); do
            KC_CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 \
              "${KC_URL}/realms/autoworkshop/.well-known/openid-configuration" || echo 000)"
            [ "$KC_CODE" = "200" ] && break
            echo "  keycloak: $KC_CODE (cold start? attempt $i)"
          done
          echo "keycloak -> $KC_CODE"
          [ "$KC_CODE" = "200" ] || { echo "::error::${KC_URL} did not answer"; exit 1; }

      - name: Build the image
        run: |
          set -euo pipefail
          docker build -f apps/customer-web/Dockerfile \
            -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          echo "built ${IMAGE}:${GITHUB_SHA}"

      # 🔴 PROVE IT STARTS AND SERVES, not merely that it built. `output:
      # standalone` missing, a mis-copied static directory, or a wrong CMD all
      # produce an image that builds perfectly and dies on Render as an
      # unexplained failed health check.
      - name: Prove the image starts and serves the landing page
        run: |
          set -euo pipefail
          docker run -d --name lp -p 3000:3000 \
            -e AUTH_SECRET=start-up-check-only \
            -e AUTH_TRUST_HOST=true \
            -e API_BASE_URL="${API_BASE_URL}" \
            -e KEYCLOAK_URL="${KC_URL}" \
            -e KEYCLOAK_REALM=autoworkshop \
            "${IMAGE}:${GITHUB_SHA}"
          for i in $(seq 1 30); do
            CODE="$(curl -s -o /tmp/landing.html -w '%{http_code}' --max-time 20 http://localhost:3000/ || echo 000)"
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          echo "container answered: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::group::container logs"; docker logs lp 2>&1 | tail -40; echo "::endgroup::"
            docker rm -f lp >/dev/null 2>&1 || true
            echo "::error::the image does not serve the landing page"
            exit 1
          fi
          # The feature this deploy exists for must be ON the page, not merely
          # compiled into the bundle.
          grep -q "Check any vehicle by VIN" /tmp/landing.html || {
            echo "::group::container logs"; docker logs lp 2>&1 | tail -40; echo "::endgroup::"
            docker rm -f lp >/dev/null 2>&1 || true
            echo "::error::the landing page rendered without the VIN search"
            exit 1; }
          echo "the landing page serves, and carries the VIN search"
          docker rm -f lp >/dev/null 2>&1 || true

      - name: What this would do
        if: ${{ inputs.confirm != 'APPLY' }}
        run: |
          cat <<INFO

          DRY RUN — nothing pushed, created or altered.

          With confirm=APPLY this would:
            1. push ${IMAGE}:${GITHUB_SHA} to GHCR
            2. create (or update) the Render service '${SERVICE_NAME}'
            3. poll until Render reports it live
            4. read the landing page back over its public URL

          It does NOT touch autoworkshop.aiappinvent.com. Moving the domain
          needs the Keycloak redirect URIs updated in the same operation, or
          live sign-in breaks the moment DNS follows.

          The image build and the container start-up check above are NOT gated,
          so this dry run has already proved the two things most likely to fail.
          INFO

      - name: Log in to GHCR
        if: ${{ inputs.confirm == 'APPLY' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Create or update the Render service
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          OWNER="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' "https://api.render.com/v1/owners?limit=1" \
            | python3 -c "
          import sys, json
          rows = json.load(sys.stdin)
          o = rows[0].get('owner', rows[0]) if rows else {}
          print(o.get('id',''))
          ")"
          [ -n "$OWNER" ] || { echo "::error::could not determine the Render ownerId"; exit 1; }

          EXISTING="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' \
            "https://api.render.com/v1/services?name=${SERVICE_NAME}&limit=20" \
            | python3 -c "
          import sys, json, os
          rows = json.load(sys.stdin)
          for r in rows:
              s = r.get('service', r)
              if s.get('name') == os.environ['SERVICE_NAME']:
                  print(s['id']); break
          ")"

          PUBLIC_URL="https://${SERVICE_NAME}.onrender.com"

          # AUTH_SECRET is generated here and written in the same run, so the
          # service and the value can never disagree. `secrets.choice`, never
          # `tr … | head`, which takes SIGPIPE under pipefail — the bug that
          # killed the first real Keycloak deploy.
          SECRET="$(python3 -c "
          import secrets, string
          print(''.join(secrets.choice(string.ascii_letters + string.digits) for _ in range(48)))
          ")"
          echo "::add-mask::$SECRET"

          python3 - > /tmp/envvars.json <<PY
          import json, os
          print(json.dumps([
            # AUTH_URL must be the host the BROWSER uses, or every sign-in
            # callback goes somewhere the session cannot come back from.
            {"key": "AUTH_URL", "value": "${PUBLIC_URL}"},
            {"key": "NEXT_PUBLIC_APP_URL", "value": "${PUBLIC_URL}"},
            # Auth.js v5 rejects an unrecognised Host and only auto-detects
            # Vercel; without this every /api/auth/* route 500s while ordinary
            # pages keep answering 200.
            {"key": "AUTH_TRUST_HOST", "value": "true"},
            {"key": "AUTH_SECRET", "value": "${SECRET}"},
            {"key": "API_BASE_URL", "value": "${API_BASE_URL}"},
            {"key": "KEYCLOAK_URL", "value": "${KC_URL}"},
            {"key": "KEYCLOAK_REALM", "value": "autoworkshop"},
            {"key": "NODE_ENV", "value": "production"},
          ]))
          PY

          if [ -z "$EXISTING" ]; then
            echo "creating ${SERVICE_NAME}"
            python3 - > /tmp/service.json <<PY
          import json, os
          print(json.dumps({
            "type": "web_service",
            "name": os.environ['SERVICE_NAME'],
            "ownerId": "${OWNER}",
            "image": {"ownerId": "${OWNER}",
                      "imagePath": f"{os.environ['IMAGE']}:{os.environ['GITHUB_SHA']}"},
            "serviceDetails": {
              "env": "image", "runtime": "image",
              "plan": "free", "region": "oregon",
              # The landing page itself. It is public and always renders, which
              # makes it a truthful health signal for this app.
              "healthCheckPath": "/",
            },
            "envVars": json.load(open('/tmp/envvars.json')),
          }))
          PY
            SVC="$(curl -fsS -X POST -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Content-Type: application/json' --data @/tmp/service.json \
              "https://api.render.com/v1/services" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('service',d)['id'])")"
          else
            echo "updating ${SERVICE_NAME} ($EXISTING)"
            SVC="$EXISTING"
            # ⚠️ MERGE, never a bare whole-set PUT. Render's env endpoint
            # replaces the entire set, and this service's AUTH_SECRET must
            # SURVIVE an update — regenerating it on every deploy would
            # invalidate every live session. Existing values win for that key.
            curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Accept: application/json' \
              "https://api.render.com/v1/services/${SVC}/env-vars?limit=100" > /tmp/cur.json
            python3 - <<'PY'
          import json
          rows = json.load(open('/tmp/cur.json'))
          cur = {}
          for r in rows:
              e = r.get('envVar', r)
              if 'key' in e:
                  cur[e['key']] = e.get('value', '')
          if not cur:
              raise SystemExit('::error::read back zero env vars — refusing to PUT a smaller set')
          want = {e['key']: e['value'] for e in json.load(open('/tmp/envvars.json'))}
          # An existing AUTH_SECRET is authoritative: replacing it signs every
          # current visitor out for no reason.
          if cur.get('AUTH_SECRET'):
              want['AUTH_SECRET'] = cur['AUTH_SECRET']
              print('kept the existing AUTH_SECRET')
          merged = dict(cur); merged.update(want)
          # ⚠️ A LENGTH COMPARISON HERE CANNOT FIRE: merged starts as a copy of
          # cur and update() only adds or overwrites, so it can never be
          # shorter. Compare key SETS, which is what "nothing was dropped"
          # actually means.
          dropped = set(cur) - set(merged)
          if dropped:
              raise SystemExit('::error::these keys would be dropped by the PUT: ' + ', '.join(sorted(dropped)))
          if len(merged) < len(cur):
              raise SystemExit('::error::merged set is smaller than the current set')
          json.dump([{'key': k, 'value': v} for k, v in sorted(merged.items())],
                    open('/tmp/merged.json', 'w'))
          print('merged env set size:', len(merged))
          PY
            curl -fsS -X PUT -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Content-Type: application/json' --data @/tmp/merged.json \
              "https://api.render.com/v1/services/${SVC}/env-vars" >/dev/null
            # 🔴 KEEP THE NEW DEPLOY'S ID. Sending this to /dev/null and then
            # polling `deploys?limit=1` races Render's own listing: for the few
            # seconds before the new deploy appears, "the latest deploy" is the
            # PREVIOUS one, which is already `live`. The poll breaks on its first
            # iteration and the read-back verifies the OLD build while reporting
            # the new one deployed.
            curl -fsS -X POST -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Content-Type: application/json' \
              --data "{\"imageUrl\":\"${IMAGE}:${GITHUB_SHA}\"}" \
              "https://api.render.com/v1/services/${SVC}/deploys" > /tmp/deploy.json
            python3 -c "
          import json
          d = json.load(open('/tmp/deploy.json'))
          print(d.get('deploy', d).get('id', ''))
          " > /tmp/deploy_id
            echo "triggered deploy: $(cat /tmp/deploy_id)"
          fi
          echo "$SVC" > /tmp/svc_id
          echo "service: $SVC"

      - name: Wait for the deploy, then read the landing page back
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          SVC="$(cat /tmp/svc_id)"
          PUBLIC_URL="https://${SERVICE_NAME}.onrender.com"

          # On the CREATE path there is no POST /deploys — creating the service
          # starts one — so the latest deploy IS ours. On the update path we
          # follow the id the POST returned.
          DEPLOY_ID=""
          [ -f /tmp/deploy_id ] && DEPLOY_ID="$(cat /tmp/deploy_id)"
          if [ -n "$DEPLOY_ID" ]; then
            DEPLOY_URL="https://api.render.com/v1/services/${SVC}/deploys/${DEPLOY_ID}"
            echo "following deploy ${DEPLOY_ID}"
          else
            DEPLOY_URL="https://api.render.com/v1/services/${SVC}/deploys?limit=1"
            echo "no deploy id (service was just created) — following the latest"
          fi

          # 🔴 A POLL THAT RUNS OUT OF PATIENCE MUST FAIL, NOT FALL THROUGH.
          #
          # Without `REACHED_LIVE` this loop simply ends after 20 minutes and the
          # step continues to the read-back below. The PREVIOUS image is still
          # serving, so the public URL answers 200, the landing-text grep passes,
          # and the run goes GREEN for a deploy still stuck in
          # `update_in_progress`. That is this repository's signature failure.
          REACHED_LIVE=0
          for i in $(seq 1 60); do
            STATUS="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Accept: application/json' "$DEPLOY_URL" \
              | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          # The list form returns [] for a few seconds after a service is
          # created; d[0] would be an IndexError after the service exists.
          if isinstance(d, list):
              d = d[0] if d else {}
          print(d.get('deploy', d).get('status', 'pending'))
          ")"
            echo "  deploy status: $STATUS"
            case "$STATUS" in
              live) REACHED_LIVE=1; break ;;
              build_failed|update_failed|canceled|deactivated)
                echo "::error::deploy ended as $STATUS"; exit 1 ;;
            esac
            sleep 20
          done
          # ⚠️ ONE LAST LOOK BEFORE CALLING IT FAILED. The loop sleeps 20s
          # after its 60th check and then gives up without asking again, so a
          # deploy that turns `live` during that final sleep would be reported
          # as a failure. Costs one GET; prevents a red run over a deploy that
          # actually succeeded.
          if [ "$REACHED_LIVE" != "1" ]; then
            STATUS="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Accept: application/json' "$DEPLOY_URL" \
              | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if isinstance(d, list):
              d = d[0] if d else {}
          print(d.get('deploy', d).get('status', 'pending'))
          ")"
            echo "  final check after the last sleep: $STATUS"
            if [ "$STATUS" = "live" ]; then REACHED_LIVE=1; fi
          fi
          [ "$REACHED_LIVE" = "1" ] || {
            echo "::error::the deploy never reached 'live' in 20 minutes (last status: ${STATUS}). The previous image may still be serving, so do NOT read a 200 from the public URL as success."
            exit 1; }

          # 🔴 READ IT BACK THE WAY A VISITOR WOULD. Render calling a deploy
          # "live" proves its health path answered from inside its own network.
          # Keycloak reported /health/ready UP for THIRTY HOURS with a dead
          # database on this very account.
          for i in $(seq 1 20); do
            CODE="$(curl -s -o /tmp/live.html -w '%{http_code}' --max-time 120 "${PUBLIC_URL}/" || echo 000)"
            [ "$CODE" = "200" ] && break
            echo "  landing: $CODE (waiting)"
            sleep 15
          done
          [ "$CODE" = "200" ] || { echo "::error::${PUBLIC_URL} did not answer"; exit 1; }

          grep -q "Check any vehicle by VIN" /tmp/live.html || {
            echo "::error::the live landing page has no VIN search"; exit 1; }
          echo "the live landing page serves, with the VIN search on it"

          {
            echo "### Landing page deployed"
            echo ""
            echo "- URL: ${PUBLIC_URL}"
            echo "- VIN search: present"
            echo ""
            echo "The custom domain was NOT moved. That step must update the"
            echo "Keycloak redirect URIs in the same run, or live sign-in breaks."
          } >> "$GITHUB_STEP_SUMMARY"
