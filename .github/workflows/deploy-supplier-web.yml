# Deploy `supplier-web` — WHERE A PARTS SUPPLIER RUNS ITS BUSINESS.
#
# ══════════════════════════════════════════════════════════════════════════
# Added 2026-08-09 so the landing page's "Register as parts supplier" button
# has somewhere to send people. Until now this app had never been deployed at
# all: `supplierRegisterHrefFrom` returns undefined when SUPPLIER_WEB_URL is
# unset, so the button correctly refused to render — a missing button rather
# than one that lands somebody signed-out on a host that does not exist.
#
# 🔴 THIS IS THE FIFTH RENDER SERVICE ON A SHARED FREE ALLOWANCE. Four services
# already share one pool of instance hours and it ran out once (2026-07-28),
# suspending the platform. The owner was told this before it was created and
# authorised it. If services start suspending, this is the newest consumer.
#
# ⚠️ MODELLED ON `deploy-customer-web.yml`, WHICH IS THE POINT. That workflow
# already carries the hard-won parts: confirm=APPLY on every mutating step, a
# container smoke test before Render ever sees the image, and the whole-set env
# PUT caveat. Copying its shape is deliberate; a hand-rolled deploy would have
# to relearn each of those.
#
# 🔴 `-f confirm=APPLY` OR THIS DOES NOTHING AND GOES GREEN. Every step that
# writes is gated on it. A run without it is an inspection.
# ══════════════════════════════════════════════════════════════════════════

name: Deploy supplier web

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to push the image and create/update the service.'
        required: false
        default: ''
      service:
        description: 'Render service name'
        required: false
        default: 'autoworkshop-supplier'
      api_base_url:
        description: 'Where this app calls the API, server-side'
        required: false
        default: 'https://autoworkshop-api.onrender.com'
      keycloak_url:
        description: 'Public Keycloak base URL'
        required: false
        default: 'https://autoworkshop-keycloak.onrender.com'

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_NAME: ${{ inputs.service }}
      API_BASE_URL: ${{ inputs.api_base_url }}
      KC_URL: ${{ inputs.keycloak_url }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/autoworkshop-supplier-web
    steps:
      - uses: actions/checkout@v4

      - name: Refuse without the things this cannot run without
        run: |
          set -euo pipefail
          [ -n "${RENDER_API_KEY:-}" ] || { echo "::error::RENDER_API_KEY is not set"; exit 1; }
          [ -f apps/supplier-web/Dockerfile ] || { echo "::error::apps/supplier-web/Dockerfile is missing"; exit 1; }
          # `output: 'standalone'` is what the Dockerfile copies. Without it the
          # image builds cleanly and the container dies at start with no build
          # error — the failure shape the API's start-up check exists to catch.
          grep -q "output: 'standalone'" apps/supplier-web/next.config.mjs || {
            echo "::error::supplier-web is not configured for standalone output"; exit 1; }

      # Every page in this app is behind a session, so a dead API or a dead
      # Keycloak means a supplier can sign in to nothing. Pointing the landing's
      # new "Register as parts supplier" button at that would be worse than
      # leaving the button hidden, which is what it does today.
      - name: Prove the API and Keycloak are actually serving
        run: |
          set -euo pipefail
          # Long timeouts: Render's free tier spins down, and a cold start took
          # 24.6s for Keycloak on this account.
          for i in $(seq 1 6); do
            API_CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "${API_BASE_URL}/api/v1/health" || echo 000)"
            [ "$API_CODE" = "200" ] && break
            echo "  api health: $API_CODE (cold start? attempt $i)"
          done
          echo "api health -> $API_CODE"
          [ "$API_CODE" = "200" ] || { echo "::error::${API_BASE_URL} did not answer"; exit 1; }

          # 🔴 THE ENDPOINT THIS APP EXISTS FOR. `CreateSupplierScreen` posts to
          # `/registration/supplier`, added by migration 068 on 2026-08-09. If
          # the API has not been redeployed since, that route 404s and a
          # supplier can register an account and then be unable to create their
          # business — a deploy that works except for the one thing it was built
          # for, which is worse than one that fails loudly.
          #
          # ⚠️ 401 IS THE PASS. The route is guarded; an anonymous POST must be
          # refused. 404 means the API predates the feature. 2xx would mean it
          # is deployed with no gate at all, which is its own emergency.
          REG_CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 120             -X POST -H 'Content-Type: application/json'             -d '{"supplierName":"deploy preflight"}'             "${API_BASE_URL}/api/v1/registration/supplier" || echo 000)"
          echo "POST /registration/supplier -> $REG_CODE"
          case "$REG_CODE" in
            400|401|403) echo "  deployed and gated" ;;
            404) echo "::error::the API does not serve /registration/supplier — deploy the API first (deploy-api.yml -f confirm=APPLY), or this app ships a sign-up that cannot complete"; exit 1 ;;
            *)   echo "::error::unexpected $REG_CODE from /registration/supplier"; exit 1 ;;
          esac

          for i in $(seq 1 6); do
            KC_CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 \
              "${KC_URL}/realms/autoworkshop/.well-known/openid-configuration" || echo 000)"
            [ "$KC_CODE" = "200" ] && break
            echo "  keycloak: $KC_CODE (cold start? attempt $i)"
          done
          echo "keycloak -> $KC_CODE"
          [ "$KC_CODE" = "200" ] || { echo "::error::${KC_URL} did not answer"; exit 1; }

      - name: Build the image
        run: |
          set -euo pipefail
          docker build -f apps/supplier-web/Dockerfile \
            -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          echo "built ${IMAGE}:${GITHUB_SHA}"

      # 🔴 PROVE IT STARTS AND SERVES, not merely that it built. `output:
      # standalone` missing, a mis-copied static directory, or a wrong CMD all
      # produce an image that builds perfectly and dies on Render as an
      # unexplained failed health check.
      - name: Prove the image starts and serves its dashboard
        run: |
          set -euo pipefail
          docker run -d --name lp -p 3000:3000             -e AUTH_SECRET=start-up-check-only             -e AUTH_TRUST_HOST=true             -e API_BASE_URL="${API_BASE_URL}"             -e KEYCLOAK_URL="${KC_URL}"             -e KEYCLOAK_REALM=autoworkshop             "${IMAGE}:${GITHUB_SHA}"

          # ⚠️ `/` REDIRECTS HERE, unlike customer-web whose `/` IS the page.
          # `apps/supplier-web/app/page.tsx` is `redirect('/home/dashboard')`
          # (§18: the dashboard is each workspace's one canonical landing), so
          # following redirects is what asks the real question.
          for i in $(seq 1 30); do
            CODE="$(curl -sL -o /tmp/landing.html -w '%{http_code}' --max-time 20 http://localhost:3000/ || echo 000)"
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          echo "container answered: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::group::container logs"; docker logs lp 2>&1 | tail -40; echo "::endgroup::"
            docker rm -f lp >/dev/null 2>&1 || true
            echo "::error::the image does not serve /home/dashboard"
            exit 1
          fi

          # 🔴 THE APP'S OWN SHELL MUST BE ON THE PAGE, not merely compiled into
          # the bundle. A 200 alone is satisfied by an error page, and this
          # repository has shipped a feature that could not render while every
          # gate reported success — the fix for which was to grep the served
          # HTML for the feature's own words. Same rule, applied before the
          # image ever reaches Render.
          #
          # ⚠️ ASSERTED ON THE SIGNED-OUT SHELL, because that is all this smoke
          # test can legitimately see: there is no session, so the dashboard
          # itself is not reachable and must not be. What must be true is that
          # an anonymous visitor gets a working app offering a way IN.
          if ! grep -qi "sign in" /tmp/landing.html; then
            echo "::group::served html"; head -c 2000 /tmp/landing.html; echo "::endgroup::"
            echo "::group::container logs"; docker logs lp 2>&1 | tail -40; echo "::endgroup::"
            docker rm -f lp >/dev/null 2>&1 || true
            echo "::error::the app served a page with no sign-in affordance — a supplier arriving from the landing would have no way in"
            exit 1
          fi
          echo "the supplier app serves, and offers a way to sign in"
          docker rm -f lp >/dev/null 2>&1 || true

      - name: What this would do
        if: ${{ inputs.confirm != 'APPLY' }}
        run: |
          cat <<INFO

          DRY RUN — nothing pushed, created or altered.

          With confirm=APPLY this would:
            1. push ${IMAGE}:${GITHUB_SHA} to GHCR
            2. create (or update) the Render service '${SERVICE_NAME}'
            3. poll until Render reports it live
            4. read the landing page back over its public URL

          It does NOT touch autoworkshop.aiappinvent.com. Moving the domain
          needs the Keycloak redirect URIs updated in the same operation, or
          live sign-in breaks the moment DNS follows.

          The image build and the container start-up check above are NOT gated,
          so this dry run has already proved the two things most likely to fail.
          INFO

      - name: Log in to GHCR
        if: ${{ inputs.confirm == 'APPLY' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Create or update the Render service
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          OWNER="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' "https://api.render.com/v1/owners?limit=1" \
            | python3 -c "
          import sys, json
          rows = json.load(sys.stdin)
          o = rows[0].get('owner', rows[0]) if rows else {}
          print(o.get('id',''))
          ")"
          [ -n "$OWNER" ] || { echo "::error::could not determine the Render ownerId"; exit 1; }

          EXISTING="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' \
            "https://api.render.com/v1/services?name=${SERVICE_NAME}&limit=20" \
            | python3 -c "
          import sys, json, os
          rows = json.load(sys.stdin)
          for r in rows:
              s = r.get('service', r)
              if s.get('name') == os.environ['SERVICE_NAME']:
                  print(s['id']); break
          ")"

          PUBLIC_URL="https://${SERVICE_NAME}.onrender.com"

          # AUTH_SECRET is generated here and written in the same run, so the
          # service and the value can never disagree. `secrets.choice`, never
          # `tr … | head`, which takes SIGPIPE under pipefail — the bug that
          # killed the first real Keycloak deploy.
          SECRET="$(python3 -c "
          import secrets, string
          print(''.join(secrets.choice(string.ascii_letters + string.digits) for _ in range(48)))
          ")"
          echo "::add-mask::$SECRET"

          python3 - > /tmp/envvars.json <<PY
          import json, os
          print(json.dumps([
            # AUTH_URL must be the host the BROWSER uses, or every sign-in
            # callback goes somewhere the session cannot come back from.
            {"key": "AUTH_URL", "value": "${PUBLIC_URL}"},
            {"key": "NEXT_PUBLIC_APP_URL", "value": "${PUBLIC_URL}"},
            # Auth.js v5 rejects an unrecognised Host and only auto-detects
            # Vercel; without this every /api/auth/* route 500s while ordinary
            # pages keep answering 200.
            {"key": "AUTH_TRUST_HOST", "value": "true"},
            {"key": "AUTH_SECRET", "value": "${SECRET}"},
            {"key": "API_BASE_URL", "value": "${API_BASE_URL}"},
            {"key": "KEYCLOAK_URL", "value": "${KC_URL}"},
            {"key": "KEYCLOAK_REALM", "value": "autoworkshop"},
            {"key": "NODE_ENV", "value": "production"},
          ]))
          PY

          if [ -z "$EXISTING" ]; then
            echo "creating ${SERVICE_NAME}"
            python3 - > /tmp/service.json <<PY
          import json, os
          print(json.dumps({
            "type": "web_service",
            "name": os.environ['SERVICE_NAME'],
            "ownerId": "${OWNER}",
            "image": {"ownerId": "${OWNER}",
                      "imagePath": f"{os.environ['IMAGE']}:{os.environ['GITHUB_SHA']}"},
            "serviceDetails": {
              "env": "image", "runtime": "image",
              "plan": "free", "region": "oregon",
              # The landing page itself. It is public and always renders, which
              # makes it a truthful health signal for this app.
              "healthCheckPath": "/",
            },
            "envVars": json.load(open('/tmp/envvars.json')),
          }))
          PY
            SVC="$(curl -fsS -X POST -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Content-Type: application/json' --data @/tmp/service.json \
              "https://api.render.com/v1/services" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('service',d)['id'])")"
          else
            echo "updating ${SERVICE_NAME} ($EXISTING)"
            SVC="$EXISTING"
            # ⚠️ MERGE, never a bare whole-set PUT. Render's env endpoint
            # replaces the entire set, and this service's AUTH_SECRET must
            # SURVIVE an update — regenerating it on every deploy would
            # invalidate every live session. Existing values win for that key.
            curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Accept: application/json' \
              "https://api.render.com/v1/services/${SVC}/env-vars?limit=100" > /tmp/cur.json
            python3 - <<'PY'
          import json
          rows = json.load(open('/tmp/cur.json'))
          cur = {}
          for r in rows:
              e = r.get('envVar', r)
              if 'key' in e:
                  cur[e['key']] = e.get('value', '')
          if not cur:
              raise SystemExit('::error::read back zero env vars — refusing to PUT a smaller set')
          want = {e['key']: e['value'] for e in json.load(open('/tmp/envvars.json'))}
          # An existing AUTH_SECRET is authoritative: replacing it signs every
          # current visitor out for no reason.
          if cur.get('AUTH_SECRET'):
              want['AUTH_SECRET'] = cur['AUTH_SECRET']
              print('kept the existing AUTH_SECRET')
          merged = dict(cur); merged.update(want)
          if len(merged) < len(cur):
              raise SystemExit('::error::merged set is smaller than the current set')
          json.dump([{'key': k, 'value': v} for k, v in sorted(merged.items())],
                    open('/tmp/merged.json', 'w'))
          print('merged env set size:', len(merged))
          PY
            curl -fsS -X PUT -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Content-Type: application/json' --data @/tmp/merged.json \
              "https://api.render.com/v1/services/${SVC}/env-vars" >/dev/null
            curl -fsS -X POST -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Content-Type: application/json' \
              --data "{\"imageUrl\":\"${IMAGE}:${GITHUB_SHA}\"}" \
              "https://api.render.com/v1/services/${SVC}/deploys" >/dev/null
          fi
          echo "$SVC" > /tmp/svc_id
          echo "service: $SVC"

      - name: Wait for the deploy, then read the landing page back
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          SVC="$(cat /tmp/svc_id)"
          PUBLIC_URL="https://${SERVICE_NAME}.onrender.com"

          for i in $(seq 1 60); do
            STATUS="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Accept: application/json' \
              "https://api.render.com/v1/services/${SVC}/deploys?limit=1" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(d[0].get('deploy',d[0])['status'])")"
            echo "  deploy status: $STATUS"
            case "$STATUS" in
              live) break ;;
              build_failed|update_failed|canceled|deactivated)
                echo "::error::deploy ended as $STATUS"; exit 1 ;;
            esac
            sleep 20
          done

          # 🔴 READ IT BACK THE WAY A VISITOR WOULD. Render calling a deploy
          # "live" proves its health path answered from inside its own network.
          # Keycloak reported /health/ready UP for THIRTY HOURS with a dead
          # database on this very account.
          # `-L`: `/` redirects to /home/dashboard here (§18).
          for i in $(seq 1 20); do
            CODE="$(curl -sL -o /tmp/live.html -w '%{http_code}' --max-time 120 "${PUBLIC_URL}/" || echo 000)"
            [ "$CODE" = "200" ] && break
            echo "  app: $CODE (waiting)"
            sleep 15
          done
          [ "$CODE" = "200" ] || { echo "::error::${PUBLIC_URL} did not answer"; exit 1; }

          # The same assertion the container smoke test makes, repeated against
          # the DEPLOYED origin — because they are different claims. The image
          # served this correctly on a runner; whether Render's copy does,
          # with Render's environment, is the question this step exists for.
          grep -qi "sign in" /tmp/live.html || {
            echo "::group::served html"; head -c 2000 /tmp/live.html; echo "::endgroup::"
            echo "::error::the live supplier app has no sign-in affordance — a supplier arriving from the landing has no way in"; exit 1; }
          echo "the live supplier app serves and offers a way to sign in"

          {
            echo "### Supplier app deployed"
            echo ""
            echo "- URL: ${PUBLIC_URL}"
            echo "- sign-in affordance: present"
            echo ""
            echo "🔴 TWO THINGS REMAIN, AND THE FUNNEL IS BROKEN WITHOUT BOTH:"
            echo "1. Set SUPPLIER_WEB_URL=${PUBLIC_URL} on the APEX service and"
            echo "   redeploy it, or the landing's \"Register as parts supplier\""
            echo "   button stays hidden — it renders only when that is set."
            echo "2. Add ${PUBLIC_URL}/* to the autoworkshop-supplier-web client's"
            echo "   redirect URIs in Keycloak, or sign-in fails at the callback."
          } >> "$GITHUB_STEP_SUMMARY"
