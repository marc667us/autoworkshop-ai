# Deploy `towing-web` — WHERE A RECOVERY OPERATOR RUNS ITS DAY.
#
# ══════════════════════════════════════════════════════════════════════════
# Added 2026-08-09 at the owner's request. The app shipped the day before with
# ten finished screens, seven tables under FORCE RLS and fourteen gated API
# routes — and NO DEPLOY PATH AT ALL. No workflow, no Render service. The API
# behind the screens went live and answered 401 on /api/v1/towing/*, which read
# as success on every gate, while not one of the ten screens was reachable by
# anybody. Built, reviewed, migrated, deployed-adjacent, and invisible.
#
# 🔴 THIS IS THE SIXTH RENDER SERVICE ON A SHARED FREE ALLOWANCE. Five services
# already share one pool of instance hours and it ran out once (2026-07-28),
# suspending the platform. The owner authorised this one explicitly. If services
# start suspending, this and supplier-web are the newest consumers.
#
# ⚠️ MODELLED ON `deploy-supplier-web.yml`, WHICH IS THE POINT. That workflow
# already carries the hard-won parts: confirm=APPLY on every mutating step, a
# container smoke test before Render ever sees the image, the env-var MERGE that
# keeps AUTH_SECRET alive across updates, and a read-back over the public URL.
# Copying its shape is deliberate; a hand-rolled deploy would relearn each one.
#
# 🔴 `-f confirm=APPLY` OR THIS DOES NOTHING AND GOES GREEN. Every step that
# writes is gated on it. A run without it is an inspection.
#
# 🔴 AND THE DEPLOY ALONE DOES NOT FINISH THE JOB. Keycloak must learn this
# origin or sign-in dies at the callback — `Sync Keycloak Client URIs` with
# confirm=APPLY, after this. The step summary says so again at the end.
# ══════════════════════════════════════════════════════════════════════════

name: Deploy towing web

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to push the image and create/update the service.'
        required: false
        default: ''
      service:
        description: 'Render service name'
        required: false
        default: 'autoworkshop-towing'
      api_base_url:
        description: 'Where this app calls the API, server-side'
        required: false
        default: 'https://autoworkshop-api.onrender.com'
      keycloak_url:
        description: 'Public Keycloak base URL'
        required: false
        default: 'https://autoworkshop-keycloak.onrender.com'

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_NAME: ${{ inputs.service }}
      API_BASE_URL: ${{ inputs.api_base_url }}
      KC_URL: ${{ inputs.keycloak_url }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/autoworkshop-towing-web
    steps:
      - uses: actions/checkout@v4

      - name: Refuse without the things this cannot run without
        run: |
          set -euo pipefail
          [ -n "${RENDER_API_KEY:-}" ] || { echo "::error::RENDER_API_KEY is not set"; exit 1; }
          [ -f apps/towing-web/Dockerfile ] || { echo "::error::apps/towing-web/Dockerfile is missing"; exit 1; }
          # `output: 'standalone'` is what the Dockerfile copies. Without it the
          # image builds cleanly and the container dies at start with no build
          # error — the failure shape the API's start-up check exists to catch.
          grep -q "output: 'standalone'" apps/towing-web/next.config.mjs || {
            echo "::error::towing-web is not configured for standalone output"; exit 1; }

      # Every screen in this app reads the towing API behind a session, so a dead
      # API or a dead Keycloak means an operator signs in to ten empty pages.
      - name: Prove the API and Keycloak are actually serving
        run: |
          set -euo pipefail

          # 🔴 `curl … || echo 000` PRODUCES `000000`, NOT `000`.
          #
          # On a transport failure curl BOTH prints `000` for %{http_code} AND
          # exits non-zero, so the `||` appends a second `000` and the capture is
          # six characters. Measured, not reasoned about:
          #
          #   CODE="$(curl -s -o /dev/null -w '%{http_code}' … || echo 000)"
          #   captured: [000000]   length: 6
          #
          # Every comparison against "000" is then FALSE. The retry below was
          # written for exactly this case and would have skipped it, and the
          # `case` would have fallen through to `*)` and failed the deploy on a
          # dropped connection — the opposite of what the retry is for. Codex
          # caught it on review; the reproduction above is what made it a fact.
          #
          # This helper reads curl's EXIT STATUS instead of concatenating onto
          # its output, so a transport failure is exactly `000`.
          probe() {
            local out
            if out="$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$1")"; then
              printf '%s' "$out"
            else
              printf '000'
            fi
          }

          # Long timeouts: Render's free tier spins down, and a cold start took
          # 24.6s for Keycloak on this account.
          #
          # ⚠️ AND A `sleep`, OR THE RETRY BUDGET IS ZERO SECONDS. `--max-time`
          # only buys waiting time while the connection is HELD OPEN. A spun-down
          # free service answers 502 instantly, so six attempts back-to-back burn
          # in under a second and the step declares a service dead that would
          # have been up thirty seconds later. Six attempts × 15s = 75s of real
          # patience, which is what a cold start actually needs.
          for i in $(seq 1 6); do
            API_CODE="$(probe "${API_BASE_URL}/api/v1/health")"
            [ "$API_CODE" = "200" ] && break
            echo "  api health: $API_CODE (cold start? attempt $i)"
            sleep 15
          done
          echo "api health -> $API_CODE"
          [ "$API_CODE" = "200" ] || { echo "::error::${API_BASE_URL} did not answer"; exit 1; }

          # 🔴 THE ROUTES THIS APP EXISTS FOR. `TowingModule` was added by
          # migration 074 and deployed on 2026-08-09. If the API has not been
          # redeployed since, these 404 and an operator gets ten screens that
          # each fail to load — a deploy that works except for the one thing it
          # was built for, which is worse than one that fails loudly.
          #
          # ⚠️ 401 IS THE PASS. Every towing route sits behind TenantGuard and
          # assertTowingStaff; an anonymous GET must be refused. 404 means the
          # API predates the feature. 2xx would mean it is serving a towing
          # operator's dispatch board to the public, which is its own emergency.
          #
          # ⚠️ AND THE PREFIX IS `api/v1`. A probe without it 404s on every route
          # in the whole API and reads exactly like "the feature is not
          # deployed" — that false alarm cost a diagnosis earlier today.
          for ROUTE in dashboard requests recoveries drivers vehicles incidents invoices settings; do
            # 🔴 RETRY. A transport failure is not an authorization fact: one of
            # these answered curl `000` once and 401 on three retries minutes
            # later. Treating that single 000 as a verdict would have failed a
            # deploy over a dropped connection.
            for attempt in 1 2 3; do
              CODE="$(probe "${API_BASE_URL}/api/v1/towing/${ROUTE}")"
              [ "$CODE" != "000" ] && break
              echo "  /towing/${ROUTE}: transport failure, retrying ($attempt)"
            done
            echo "GET /api/v1/towing/${ROUTE} -> $CODE"
            case "$CODE" in
              401|403) ;;
              404) echo "::error::the API does not serve /towing/${ROUTE} — deploy the API first (deploy-api.yml -f confirm=APPLY), or this app ships ten screens that cannot load"; exit 1 ;;
              *)   echo "::error::unexpected $CODE from /towing/${ROUTE}"; exit 1 ;;
            esac
          done
          echo "all eight towing route families are deployed and gated"

          # Same reasoning as the API loop: without the sleep this is six
          # instant 502s, and Keycloak is the SLOWEST service on this account
          # (measured 127s once — a 90s timeout is not proof it is dead).
          for i in $(seq 1 6); do
            KC_CODE="$(probe "${KC_URL}/realms/autoworkshop/.well-known/openid-configuration")"
            [ "$KC_CODE" = "200" ] && break
            echo "  keycloak: $KC_CODE (cold start? attempt $i)"
            sleep 15
          done
          echo "keycloak -> $KC_CODE"
          [ "$KC_CODE" = "200" ] || { echo "::error::${KC_URL} did not answer"; exit 1; }

      # 🔴 THE COMMITTED REALM MUST ALREADY CARRY THIS ORIGIN. `Sync Keycloak
      # Client URIs` is add-only and copies what the committed file declares into
      # the live realm — so if the file does not declare the deployed origin,
      # running the sync afterwards changes nothing and sign-in still dies at the
      # callback, with both workflows green. Checked here, before the image is
      # built, because the fix is a commit and not a re-run.
      - name: Prove the realm file declares the origin this deploy will create
        run: |
          set -euo pipefail
          PUBLIC_URL="https://${SERVICE_NAME}.onrender.com"
          python3 - "$PUBLIC_URL" <<'PY'
          import json, sys
          public = sys.argv[1]
          realm = json.load(open('infrastructure/keycloak/realm-autoworkshop.json'))
          client = next((c for c in realm['clients']
                         if c.get('clientId') == 'autoworkshop-towing-web'), None)
          if client is None:
              raise SystemExit('::error::no autoworkshop-towing-web client in the committed realm')
          if f'{public}/*' not in client.get('redirectUris', []):
              raise SystemExit(f'::error::{public}/* is not a redirect URI on autoworkshop-towing-web — sign-in would fail at the callback and the add-only sync could not fix it')
          if public not in client.get('webOrigins', []):
              raise SystemExit(f'::error::{public} is not a web origin on autoworkshop-towing-web')
          print(f'the committed realm declares {public} on autoworkshop-towing-web')
          PY

      # 🔴 THE LIVE REALM, NOT THE COMMITTED ONE. THIS IS A GATE, NOT ADVICE.
      #
      # Codex, reviewing this workflow before it ever ran: "the deploy can finish
      # green while sign-in is guaranteed to fail on the first deployment … it
      # relegates the required Keycloak sync to the step summary." Correct, and
      # the exact defect class this repository keeps paying for — a green run
      # whose remaining step is a sentence a human has to read and act on.
      #
      # `deploy-keycloak.yml` imports the realm file on FIRST BOOT ONLY, so a
      # committed redirect URI is invisible to the running Keycloak forever. An
      # app that answers 200 with no registered callback is not deployed, it is
      # a sign-in page that dies at `invalid_redirect_uri`.
      #
      # This step ASKS THE LIVE REALM and fails the run if the answer is no. It
      # does not write — `Sync Keycloak Client URIs` owns that, it is add-only
      # and separately reviewed, and duplicating its logic here would be a second
      # reconciler to keep in step with the first. Run the sync, then re-run this
      # deploy; it is idempotent and keeps the existing AUTH_SECRET.
      #
      # 🔴 BEFORE THE BUILD AND BEFORE ANY MUTATION, AND UNGATED. Placed after
      # the deploy — where it was first written — a first run would create the
      # SIXTH Render service on an allowance that has been exhausted once
      # already, and only then discover that sign-in cannot work. Ungated, a dry
      # run also answers the question, so nobody has to spend a service to learn
      # it. Nothing here depends on the deploy; it only reads Keycloak.
      - name: Prove the LIVE realm will accept this app's callback
        env:
          KC_ADMIN_USER: admin
          KC_ADMIN_PASSWORD: ${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          PUBLIC_URL="https://${SERVICE_NAME}.onrender.com"

          [ -n "${KC_ADMIN_PASSWORD:-}" ] || {
            echo "::error::KC_BOOTSTRAP_ADMIN_PASSWORD is not set — this step cannot tell whether sign-in works, and a step that cannot tell must not pass"; exit 1; }

          # -d @- so the password never appears in the process table.
          #
          # ⚠️ THE CURL AND THE PARSE ARE SPLIT ON PURPOSE. Piped together, a
          # wrong password returns a non-JSON error body, `json.load` raises,
          # and under `set -e -o pipefail` the step dies with a
          # JSONDecodeError traceback BEFORE the friendly message below can
          # print. A guard that the failure path skips over is not a guard.
          printf '%s' \
            "client_id=admin-cli&grant_type=password&username=${KC_ADMIN_USER}&password=${KC_ADMIN_PASSWORD}" \
            | curl -sS --max-time 120 -d @- \
                "${KC_URL}/realms/master/protocol/openid-connect/token" > /tmp/kc_token.json || true
          TOKEN="$(python3 -c "
          import json
          try:
              print(json.load(open('/tmp/kc_token.json')).get('access_token', ''))
          except Exception:
              print('')
          ")"
          [ -n "$TOKEN" ] || {
            echo "::group::keycloak token response"; head -c 400 /tmp/kc_token.json; echo "::endgroup::"
            echo "::error::could not obtain a Keycloak admin token — check KC_BOOTSTRAP_ADMIN_PASSWORD"; exit 1; }
          echo "::add-mask::$TOKEN"

          curl -fsS --max-time 120 -H "Authorization: Bearer ${TOKEN}" \
            "${KC_URL}/admin/realms/autoworkshop/clients?clientId=autoworkshop-towing-web" \
            > /tmp/live_client.json

          python3 - "$PUBLIC_URL" <<'PY'
          import json, sys
          public = sys.argv[1]
          rows = json.load(open('/tmp/live_client.json'))
          if not rows:
              raise SystemExit('::error::the LIVE realm has no autoworkshop-towing-web client at all')
          client = rows[0]
          redirects = client.get('redirectUris', [])
          origins = client.get('webOrigins', [])
          print('live redirectUris:', redirects)
          print('live webOrigins:  ', origins)
          missing = []
          if f'{public}/*' not in redirects:
              missing.append(f'redirectUri {public}/*')
          if public not in origins and '*' not in origins:
              missing.append(f'webOrigin {public}')
          if missing:
              raise SystemExit(
                  '::error::the LIVE Keycloak client is missing ' + ', '.join(missing) +
                  ' — the app is serving but every sign-in will die at the callback with '
                  'invalid_redirect_uri. Run "Sync Keycloak Client URIs" with confirm=APPLY '
                  '(it is add-only and the committed realm already declares these), then '
                  're-run this deploy.')
          print('the live realm accepts this app\'s callback')
          PY

          {
            echo "- live Keycloak callback: **registered** — sign-in can complete"
          } >> "$GITHUB_STEP_SUMMARY"



      - name: Build the image
        run: |
          set -euo pipefail
          docker build -f apps/towing-web/Dockerfile \
            -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          echo "built ${IMAGE}:${GITHUB_SHA}"

      # 🔴 PROVE IT STARTS AND SERVES, not merely that it built. `output:
      # standalone` missing, a mis-copied static directory, or a wrong CMD all
      # produce an image that builds perfectly and dies on Render as an
      # unexplained failed health check.
      - name: Prove the image starts and serves its dashboard
        run: |
          set -euo pipefail
          docker run -d --name tw -p 3000:3000 \
            -e AUTH_SECRET=start-up-check-only \
            -e AUTH_TRUST_HOST=true \
            -e API_BASE_URL="${API_BASE_URL}" \
            -e KEYCLOAK_URL="${KC_URL}" \
            -e KEYCLOAK_REALM=autoworkshop \
            "${IMAGE}:${GITHUB_SHA}"

          # ⚠️ `/` REDIRECTS HERE. `apps/towing-web/app/page.tsx` is
          # `redirect('/operations/dashboard')` (§18: the dashboard is each
          # workspace's one canonical landing), so following redirects with -L is
          # what asks the real question.
          # Same `000000` trap as the API probe above: read curl's exit status,
          # never concatenate onto its output. Here it only has to not equal
          # "200", so the old idiom was failure-safe — but a log line reading
          # `container answered: 000000` is a puzzle nobody should have to solve
          # at 2am.
          for i in $(seq 1 30); do
            if ! CODE="$(curl -sL -o /tmp/landing.html -w '%{http_code}' --max-time 20 http://localhost:3000/)"; then
              CODE=000
            fi
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          echo "container answered: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::group::container logs"; docker logs tw 2>&1 | tail -40; echo "::endgroup::"
            docker rm -f tw >/dev/null 2>&1 || true
            echo "::error::the image does not serve /operations/dashboard"
            exit 1
          fi

          # 🔴 THE APP'S OWN SHELL MUST BE ON THE PAGE, not merely compiled into
          # the bundle. A 200 alone is satisfied by an error page, and this
          # repository has shipped a feature that could not render while every
          # gate reported success — the fix for which was to grep the served
          # HTML for the feature's own words. Same rule, before Render sees it.
          #
          # ⚠️ ASSERTED ON THE SIGNED-OUT SHELL, because that is all this smoke
          # test can legitimately see: there is no session, so the dispatch board
          # itself is not reachable and must not be. What must be true is that an
          # anonymous visitor gets a working app offering a way IN.
          if ! grep -qi "sign in" /tmp/landing.html; then
            echo "::group::served html"; head -c 2000 /tmp/landing.html; echo "::endgroup::"
            echo "::group::container logs"; docker logs tw 2>&1 | tail -40; echo "::endgroup::"
            docker rm -f tw >/dev/null 2>&1 || true
            echo "::error::the app served a page with no sign-in affordance — a towing operator would have no way in"
            exit 1
          fi
          echo "the towing app serves, and offers a way to sign in"
          docker rm -f tw >/dev/null 2>&1 || true

      - name: What this would do
        if: ${{ inputs.confirm != 'APPLY' }}
        run: |
          cat <<INFO

          DRY RUN — nothing pushed, created or altered.

          With confirm=APPLY this would:
            1. push ${IMAGE}:${GITHUB_SHA} to GHCR
            2. create (or update) the Render service '${SERVICE_NAME}'
            3. poll until Render reports it live
            4. read the dashboard back over its public URL

          It does NOT touch autoworkshop.aiappinvent.com, and it does NOT write
          to Keycloak. Sign-in needs 'Sync Keycloak Client URIs' with
          confirm=APPLY afterwards.

          The image build and the container start-up check above are NOT gated,
          so this dry run has already proved the two things most likely to fail.
          INFO

      - name: Log in to GHCR
        if: ${{ inputs.confirm == 'APPLY' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Create or update the Render service
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          OWNER="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' "https://api.render.com/v1/owners?limit=1" \
            | python3 -c "
          import sys, json
          rows = json.load(sys.stdin)
          o = rows[0].get('owner', rows[0]) if rows else {}
          print(o.get('id',''))
          ")"
          [ -n "$OWNER" ] || { echo "::error::could not determine the Render ownerId"; exit 1; }

          EXISTING="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' \
            "https://api.render.com/v1/services?name=${SERVICE_NAME}&limit=20" \
            | python3 -c "
          import sys, json, os
          rows = json.load(sys.stdin)
          for r in rows:
              s = r.get('service', r)
              if s.get('name') == os.environ['SERVICE_NAME']:
                  print(s['id']); break
          ")"

          PUBLIC_URL="https://${SERVICE_NAME}.onrender.com"

          # AUTH_SECRET is generated here and written in the same run, so the
          # service and the value can never disagree. `secrets.choice`, never
          # `tr … | head`, which takes SIGPIPE under pipefail — the bug that
          # killed the first real Keycloak deploy.
          SECRET="$(python3 -c "
          import secrets, string
          print(''.join(secrets.choice(string.ascii_letters + string.digits) for _ in range(48)))
          ")"
          echo "::add-mask::$SECRET"

          python3 - > /tmp/envvars.json <<PY
          import json, os
          print(json.dumps([
            # AUTH_URL must be the host the BROWSER uses, or every sign-in
            # callback goes somewhere the session cannot come back from.
            {"key": "AUTH_URL", "value": "${PUBLIC_URL}"},
            # NO NEXT_PUBLIC_APP_URL HERE, DELIBERATELY. supplier-web sets it,
            # and any NEXT_PUBLIC_ name is a BUILD-TIME INLINE - a value set as
            # a Render runtime variable is never substituted into the client
            # bundle. Nothing in apps/towing-web reads it today, so setting it
            # would be inert while reading as configured, and the day a client
            # component started using it the value would be empty. If this app
            # ever needs it, it is a Dockerfile build arg, not an env var.
            #
            # (No backticks in this heredoc: it is unquoted so shell expansion
            # is live, and a backticked word would be EXECUTED as a command.)
            # Auth.js v5 rejects an unrecognised Host and only auto-detects
            # Vercel; without this every /api/auth/* route 500s while ordinary
            # pages keep answering 200.
            {"key": "AUTH_TRUST_HOST", "value": "true"},
            {"key": "AUTH_SECRET", "value": "${SECRET}"},
            {"key": "API_BASE_URL", "value": "${API_BASE_URL}"},
            {"key": "KEYCLOAK_URL", "value": "${KC_URL}"},
            {"key": "KEYCLOAK_REALM", "value": "autoworkshop"},
            {"key": "NODE_ENV", "value": "production"},
          ]))
          PY

          if [ -z "$EXISTING" ]; then
            echo "creating ${SERVICE_NAME}"
            python3 - > /tmp/service.json <<PY
          import json, os
          print(json.dumps({
            "type": "web_service",
            "name": os.environ['SERVICE_NAME'],
            "ownerId": "${OWNER}",
            "image": {"ownerId": "${OWNER}",
                      "imagePath": f"{os.environ['IMAGE']}:{os.environ['GITHUB_SHA']}"},
            "serviceDetails": {
              "env": "image", "runtime": "image",
              "plan": "free", "region": "oregon",
              # The dashboard itself, NOT the root.
              #
              # Root is a redirect here (app/page.tsx redirects to this path),
              # and supplier-web proves Render tolerates that — it runs
              # healthCheckPath "/" today, serves 307 on it, and is live. So
              # this is not a fix for a broken health check; it points the check
              # at the page whose rendering is the thing worth knowing about.
              # It renders signed-out, so it is public and always answers.
              "healthCheckPath": "/operations/dashboard",
            },
            "envVars": json.load(open('/tmp/envvars.json')),
          }))
          PY
            SVC="$(curl -fsS -X POST -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Content-Type: application/json' --data @/tmp/service.json \
              "https://api.render.com/v1/services" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('service',d)['id'])")"
          else
            echo "updating ${SERVICE_NAME} ($EXISTING)"
            SVC="$EXISTING"
            # ⚠️ MERGE, never a bare whole-set PUT. Render's env endpoint
            # replaces the entire set, and this service's AUTH_SECRET must
            # SURVIVE an update — regenerating it on every deploy would
            # invalidate every live session. Existing values win for that key.
            curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Accept: application/json' \
              "https://api.render.com/v1/services/${SVC}/env-vars?limit=100" > /tmp/cur.json
            python3 - <<'PY'
          import json
          rows = json.load(open('/tmp/cur.json'))
          cur = {}
          for r in rows:
              e = r.get('envVar', r)
              if 'key' in e:
                  cur[e['key']] = e.get('value', '')
          if not cur:
              raise SystemExit('::error::read back zero env vars — refusing to PUT a smaller set')
          want = {e['key']: e['value'] for e in json.load(open('/tmp/envvars.json'))}
          # An existing AUTH_SECRET is authoritative: replacing it signs every
          # current visitor out for no reason.
          if cur.get('AUTH_SECRET'):
              want['AUTH_SECRET'] = cur['AUTH_SECRET']
              print('kept the existing AUTH_SECRET')
          merged = dict(cur); merged.update(want)
          # ⚠️ COMPARE KEY SETS, NOT LENGTHS. supplier-web asserts
          # `len(merged) < len(cur)`, which CANNOT FIRE: merged starts as a copy
          # of cur and update() only adds or overwrites, so it can never be
          # shorter. That guard reads as protection against the whole-set-PUT
          # shrink its own comment warns about and asserts nothing at all.
          dropped = set(cur) - set(merged)
          if dropped:
              raise SystemExit('::error::these keys would be dropped by the PUT: ' + ', '.join(sorted(dropped)))
          json.dump([{'key': k, 'value': v} for k, v in sorted(merged.items())],
                    open('/tmp/merged.json', 'w'))
          print('merged env set size:', len(merged))
          PY
            curl -fsS -X PUT -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Content-Type: application/json' --data @/tmp/merged.json \
              "https://api.render.com/v1/services/${SVC}/env-vars" >/dev/null
            # 🔴 KEEP THE NEW DEPLOY'S ID. Sending this response to /dev/null and
            # then polling `deploys?limit=1` is a race with Render's own listing:
            # for the few seconds before the new deploy appears, "the latest
            # deploy" is the PREVIOUS one, which is already `live`. The poll
            # would break on the first iteration and the read-back would verify
            # the OLD build while reporting the new one deployed. Polling the id
            # this POST returns asks about the deploy we actually triggered.
            curl -fsS -X POST -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Content-Type: application/json' \
              --data "{\"imageUrl\":\"${IMAGE}:${GITHUB_SHA}\"}" \
              "https://api.render.com/v1/services/${SVC}/deploys" > /tmp/deploy.json
            python3 -c "
          import json
          d = json.load(open('/tmp/deploy.json'))
          print(d.get('deploy', d).get('id', ''))
          " > /tmp/deploy_id
            echo "triggered deploy: $(cat /tmp/deploy_id)"
          fi
          echo "$SVC" > /tmp/svc_id
          echo "service: $SVC"

      - name: Wait for the deploy, then read the dashboard back
        if: ${{ inputs.confirm == 'APPLY' }}
        run: |
          set -euo pipefail
          SVC="$(cat /tmp/svc_id)"
          PUBLIC_URL="https://${SERVICE_NAME}.onrender.com"

          # On the CREATE path there is no POST /deploys — creating the service
          # starts one — so there is no id to follow and the latest deploy IS
          # ours. On the update path we follow the id the POST returned.
          DEPLOY_ID=""
          [ -f /tmp/deploy_id ] && DEPLOY_ID="$(cat /tmp/deploy_id)"
          if [ -n "$DEPLOY_ID" ]; then
            DEPLOY_URL="https://api.render.com/v1/services/${SVC}/deploys/${DEPLOY_ID}"
            echo "following deploy ${DEPLOY_ID}"
          else
            DEPLOY_URL="https://api.render.com/v1/services/${SVC}/deploys?limit=1"
            echo "no deploy id (service was just created) — following the latest"
          fi

          # 🔴 A POLL THAT RUNS OUT OF PATIENCE MUST FAIL, NOT FALL THROUGH.
          #
          # Without `REACHED_LIVE` this loop simply ends after 20 minutes and the
          # step continues to the read-back. On the UPDATE path the PREVIOUS
          # image is still serving, so the public URL answers 200, the "sign in"
          # grep passes, and the summary prints "Towing app deployed" for a build
          # still stuck in `update_in_progress`. That is this repository's
          # signature failure — a green run reporting a deploy that never landed
          # — and it is worth more than the twenty minutes it costs to catch.
          REACHED_LIVE=0
          for i in $(seq 1 60); do
            STATUS="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Accept: application/json' "$DEPLOY_URL" \
              | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          # The list form returns [] for a few seconds after a service is
          # created. d[0] on an empty list is an IndexError that would kill this
          # step with a traceback AFTER the service already exists.
          if isinstance(d, list):
              d = d[0] if d else {}
          print(d.get('deploy', d).get('status', 'pending'))
          ")"
            echo "  deploy status: $STATUS"
            case "$STATUS" in
              live) REACHED_LIVE=1; break ;;
              build_failed|update_failed|canceled|deactivated)
                echo "::error::deploy ended as $STATUS"; exit 1 ;;
            esac
            sleep 20
          done
          [ "$REACHED_LIVE" = "1" ] || {
            echo "::error::the deploy never reached 'live' in 20 minutes (last status: ${STATUS}). The previous image may still be serving, so do NOT read a 200 from the public URL as success."
            exit 1; }

          # 🔴 READ IT BACK THE WAY A VISITOR WOULD. Render calling a deploy
          # "live" proves its health path answered from inside its own network.
          # Keycloak reported /health/ready UP for THIRTY HOURS with a dead
          # database on this very account.
          # `-L`: `/` redirects to /operations/dashboard here (§18).
          for i in $(seq 1 20); do
            if ! CODE="$(curl -sL -o /tmp/live.html -w '%{http_code}' --max-time 120 "${PUBLIC_URL}/")"; then
              CODE=000
            fi
            [ "$CODE" = "200" ] && break
            echo "  app: $CODE (waiting)"
            sleep 15
          done
          [ "$CODE" = "200" ] || { echo "::error::${PUBLIC_URL} did not answer"; exit 1; }

          # The same assertion the container smoke test makes, repeated against
          # the DEPLOYED origin — because they are different claims. The image
          # served this correctly on a runner; whether Render's copy does, with
          # Render's environment, is the question this step exists for.
          grep -qi "sign in" /tmp/live.html || {
            echo "::group::served html"; head -c 2000 /tmp/live.html; echo "::endgroup::"
            echo "::error::the live towing app has no sign-in affordance — an operator has no way in"; exit 1; }
          echo "the live towing app serves and offers a way to sign in"

          {
            echo "### Towing app deployed"
            echo ""
            echo "- URL: ${PUBLIC_URL}"
            echo "- sign-in affordance: present"
            echo "- ten screens under /operations/*"
          } >> "$GITHUB_STEP_SUMMARY"
