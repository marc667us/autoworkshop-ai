# Put FORCE ROW LEVEL SECURITY back on every table that has RLS without it.
#
# 🔴 WHY THIS EXISTS. `archive-for-retirement.yml` lifts FORCE so the table
# owner can read its own rows, and restores it in `always()`. On 2026-08-21 the
# lift step failed PART WAY THROUGH -- after altering some tables -- and the
# restore step then failed too, because it depends on the same connection that
# had just broken. `check-rls-force.yml` measured the result:
#
#     RESULT: forced=113  rls_without_force=3
#
# Three tables were left with RLS enabled and FORCE off. That means their OWNER
# is no longer subject to the policies. It is not a full exposure -- every role
# the application connects as is a non-owner and remains subject -- but it is a
# weakening of a Severity-1 control (CLAUDE.md §5) and it must not persist.
#
# THE LESSON, recorded because it is the actual defect: a restore step that
# reuses the connection whose failure triggered it is not a restore step. This
# one is independent, idempotent, and re-measures afterwards.

name: Repair RLS FORCE state

on:
  workflow_dispatch:

concurrency:
  group: render-db-firewall
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      DB_NAME: autoworkshop-postgres
      PGSSLMODE: require

    steps:
      - name: Install a client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          echo "PGBIN=$(dirname "$(which psql)")" >> "$GITHUB_ENV"

      - name: Find the database
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/postgres?limit=50" > /tmp/pg.json
          python3 - <<'PY'
          import json, os, sys, urllib.request
          rows = json.load(open('/tmp/pg.json'))
          found = next((r.get('postgres', r) for r in rows
                        if (r.get('postgres', r) or {}).get('name') == os.environ['DB_NAME']), None)
          if not found:
              sys.exit("::error::database not found")
          open('/tmp/db_id', 'w').write(found['id'])
          req = urllib.request.Request(
              f"https://api.render.com/v1/postgres/{found['id']}/connection-info",
              headers={"Authorization": f"Bearer {os.environ['RENDER_API_KEY']}"})
          with urllib.request.urlopen(req, timeout=30) as r:
              info = json.load(r)
          open('/tmp/src_url', 'w').write(
              info.get('externalConnectionString') or info['internalConnectionString'])
          PY
          echo "::add-mask::$(cat /tmp/src_url)"

      - name: Allow this runner through the firewall
        run: |
          set -euo pipefail
          ID="$(cat /tmp/db_id)"
          IP="$(curl -sS --max-time 20 https://api.ipify.org)"
          curl -sS -o /tmp/pg_one.json -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/postgres/${ID}"
          python3 - "$IP" <<'PY'
          import json, sys
          d = json.load(open('/tmp/pg_one.json'))
          d = d.get('postgres', d)
          raw = d.get('ipAllowList') or []
          original = [e for e in raw if 'ephemeral:' not in (e.get('description') or '')]
          json.dump(original, open('/tmp/ip_allow_original.json', 'w'))
          json.dump({'ipAllowList': original + [{'cidrBlock': f'{sys.argv[1]}/32',
                     'description': 'ephemeral: repair-rls-force run'}]},
                    open('/tmp/patch.json', 'w'))
          PY
          curl -sS -o /dev/null -X PATCH -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' --data @/tmp/patch.json \
            "https://api.render.com/v1/postgres/${ID}"
          SRC="$(cat /tmp/src_url)"
          for i in $(seq 1 30); do
            "$PGBIN/psql" -tAc 'SELECT 1' "$SRC" >/dev/null 2>&1 && { echo "reachable after $((i*5))s"; break; }
            [ "$i" -lt 30 ] || { echo "::error::unreachable"; exit 1; }
            sleep 5
          done

      - name: Repair
        run: |
          set -euo pipefail
          SRC="$(cat /tmp/src_url)"

          echo "=== BEFORE ==="
          "$PGBIN/psql" -tA -c "
            SELECT n.nspname||'.'||c.relname
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE c.relkind='r' AND c.relrowsecurity AND NOT c.relforcerowsecurity
            ORDER BY 1" "$SRC" | tee /tmp/before.txt

          # One statement, server-side. A loop of psql calls is what failed
          # last time: each is a fresh connection and any one of them can drop.
          "$PGBIN/psql" -v ON_ERROR_STOP=1 "$SRC" <<'SQL'
          DO $$
          DECLARE t record; n int := 0;
          BEGIN
            FOR t IN
              SELECT n.nspname AS s, c.relname AS r
              FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE c.relkind = 'r' AND c.relrowsecurity AND NOT c.relforcerowsecurity
            LOOP
              EXECUTE format('ALTER TABLE %I.%I FORCE ROW LEVEL SECURITY', t.s, t.r);
              n := n + 1;
            END LOOP;
            RAISE NOTICE 'FORCE restored on % table(s)', n;
          END $$;
          SQL

          echo "=== AFTER ==="
          UNFORCED="$("$PGBIN/psql" -tAc "
            SELECT count(*) FROM pg_class c
            WHERE c.relkind='r' AND c.relrowsecurity AND NOT c.relforcerowsecurity" "$SRC")"
          FORCED="$("$PGBIN/psql" -tAc "
            SELECT count(*) FROM pg_class c WHERE c.relkind='r' AND c.relforcerowsecurity" "$SRC")"
          echo "RESULT: forced=$FORCED  rls_without_force=$UNFORCED"
          [ "$UNFORCED" = "0" ] \
            && echo "✅ FORCE is intact on every RLS table" \
            || { echo "::error::$UNFORCED still without FORCE"; exit 1; }

      - name: Remove the ephemeral firewall entry
        if: always()
        run: |
          set -euo pipefail
          [ -f /tmp/db_id ] || exit 0
          python3 -c "import json;json.dump({'ipAllowList':json.load(open('/tmp/ip_allow_original.json'))},open('/tmp/r.json','w'))"
          curl -sS -o /dev/null -X PATCH -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' --data @/tmp/r.json \
            "https://api.render.com/v1/postgres/$(cat /tmp/db_id)"
