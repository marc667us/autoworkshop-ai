# Back up the PRODUCTION database — and prove the backup by restoring it.
#
# ══════════════════════════════════════════════════════════════════════════════
# 🔴 WHY THIS EXISTS: THE EXISTING BACKUP SYSTEM BACKS UP THE WRONG DATABASE
#
# `infrastructure/backup/` is thorough. It takes encrypted physical and logical
# backups, checksums them, writes a manifest, copies off-host, rotates
# retention, and `restore-drill.sh` restores into a throwaway cluster and
# measures RTO and RPO. It has passed 4/4 drills at RPO 0. Four Windows
# scheduled tasks run it. `check-backup-health.sh` reports HEALTHY 7/7.
#
# Every one of those numbers is about the LOCAL DOCKER CONTAINER `aw-postgres`.
# Not one file under `infrastructure/backup/` mentions `onrender`, `RENDER` or
# `DATABASE_URL`. So on 2026-08-13, production held 79 applied migrations and
# the entire 08-11 sample population — 10 workshops, 10 suppliers, 20 customers,
# 20 vehicles — with NO BACKUP OF ANY KIND, underneath a green backup system.
#
# That is this repository's most expensive recurring defect in its purest form:
# not a broken thing, but a CORRECT BELIEF ABOUT THE WRONG THING.
#
# And there is a date on it. `autoworkshop-postgres` is on Render's FREE plan,
# which is deleted after 30 days: `expiresAt` reads 2026-09-01. The provisioning
# workflow's own header called that out when it created the database — *"the
# expiry is a real date, not a footnote, and the backup drill that already runs
# in this repo must point at it before anything depends on it"*. Things then
# depended on it for six weeks.
#
# ══════════════════════════════════════════════════════════════════════════════
# WHAT MAKES THIS A BACKUP RATHER THAN A FILE
#
# 🔴 IT RESTORES WHAT IT DUMPED, IN THE SAME RUN, AND COMPARES ROW COUNTS.
# A dump that has never been restored is a hypothesis. This repository already
# learned that the expensive way: WAL archiving was recorded as "done and
# VERIFIED live" when the verification had only read the settings back —
# `pg_stat_archiver` said `archived_count=0, failed_count=864` and there had
# been no point-in-time recovery at all.
#
# So the job dumps production, restores into a throwaway Postgres service
# container, and asserts the row counts match table for table. If the restore
# disagrees with the source, the run FAILS and no artifact is presented as a
# backup.
#
# READ-ONLY AGAINST PRODUCTION. `pg_dump` only. Nothing is written, altered or
# dropped on the live database by this workflow, ever.
name: Backup production DB

on:
  workflow_dispatch:
  schedule:
    # Daily. ⚠️ GitHub delivers this repo's crons at roughly 0.6 runs/hour
    # whatever is requested — measured across eight workflows — so treat the
    # cadence as "about daily, sometimes not", and dispatch by hand before
    # anything irreversible.
    - cron: '17 3 * * *'

concurrency:
  # A6 — ALL of these open the production database firewall by PATCHing the
  # WHOLE ipAllowList, so they must never overlap. Render has no atomic
  # per-entry operation, so every capture/add/restore is a read-modify-write on
  # one shared resource. It races at least THREE ways:
  #   1. FILTERED CAPTURE (apply-migrations, backup-production-db,
  #      rehearse-migration) drops every entry containing 'ephemeral:' when
  #      building its snapshot. It cannot tell a dead run's entry from a LIVE
  #      one's, so it deletes a running job's entry the moment it starts.
  #   2. UNFILTERED RESTORE (the other twelve) restores a snapshot taken before
  #      another run added its entry, deleting it on the way out.
  #   3. CONCURRENT ADD (any two unfiltered runs) — both GET the same original
  #      list, then both PATCH 'original + mine'. The second add deletes the
  #      first run's entry before either restore happens.
  #   (and mixed order can RESURRECT a stale entry: an unfiltered run snapshots
  #    a foreign ephemeral entry and restores it after its owner removed it.)
  # The victim fails with 'SSL connection has been closed unexpectedly', which
  # is a LIE about the cause and reads as a database outage. At least six failed
  # runs on 2026-08-14 were this.
  #
  # ⚠️ A RETRY IS NOT A FIX — five retries failed identically, because the entry
  # stays deleted. And "remove only MY entry" is still racy: the API takes the
  # whole list.
  #
  # 🔴 THE COST OF THIS MUTEX, STATED PLAINLY — GITHUB'S WAITING ROOM HOLDS ONE.
  # A concurrency group is NOT a fifteen-deep FIFO queue. GitHub keeps at most
  # ONE pending run per group and REPLACES it when a newer one arrives, with no
  # ordering guarantee. So a pending deploy-api, migration APPLY, seed or backup
  # can be silently discarded by a newer arrival — and apply-migrations runs
  # automatically after EVERY Release, so automatic inspections compete with
  # deliberate operator requests. A cancelled PENDING run is firewall-safe (it
  # never opened anything) but the REQUEST IS LOST, not merely delayed.
  # ▶ THEREFORE: after dispatching any of these, capture the run id and confirm
  #   it actually STARTED. `gh run list --workflow=<wf> -L 3 --json databaseId,status`
  #   A 'cancelled' run you did not cancel is an evicted request — re-dispatch it.
  #
  # ⚠️ cancel-in-progress MUST stay false: cancelling a run mid-window would
  # leave its ephemeral entry live on the production firewall. But it does NOT
  # close every such path — a job timeout, a manual/API cancellation or runner
  # loss can still kill a run between its add PATCH and its restore step, and an
  # `if: always()` restore is not a reliable finally block against those. The
  # filtered-capture workflows clean up a stale entry on their next run; until
  # then the exposure is real.
  group: production-db-firewall
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    # A6 — bounded because this job HOLDS THE SHARED FIREWALL QUEUE. Measured
    # duration is 1 minute across the last three successful runs; 45 is
    # deliberately the most generous of the three bounds because this is the one
    # whose runtime GROWS WITH THE DATABASE, and a backup cut short is worse
    # than a queue held long. Revisit if a real backup ever approaches it.
    timeout-minutes: 45

    services:
      # The restore target. Throwaway, per-run, and never reachable from
      # production — which is the point: a restore that shared anything with the
      # source would not prove the dump stands alone.
      verify:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verify-only-not-a-real-secret
          POSTGRES_DB: verify
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      DB_NAME: autoworkshop-postgres
      # Applies to psql AND pg_dump identically, which a URL parameter
      # appended in one place did not.
      PGSSLMODE: require

    steps:
      - uses: actions/checkout@v4

      # ⚠️ CLIENT 17 AGAINST A SERVER 16, DELIBERATELY, AND THAT IS NOT THE
      # OBVIOUS CHOICE — SO HERE IS THE EVIDENCE.
      #
      # The probe printed `PostgreSQL 16.14`, so matching the server looked
      # right and I pinned client 16. Every connection then failed, INCLUDING
      # psql's: that run's whole probe step finished in 0.55s having printed
      # nothing, where the client-17 run took 0.75s and returned the version
      # string. The only configuration in which anything has connected to this
      # database from a runner is client 17 — which is also what
      # `apply-migrations.yml` pins, and it has been reaching this database for
      # weeks.
      #
      # ⚠️ SO "MATCH THE SERVER VERSION" IS THE WRONG RULE HERE and it cost a
      # run to learn. pg_dump refuses a server NEWER than itself; it is happy
      # with an older one. The binding constraint is whatever Render's endpoint
      # will negotiate, and only 17 has.
      #
      # 🔴 THE REMAINING FAILURE IS pg_dump-SPECIFIC AND UNEXPLAINED. psql
      # connects on 17 and pg_dump does not, sharing one libpq and one string.
      # SSL is now requested through PGSSLMODE rather than a URL parameter, so
      # the two are configured identically and the difference cannot be the
      # string. If it still fails, that is the finding, and the probe's own
      # output is the evidence to read next — not another theory.
      #
      # The full path, not bare `pg_dump`: Ubuntu runners ship their own client
      # on PATH and it is not this one.
      - name: Install a matching client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg >/dev/null
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          echo "PGBIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Find the database and take its connection string
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/postgres?limit=50" > /tmp/pg.json

          python3 - <<'PY'
          import json, os, sys, urllib.request
          rows = json.load(open('/tmp/pg.json'))
          want = os.environ['DB_NAME']
          found = None
          for r in rows:
              d = r.get('postgres', r)
              if d.get('name') == want:
                  found = d
          if not found:
              sys.exit(f"::error::no database named {want}")

          # THE EXPIRY IS PRINTED EVERY RUN, on purpose. A date six weeks away
          # is a footnote; a date printed next to a successful backup is a
          # countdown somebody reads.
          print(f"database : {found.get('name')}  id={found.get('id')}")
          print(f"plan     : {found.get('plan')}   status={found.get('status')}")
          print(f"EXPIRES  : {found.get('expiresAt')}")
          open('/tmp/db_id', 'w').write(found['id'])

          req = urllib.request.Request(
              f"https://api.render.com/v1/postgres/{found['id']}/connection-info",
              headers={"Authorization": f"Bearer {os.environ['RENDER_API_KEY']}"})
          with urllib.request.urlopen(req, timeout=30) as r:
              info = json.load(r)
          url = info.get('externalConnectionString') or info.get('internalConnectionString')
          if not url:
              sys.exit('::error::no connection string in the response')
          open('/tmp/dburl', 'w').write(url)
          # Host only — never the credentials.
          print('connection acquired for', url.split('@')[-1].split('/')[0][:6] + '…')
          PY
          chmod 600 /tmp/dburl

      # ⚠️ A SINGLE /32 FOR THIS RUNNER, NOT 0.0.0.0/0. A GitHub runner takes a
      # different public address every run, so the lazy fix is to open the
      # database to the whole internet and leave it that way. This adds only the
      # address in use and RESTORES THE ORIGINAL LIST in an `if: always()` step,
      # so a failed run cannot leave the database more exposed than it found it.
      - name: Allow this runner through the database firewall
        run: |
          set -euo pipefail
          ID="$(cat /tmp/db_id)"
          IP="$(curl -sS --max-time 20 https://api.ipify.org)"
          echo "$IP" | grep -Eq '^[0-9.]+$' || { echo "::error::could not read runner IP"; exit 1; }
          echo "runner address: $IP"

          curl -sS -o /tmp/pg_one.json \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' \
            "https://api.render.com/v1/postgres/${ID}"

          python3 - "$IP" <<'PY'
          import json, sys
          ip = sys.argv[1]
          d = json.load(open('/tmp/pg_one.json'))
          d = d.get('postgres', d)
          # 🔴 A LEFTOVER EPHEMERAL ENTRY MUST NEVER BECOME PERMANENT.
          #
          # On 2026-08-07 a run's restore PATCH returned 200 and the read-back
          # still saw the entry, so the job failed with the entry live on the
          # production database. The next run would then have captured THAT list
          # as "original" and written it back faithfully — baking a GitHub
          # runner's IP into the firewall for ever, with every subsequent run
          # re-blessing it.
          #
          # So the snapshot is FILTERED: anything this pipeline previously added
          # is dropped on capture. That makes a crashed or half-failed run
          # self-healing — the next run cleans up after it — instead of
          # compounding.
          raw = d.get('ipAllowList') or []
          original = [e for e in raw
                      if 'ephemeral:' not in (e.get('description') or '')]
          stale = len(raw) - len(original)
          if stale:
              print(f'dropping {stale} leftover ephemeral entr'
                    f'{"y" if stale == 1 else "ies"} from a previous run')
          json.dump(original, open('/tmp/ip_allow_original.json', 'w'))
          print('existing allow list entries:', len(original))
          merged = list(original) + [{'cidrBlock': f'{ip}/32',
                                      'description': 'ephemeral: backup-production-db run'}]
          json.dump({'ipAllowList': merged}, open('/tmp/ip_allow_patch.json', 'w'))
          PY

          code="$(curl -sS -o /tmp/patch_out.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data @/tmp/ip_allow_patch.json \
            "https://api.render.com/v1/postgres/${ID}")"
          echo "PATCH ipAllowList -> $code"
          [ "$code" = "200" ] || { echo "::error::could not update the allow list"; cat /tmp/patch_out.json; exit 1; }

          # Render applies the rule asynchronously; connecting immediately races it.
          sleep 20

      # 🔴 A PROBE, BECAUSE I HAVE GUESSED THE CAUSE TWICE AND BEEN WRONG TWICE.
      #
      # `pg_dump` fails here with "SSL connection has been closed unexpectedly"
      # in about 0.2s. I blamed TLS (added sslmode=require — identical failure)
      # and then the database firewall (opened a /32, PATCH 200, waited 20s —
      # identical failure). Meanwhile `apply-migrations.yml` reaches this exact
      # host with `psql` and the exact same connection string, successfully, in
      # the same minute.
      #
      # So the question is no longer "why can nothing connect" — something can.
      # It is "what differs between psql here and psql there", and the cheapest
      # way to find out is to run psql HERE, on the same string, immediately
      # before pg_dump. Two outcomes, both informative:
      #
      #   · psql succeeds and pg_dump fails → it is pg_dump-specific (protocol,
      #     version negotiation, or something Render's endpoint refuses).
      #   · psql fails too → it is this JOB's environment, and the obvious
      #     suspect is the `services:` container this workflow has and
      #     apply-migrations.yml does not.
      #
      # `continue-on-error` so the probe REPORTS rather than replaces the real
      # failure — a diagnostic that halts the run tells you less than one that
      # lets the run reach its actual error.
      - name: Probe the connection with psql before dumping
        continue-on-error: true
        run: |
          set -uo pipefail
          SRC="$(cat /tmp/dburl)"
          echo "--- psql, connection string exactly as Render gave it ---"
          "$PGBIN/psql" "$SRC" -tA -c "select version()" || echo "psql(bare) FAILED rc=$?"
          echo "--- psql again (PGSSLMODE=require is set for the whole job) ---"
          "$PGBIN/psql" "$SRC" -tA -c "select 1" || echo "psql(ssl) FAILED rc=$?"
          echo "--- pg_dump, schema only, no data ---"
          "$PGBIN/pg_dump" --schema-only --no-owner --no-acl -f /tmp/probe.sql "$SRC" \
            && echo "pg_dump(schema-only) OK $(wc -c < /tmp/probe.sql) bytes" \
            || echo "pg_dump(schema-only) FAILED rc=$?"

      - name: Dump production (read-only)
        run: |
          set -euo pipefail
          # ⚠️ `sslmode=require` IS KEPT AND IS NOT WHAT WAS WRONG. I wrote a
          # confident comment here claiming it was — "measured, not guessed" —
          # and then re-ran with it applied and got the IDENTICAL failure in the
          # identical 0.18s. Correcting it rather than deleting it: an assertion
          # of cause that was never tested against the fix is exactly the shape
          # of error this file's header is about.
          #
          # 🔴 THE REAL CAUSE IS RENDER'S DATABASE FIREWALL. `autoworkshop-postgres`
          # carries an `ipAllowList`, and a runner that is not on it has its
          # socket dropped after the TCP handshake — which libpq reports as "SSL
          # connection has been closed unexpectedly", so it reads like TLS and is
          # not. `apply-migrations.yml` reaches this same host because it PATCHes
          # the runner's /32 into the allow-list first and always restores it
          # after; this workflow does not, which is why it cannot connect at all.
          #
          # ▶ STILL TO DO: copy that open-and-always-restore pair from
          # `apply-migrations.yml` (steps "Allow this runner through the database
          # firewall" and "Always restore the database firewall"). A single /32,
          # never 0.0.0.0/0, and the restore must run even when the job fails —
          # a leftover ephemeral entry becomes permanent otherwise, which that
          # workflow already found once.
          SRC="$(cat /tmp/dburl)"

          # 🔴 DUMP ONLY THE SCHEMAS THIS USER OWNS — AND THIS IS THE ACTUAL BUG
          # THAT FOUR EARLIER THEORIES MISSED.
          #
          # KEYCLOAK SHARES THIS DATABASE. Its Liquibase tables live alongside
          # ours and the application user cannot read them, so a whole-database
          # pg_dump hit `permission denied for table databasechangeloglock`, and
          # the server then dropped the socket — which libpq reports as "SSL
          # connection has been closed unexpectedly". That message names TLS and
          # is a permissions error. It cost diagnoses of TLS, the firewall, and
          # the client version before the probe printed the real line.
          #
          # ⚠️ SCHEMAS ARE DISCOVERED, NOT LISTED. Hardcoding today's schema
          # names would silently stop backing up the next one somebody adds —
          # a backup that quietly narrows is worse than one that fails.
          # WHICH SCHEMAS TO DUMP — resolved by a query in a FILE, not in a
          # -c "..." argument.
          #
          # 🔴 THE PREVIOUS VERSION PASSED THIS SQL AS A DOUBLE-QUOTED SHELL
          # ARGUMENT AND THE STEP EXITED 2 IN 0.39s WITH NO OUTPUT AT ALL.
          # Exit 2 is bash refusing to parse, not a command failing — and a
          # multi-line SQL string carrying apostrophes ("Keycloak's own role",
          # "the APPLICATION'S data") and backticks inside a double-quoted
          # argument is exactly what it refuses. It also silently defeated the
          # ONE useful diagnostic in the step, because nothing ran to print
          # anything.
          #
          # A quoted heredoc ends the whole class: <<'SQL' passes the body
          # through verbatim, so apostrophes, backticks and dollars are just
          # characters. The SQL is then readable as SQL rather than as an
          # escaping puzzle.
          cat > /tmp/schemas.sql <<'SQL'
          SELECT string_agg('--schema=' || quote_ident(nspname), ' ')
          FROM pg_namespace n
          WHERE nspname NOT LIKE 'pg\_%'
            AND nspname <> 'information_schema'
            -- Ours, by ownership.
            AND pg_catalog.pg_get_userbyid(n.nspowner) = current_user
            -- keycloak is OWNED by us and NOT READABLE by us: we created the
            -- schema so ownership says yes, Keycloak's own role owns the tables
            -- inside it so SELECT says no. That mismatch is what produced
            -- "permission denied for table databasechangeloglock" -- the error
            -- that libpq reports as "SSL connection has been closed
            -- unexpectedly", which cost three wrong diagnoses.
            --
            -- Excluded on merit, not to make the dump pass: that data belongs to
            -- the identity server, has its own lifecycle, and has its own realm
            -- export under infrastructure/backup.
            AND nspname <> 'keycloak';
          SQL

          # ==================================================================
          # A BOUNDED RETRY ON THE CONNECTION, AND IT IS NOT A DIAGNOSIS.
          #
          # Measured, twice in a row on identical code: the FIRST psql in
          # this step fails before printing anything, with
          #
          #   psql: error: connection to server at ...render.com failed:
          #         SSL connection has been closed unexpectedly
          #
          # while the immediately preceding run on the same commit
          # connected, discovered 18 schemas and produced a 1,007,752-byte
          # dump. So the fix works and the CONNECTION is what is flaky.
          #
          # This is a FREE Render Postgres and it was hit hard on
          # 2026-08-14: three UAT seed runs, two diagnostics, four backup
          # attempts and a live suite, each opening and closing the
          # firewall. A connection cap or a throttle would look exactly
          # like this. That is a HYPOTHESIS and it is deliberately not
          # asserted anywhere else -- this repository has paid five times
          # for a confident diagnosis of an error whose text was a lie,
          # and this is the same error text.
          #
          # So the retry is honest resilience, not an explanation. It
          # cannot mask a bad backup: the restore-and-compare below still
          # has to reproduce production row for row, and a connection that
          # never succeeds still fails the run loudly after five tries.
          # ==================================================================
          for attempt in 1 2 3 4 5; do
            if "$PGBIN/psql" -tA -c "select 1" "$SRC" >/dev/null 2>/tmp/conn.err; then
              echo "connected on attempt ${attempt}"
              break
            fi
            echo "attempt ${attempt} failed: $(cat /tmp/conn.err)"
            if [ "$attempt" -ge 5 ]; then
              echo "::error::could not connect to production after 5 attempts"
              exit 1
            fi
            sleep $(( attempt * 20 ))
          done

          SCHEMAS="$("$PGBIN/psql" -tA -f /tmp/schemas.sql "$SRC")"
          [ -n "$SCHEMAS" ] || { echo "::error::no schemas owned by this user — refusing to write an empty backup"; exit 1; }
          echo "dumping schemas: $SCHEMAS"

          STAMP="$(date -u '+%Y%m%dT%H%M%SZ')"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

          # 🔴 THE LOG IS SHOWN ON FAILURE, AND THE FIRST VERSION OF THIS STEP
          # COULD NOT DO THAT. It sent stderr to a file and printed it only in
          # the size-check branch below — but under `set -e` a failing pg_dump
          # exits the script before that line is ever reached, so the run died in
          # 0.2s having printed NOTHING AT ALL about why. A diagnostic that only
          # prints on the success path is not a diagnostic.
          trap 'echo "::group::pg_dump output"; cat /tmp/dump.log 2>/dev/null; echo "::endgroup::"' EXIT

          # Custom format: compressed, and `pg_restore` can read it selectively.
          # --no-owner/--no-acl so it restores anywhere, which is the whole point
          # of holding it — the destination will not have Render's role names.
          # ══════════════════════════════════════════════════════════════════
          # 🔴 `$SCHEMAS` IS PASSED HERE, AND UNTIL NOW IT WAS NOT.
          #
          # It was computed on line 341, guarded against emptiness on 342, and
          # echoed on 343 — and then never reached this command. The comment
          # 70 lines above says "DUMP ONLY THE SCHEMAS THIS USER OWNS — AND
          # THIS IS THE ACTUAL BUG". The diagnosis was right, the query was
          # right, the guard was right, and the fix was never wired in. So
          # pg_dump kept dumping the WHOLE database and kept dying on
          # `permission denied for table databasechangeloglock`, which libpq
          # reports as "SSL connection has been closed unexpectedly" — the
          # error that has now cost five wrong diagnoses across two sessions.
          #
          # This is the repository's most-repeated defect verbatim: config
          # reads correct while the mechanism is INERT, and a comment claiming
          # a safety net that does not exist. Recorded rather than quietly
          # fixed, because the previous session closed believing the remaining
          # work was one flag.
          #
          # ⚠️ `$SCHEMAS` IS DELIBERATELY UNQUOTED. It holds several arguments
          # ("--schema=identity --schema=core ..."), so word-splitting is the
          # mechanism, not an accident. Quoting it would pass one nonsense
          # argument and pg_dump would refuse it.
          #
          # ⚠️ AND THE LIQUIBASE TABLES ARE EXCLUDED BY NAME. Keycloak's
          # bookkeeping lives in `public`, not in the `keycloak` schema, so
          # restricting to owned SCHEMAS does not exclude it: we own `public`,
          # and `databasechangelog`/`databasechangeloglock` inside it belong to
          # Keycloak's role and refuse our SELECT. Both halves are required —
          # either alone still fails.
          # ══════════════════════════════════════════════════════════════════
          # ==================================================================
          # FORCE ROW LEVEL SECURITY IS WHY THIS HAS NEVER PRODUCED A DUMP,
          # AND IT IS A DIFFERENT PROBLEM FROM THE keycloak ONE.
          #
          # With the schema list finally applied the dump got past keycloak,
          # read every catalogue, and died on the first table of DATA:
          #
          #   ERROR: query would be affected by row-level security policy
          #          for table "proposals"
          #
          # pg_dump sets row_security=off and Postgres REFUSES rather than
          # returning a filtered subset. That refusal is correct, and it is
          # the only reason this was not a silently half-empty backup months
          # ago. On Render the owner is NOT a superuser, so FORCE RLS binds
          # it.
          #
          # Two halves, both required:
          #
          #   PGOPTIONS opens the platform-admin escape AT CONNECTION TIME.
          #   identity.is_platform_admin() requires the GUC AND current_user
          #   = owner of identity.platform_administrators, so the setting
          #   alone confers nothing - any role can write a GUC. Measured:
          #   true with it, false without.
          #
          #   --enable-row-security tells pg_dump to evaluate the policies
          #   instead of refusing. With the escape open every policy admits
          #   every row.
          #
          # THE DANGER THIS CREATES, NAMED: --enable-row-security means a
          # policy that does NOT honour the escape yields a SILENTLY PARTIAL
          # dump - the worst failure a backup has, because it succeeds. The
          # restore-and-compare below is what makes that loud, and its
          # source-side counts had to be fixed to run under the same escape
          # or BOTH sides would have read zero and "matched".
          # ==================================================================
          PGOPTIONS='-c app.current_role=admin' \
          "$PGBIN/pg_dump" --format=custom --no-owner --no-acl --verbose \
            --enable-row-security \
            $SCHEMAS \
            --exclude-table='public.databasechangelog' \
            --exclude-table='public.databasechangeloglock' \
            --file="/tmp/autoworkshop-${STAMP}.dump" "$SRC" 2> /tmp/dump.log

          ls -lh "/tmp/autoworkshop-${STAMP}.dump"
          sha256sum "/tmp/autoworkshop-${STAMP}.dump" | tee "/tmp/autoworkshop-${STAMP}.sha256"

          # 🔴 A ZERO-BYTE OR TINY DUMP IS A FAILURE, NOT A BACKUP. pg_dump can
          # exit 0 having written almost nothing if it connects to an empty
          # database — which is exactly what a wrong connection string produces.
          SIZE=$(stat -c%s "/tmp/autoworkshop-${STAMP}.dump")
          echo "dump size: $SIZE bytes"
          [ "$SIZE" -gt 100000 ] || {
            echo "::error::dump is only ${SIZE} bytes — that is not this database"
            tail -30 /tmp/dump.log; exit 1; }

      - name: Record what production actually holds
        run: |
          set -euo pipefail
          "$PGBIN/psql" -v ON_ERROR_STOP=1 "$(cat /tmp/dburl)" -tA -F'|' -c "
            SELECT n.nspname || '.' || c.relname, c.reltuples::bigint
            FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE c.relkind = 'r'
              AND n.nspname NOT LIKE 'pg\_%'
              AND n.nspname <> 'information_schema'
              AND pg_catalog.pg_get_userbyid(n.nspowner) = current_user
              AND n.nspname <> 'keycloak'
            ORDER BY 1;" > /tmp/source-tables.txt
          echo "tables in production: $(wc -l < /tmp/source-tables.txt)"
          head -25 /tmp/source-tables.txt

      # ⚠️ THIS STEP IS WHAT MAKES THE ARTIFACT A BACKUP. Everything above it
      # produces a file; this produces the evidence that the file is restorable.
      - name: Restore into a throwaway database and compare
        env:
          PGPASSWORD: verify-only-not-a-real-secret
        run: |
          set -euo pipefail
          # sslmode=disable IN THE STRING, because PGSSLMODE=require is set
          # for the whole job and the throwaway verify container does not speak
          # SSL at all:
          #
          #   psql: error: connection to server at "127.0.0.1", port 5432
          #         failed: server does not support SSL, but SSL was required
          #
          # The job-wide setting is correct for PRODUCTION and must stay. An
          # explicit connection parameter beats the environment variable in
          # libpq, so naming it here overrides it for this one target without
          # weakening anything that talks to Render.
          TARGET="postgresql://postgres@127.0.0.1:5432/verify?sslmode=disable"

          # ══════════════════════════════════════════════════════════════════
          # THE EXTENSIONS MUST EXIST BEFORE THE RESTORE, AND pg_dump WILL NOT
          # HAVE PUT THEM IN THE FILE.
          #
          # Measured: the restore produced 21 of production's 114 tables. The
          # cause is a documented pg_dump behaviour that is easy to walk into —
          # with --schema=, extensions are NOT dumped, because an extension
          # belongs to the DATABASE rather than to any one schema.
          #
          # 95 columns in this database default to uuid_generate_v4(). Without
          # uuid-ossp the target cannot create any of their tables, so 93 tables
          # failed and 21 survived. That arithmetic is the whole diagnosis.
          #
          # pg_trgm and btree_gist back 10 indexes. vector is installed on
          # production but ZERO columns use it, and it is not in the stock
          # postgres image — so it is attempted and its failure is tolerated,
          # rather than being allowed to fail a restore it cannot affect.
          #
          # NOTE THIS IS A PROPERTY OF THE BACKUP, NOT ONLY OF THIS TEST. Any
          # future restore of this dump — into Neon, into a new Render database,
          # onto a laptop — needs the same three extensions created first. That
          # is now written down here rather than discovered during a recovery.
          # ══════════════════════════════════════════════════════════════════
          for x in '"uuid-ossp"' 'pg_trgm' 'btree_gist'; do
            "$PGBIN/psql" -v ON_ERROR_STOP=1 "$TARGET" -c "CREATE EXTENSION IF NOT EXISTS $x;" \
              || { echo "::error::could not create extension $x in the restore target"; exit 1; }
          done
          # Unused by any column; tolerated because the stock image lacks it.
          "$PGBIN/psql" "$TARGET" -c 'CREATE EXTENSION IF NOT EXISTS vector;' \
            >/dev/null 2>&1 || echo "note: pgvector unavailable in the target, and no column uses it"

          # `pg_restore` reports errors for objects it cannot recreate (roles,
          # extensions it lacks). Those are expected here and are NOT the thing
          # being tested — the row counts are. So its exit code is recorded and
          # deliberately not used as the verdict.
          set +e
          "$PGBIN/pg_restore" --no-owner --no-acl --dbname="$TARGET" \
            "/tmp/autoworkshop-${STAMP}.dump" 2> /tmp/restore.log
          RC=$?
          set -e
          echo "pg_restore exit ${RC} (not the verdict — row counts are)"
          # THE RESTORE LOG IS PRINTED. It was written to a file and never
          # shown, so when the restore produced 21 of 114 tables there was
          # nothing to read and the cause had to be inferred. This file already
          # says of the dump log that "a diagnostic that only prints on the
          # success path is not a diagnostic"; this one printed on no path at
          # all. Truncated because a failed restore can emit thousands of
          # identical lines, and the first ones carry the cause.
          echo "::group::pg_restore output (first 60 lines of $(grep -ci error /tmp/restore.log || echo 0) error lines)"
          head -60 /tmp/restore.log || true
          echo "::endgroup::"

          "$PGBIN/psql" -v ON_ERROR_STOP=1 "$TARGET" -tA -F'|' -c "
            SELECT n.nspname || '.' || c.relname, c.reltuples::bigint
            FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE c.relkind = 'r'
              AND n.nspname NOT IN ('pg_catalog','information_schema')
            ORDER BY 1;" > /tmp/restored-tables.txt

          SRC_N=$(cut -d'|' -f1 /tmp/source-tables.txt | sort | wc -l)
          DST_N=$(cut -d'|' -f1 /tmp/restored-tables.txt | sort | wc -l)
          echo "tables: production=${SRC_N}  restored=${DST_N}"

          MISSING=$(comm -23 <(cut -d'|' -f1 /tmp/source-tables.txt | sort) \
                             <(cut -d'|' -f1 /tmp/restored-tables.txt | sort))
          if [ -n "$MISSING" ]; then
            echo "::error::tables present in production and MISSING from the restore:"
            echo "$MISSING"
            exit 1
          fi

          # Compare live counts, not the planner's `reltuples` estimate, on the
          # tables that carry the data anybody would miss.
          # THE SOURCE COUNT RUNS UNDER THE SAME ESCAPE AS THE DUMP, AND
          # WITHOUT IT THE WHOLE COMPARISON WAS VACUOUS. These tables are
          # under FORCE RLS; a plain connection sees ZERO rows, so
          # production would have reported 0, the restore 0, they would
          # have "matched", and an empty backup would have been declared
          # verified. A check that passes by seeing nothing is the defect
          # shape this repository keeps recording.
          #
          # The list is wider than the original four and deliberately
          # includes what the 2026-08-14 UAT populated: a backup that
          # reproduces organisations but loses every job card and payment
          # is not a backup.
          for t in identity.organizations identity.memberships core.customers core.vehicles repair.job_cards finance.invoices finance.payments parts.stock_movements; do
            S=$(PGOPTIONS='-c app.current_role=admin' "$PGBIN/psql" -tA "$(cat /tmp/dburl)" -c "SELECT count(*) FROM $t" 2>/dev/null || echo skip)
            D=$("$PGBIN/psql" -tA "$TARGET" -c "SELECT count(*) FROM $t" 2>/dev/null || echo skip)
            printf '  %-28s production=%-8s restored=%-8s\n' "$t" "$S" "$D"
            if [ "$S" != "skip" ] && [ "$S" != "$D" ]; then
              echo "::error::$t differs — the dump does not reproduce production"; exit 1
            fi
          done
          echo "RESTORE VERIFIED — every production table is present and the sampled counts match"

      # ======================================================================
      # KEEP A DUMP THAT WAS PRODUCED EVEN WHEN THE VERIFICATION DID NOT RUN,
      # AND LABEL IT SO IT CANNOT BE MISTAKEN FOR A BACKUP.
      #
      # On 2026-08-14 this workflow produced a 1,007,752-byte dump — the
      # first it has ever produced — and then failed in the restore step
      # because PGSSLMODE=require was applied to a throwaway container with
      # no TLS. The upload sits after the compare, so the dump was DISCARDED.
      # A real dump of a database that expires on 2026-09-01 was thrown away
      # over an SSL flag in a verification container.
      #
      # This file opens by insisting a dump that has never been restored is
      # a hypothesis, and that remains right — so the fix is NOT to relax the
      # gate. The run still fails, the summary still says so, and the
      # artifact is named UNVERIFIED. What changes is only that the bytes
      # survive for a human to decide about, instead of being deleted by a
      # step that had nothing to do with the dump.
      # ======================================================================
      - name: Keep the dump even if the verification failed (labelled UNVERIFIED)
        if: always() && env.STAMP != ''
        uses: actions/upload-artifact@v4
        with:
          name: UNVERIFIED-autoworkshop-db-${{ env.STAMP }}
          path: |
            /tmp/autoworkshop-${{ env.STAMP }}.dump
            /tmp/autoworkshop-${{ env.STAMP }}.sha256
          retention-days: 90
          # Not an error: on a run that never got as far as dumping there is
          # legitimately nothing to keep, and failing here would turn one
          # failure into two.
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: autoworkshop-db-${{ env.STAMP }}
          path: |
            /tmp/autoworkshop-${{ env.STAMP }}.dump
            /tmp/autoworkshop-${{ env.STAMP }}.sha256
            /tmp/source-tables.txt
          # 90 days. The database expires 2026-09-01; a backup that expired
          # first would be an elaborate way of losing the data on schedule.
          retention-days: 90
          if-no-files-found: error

      - name: Always restore the database firewall
        if: always()
        run: |
          set -euo pipefail
          [ -f /tmp/db_id ] || { echo "no database id — nothing to restore"; exit 0; }
          [ -f /tmp/ip_allow_original.json ] || { echo "allow list was never changed"; exit 0; }
          ID="$(cat /tmp/db_id)"
          python3 -c "
          import json
          json.dump({'ipAllowList': json.load(open('/tmp/ip_allow_original.json'))},
                    open('/tmp/ip_allow_restore.json','w'))"
          code="$(curl -sS -o /tmp/restore_out.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data @/tmp/ip_allow_restore.json \
            "https://api.render.com/v1/postgres/${ID}")"
          echo "restore ipAllowList -> $code"
          [ "$code" = "200" ] || { echo "::error::FAILED TO RESTORE the allow list — do it by hand"; exit 1; }

          # Read it back. A 200 is the API accepting the request, not proof the
          # ephemeral entry is gone.
          #
          # ⚠️ POLLED, NOT READ ONCE. Render applies an ipAllowList change
          # ASYNCHRONOUSLY, so an immediate read can still show the old list —
          # which is exactly how a run whose restore had genuinely worked failed
          # on 2026-08-07 and left the job red with the entry apparently live.
          # Six attempts over ~30s, and it only fails if the entry is still
          # there at the end.
          for attempt in 1 2 3 4 5 6; do
            curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' \
              "https://api.render.com/v1/postgres/${ID}" -o /tmp/pg_after.json
            if python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/pg_after.json'))
          d = d.get('postgres', d)
          entries = d.get('ipAllowList') or []
          left = [e for e in entries if 'ephemeral:' in (e.get('description') or '')]
          print('allow list now:', len(entries), 'entries')
          sys.exit(1 if left else 0)
          PY
            then
              echo "ephemeral entry removed — verified by reading it back (attempt $attempt)"
              break
            fi
            if [ "$attempt" = "6" ]; then
              echo "::error::the ephemeral entry is STILL present after 6 reads over ~30s. REMOVE IT BY HAND in the Render dashboard: the production database is reachable from a GitHub runner IP."
              exit 1
            fi
            sleep 5
          done

      - name: Always remove the credential
        if: always()
        run: rm -f /tmp/dburl /tmp/pg.json /tmp/ip_allow_*.json
