# Render Blueprint — AutoWorkshop AI
#
# ⚠️ READ THIS BEFORE TRUSTING THE FILE. THIS BLUEPRINT IS DOCUMENTATION, NOT
# THE DEPLOY PATH. Production runs PREBUILT IMAGES (ADR-017): CI builds a
# container, smoke-tests it, pushes it to GHCR, and `deploy-web.yml` points the
# Render service at the tag. Render's own builder is out of the critical path
# entirely, because it fails `next build` for this repository with exit 1 and
# completely empty stderr — a fault that survived six attempts to diagnose and
# does not reproduce on Linux in GitHub Actions.
#
# The previous version of this file described a `runtime: node` service named
# `autoworkshop` that built `workshop-web` on Render's builder. That service was
# DELETED on 2026-08-13: it had no custom domain, had been suspended for billing,
# and `render-status.yml` had spent weeks reporting it as the retired one. A
# blueprint describing a service that does not exist is worse than no blueprint,
# which is why this is rewritten rather than left.
#
# ══════════════════════════════════════════════════════════════════════════════
# WHAT ACTUALLY RUNS (2026-08-13, after ADR-021)
#
#   autoworkshop-web       srv-d9ju49id0e5s7389fjlg   ONE Next.js process serving
#                                                     all seven packs. Holds
#                                                     autoworkshop.aiappinvent.com.
#   autoworkshop-keycloak  srv-d9ntf2u7bikc73cjq4e0   identity
#   autoworkshop-api       srv-d9o9m1flk1mc7384r3ng   NestJS, 13 domains
#   autoworkshop-postgres                             the database
#
# That is the Solar shape (`solarpro-global` + `solarpro-keycloak` + a database),
# which ADR-011 names as the reference. It replaced TEN services, of which two
# were suspended by the platform for `billing`.
#
# 🔴 `autoworkshop-postgres` IS ON THE FREE PLAN AND EXPIRES 2026-09-01.
# `COMBINED_PLAN_v2` §6 ruled out Render free Postgres by name because it expires
# at thirty days — the failure that took Solar down on 2026-07-09. Nothing in
# this file fixes that and nothing should pretend to.
#
# ZERO COST (ADR-012/016). A free web service sleeps after ~15 minutes idle and
# takes roughly 50 seconds to wake — measured here at 126–137 s for Keycloak.
# That is a property of the tier, not a fault. The free allowance is ~750
# instance-hours against a ~730-hour month, which fits about ONE always-on
# service; that arithmetic is the whole reason ADR-021 exists.

services:
  - type: web
    # THIS NAME IS LOAD-BEARING. Render derives `autoworkshop-web.onrender.com`
    # from it, and `autoworkshop.aiappinvent.com` is attached to this service.
    # Renaming it changes the hostname and detaches the domain.
    name: autoworkshop-web
    runtime: image
    plan: free
    region: oregon

    image:
      # Set per deploy by `deploy-web.yml`, which pins the commit SHA rather
      # than `latest` so a rollback names an exact artifact.
      url: ghcr.io/marc667us/autoworkshop-web:latest

    # `/` is the public marketplace and the ONE route that renders with neither
    # the API nor Keycloak reachable — so a health check here measures the app
    # rather than its dependencies. The old value, `/home/dashboard`, belonged
    # to workshop-web and now lives at `/workshop/home/dashboard`; left as it
    # was, this service would have failed its health check while serving
    # perfectly.
    healthCheckPath: /

    envVars:
      - key: NODE_VERSION
        value: 20.19.2

      - key: NODE_ENV
        value: production

      # REQUIRED TO SERVE A PAGE AT ALL, not merely to sign in. `auth` runs as
      # middleware on every non-public request and its config resolves this when
      # it is built, so an absent AUTH_SECRET is a 500 on every gated route.
      # `generateValue` has Render mint one and keep it — never commit a secret.
      - key: AUTH_SECRET
        generateValue: true

      # Auth.js v5 rejects an unrecognised Host by default and only auto-detects
      # Vercel. Behind Render's proxy that makes every `/api/auth/*` endpoint 500
      # while ordinary pages still return 200 — an asymmetry invisible to any
      # check that only loads a page. Keycloak's own `redirectUris` allow-list is
      # what actually constrains the callback.
      - key: AUTH_TRUST_HOST
        value: "true"

      - key: KEYCLOAK_URL
        value: https://autoworkshop-keycloak.onrender.com
      - key: KEYCLOAK_REALM
        value: autoworkshop

      - key: API_BASE_URL
        value: https://autoworkshop-api.onrender.com
